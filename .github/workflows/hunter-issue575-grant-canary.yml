name: Hunter / Issue 575 Grant Contract Canary

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/hunter-issue575-grant-canary.yml'
      - 'src/hunter/automation/workspace_grant_handoff.py'
      - 'src/hunter/automation/issue_agent_control.py'
      - 'scripts/hunter_issue_agent_lifecycle.py'
      - 'tests/test_workspace_grant_handoff_575.py'
      - 'tests/test_issue_agent_control.py'
  workflow_dispatch:
    inputs:
      canary:
        description: 'Owner-approved Issue 575 canary admission'
        required: true
        type: choice
        options: [run]

permissions: {}
concurrency:
  group: hunter-575-grant-canary-${{ github.ref }}
  cancel-in-progress: false

jobs:
  grant-contract:
    if: >-
      github.actor == github.repository_owner
      && ((github.event_name == 'pull_request'
           && github.event.pull_request.number == 785
           && github.event.pull_request.head.repo.full_name == github.repository
           && github.event.pull_request.head.ref == 'issue-575-trusted-issuer-integration')
          || (github.event_name == 'workflow_dispatch'
              && inputs.canary == 'run'
              && github.ref == 'refs/heads/issue-575-trusted-issuer-integration'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pull-requests: read
    steps:
      - name: Verify exact PR 785 head before checkout
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import urllib.request
          request = urllib.request.Request(
              f"https://api.github.com/repos/{os.environ['REPOSITORY']}/pulls/785",
              headers={"Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                       "Accept": "application/vnd.github+json",
                       "X-GitHub-Api-Version": "2022-11-28"},
          )
          with urllib.request.urlopen(request, timeout=15) as response:
              pr = json.load(response)
          assert pr['state'] == 'open', 'PR closed'
          assert pr['base']['ref'] == 'main', 'Wrong base'
          assert pr['head']['repo']['full_name'] == os.environ['REPOSITORY'], 'Fork refused'
          assert pr['head']['ref'] == 'issue-575-trusted-issuer-integration', 'Wrong branch'
          assert pr['head']['sha'] == os.environ['EXPECTED_SHA'], 'Stale head refused'
          print('Exact-head PR 785 admission verified')
          PY
      - name: Checkout exact candidate without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.11.18'
      - name: Run adversarial grant contract tests
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --only-binary ':all:' -c requirements/ci-constraints.txt . pytest
          python -m pytest -q tests/test_workspace_grant_handoff_575.py tests/test_issue_agent_control.py -k 'signed_grant or workspace_grant_verifier'
      - name: State explicit contract-only boundary
        run: |
          echo 'CONTRACT_ONLY: signature and trust-root tests; NOT an operational Mac transport canary.'
          echo 'No issuer credentials, grant delivery or model execution are available in this job.'
