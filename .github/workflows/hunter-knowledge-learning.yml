name: Hunter Knowledge Learning
on:
  # Copilot review events are approval-held by GitHub before jobs start.
  # Periodic trusted current-state catch-up covers reviews without bot runs.
  schedule:
    - cron: "17 * * * *"
  pull_request_review:
    types:
      - submitted
      - edited
      - dismissed
  pull_request_review_comment:
    types: [created, edited, deleted]
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: hunter-knowledge-learning-${{ github.event.pull_request.number || github.event.inputs.pr_number || github.event_name }}
  cancel-in-progress: true
jobs:
  learn:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout trusted learning engine
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install trusted learning engine
        env:
          PIP_CONSTRAINT: requirements/ci-constraints.txt
        run: python -m pip install --only-binary ':all:' -c requirements/ci-constraints.txt .
      - name: Detect trusted learning engine
        id: engine
        run: |
          if [[ -f scripts/hunter_collect_learning_observations.py && -f scripts/hunter_collect_sonar_observations.py && -f scripts/hunter_incremental_knowledge.py && -f scripts/hunter_integrate_learning_ledger.py && -f scripts/hunter_canonicalize_learning.py ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "Bootstrap: learning engine is not on trusted default branch yet; no candidate code will be executed."
          fi
      - name: Resolve exact PR for review or scheduled catch-up
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          EVENT_PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          if [[ -n "${EVENT_PR}" ]]; then
            echo "number=${EVENT_PR}" >> "$GITHUB_OUTPUT"
          else
            # Catch up one bounded PR per run, rotating across open PRs.
            hour="$(date -u +%s)"
            number="$(gh pr list --repo "$REPOSITORY" --state open --base main --limit 100 --json number --jq "sort_by(.number) | if length == 0 then empty else .[(($hour / 3600) % length)].number end")"
            echo "number=${number}" >> "$GITHUB_OUTPUT"
          fi
      - name: Build exact-head learning artifact
        if: steps.engine.outputs.available == 'true' && steps.target.outputs.number != ''
        env:
          PYTHONPATH: src
          GITHUB_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ steps.target.outputs.number }}
        run: |
          HEAD_SHA="$(gh pr view "$PR_NUMBER" --repo "$REPOSITORY" --json headRefOid --jq .headRefOid)"
          BASE_SHA="$(gh pr view "$PR_NUMBER" --repo "$REPOSITORY" --json baseRefOid --jq .baseRefOid)"
          echo "HEAD_SHA=$HEAD_SHA" >> "$GITHUB_ENV"
          echo "BASE_SHA=$BASE_SHA" >> "$GITHUB_ENV"
          python scripts/hunter_collect_learning_observations.py --repository "$REPOSITORY" --pr "$PR_NUMBER" --head "$HEAD_SHA" --base "$BASE_SHA" > github-learning-observations.json
          python scripts/hunter_collect_sonar_observations.py --project "fafa33_Project-Hunter" --pr "$PR_NUMBER" --head "$HEAD_SHA" --base "$BASE_SHA" > sonar-learning-observations.json
          python - <<'PY'
          import json
          github = json.load(open("github-learning-observations.json", encoding="utf-8"))
          sonar = json.load(open("sonar-learning-observations.json", encoding="utf-8"))
          open("learning-observations.json", "w", encoding="utf-8").write(json.dumps(github + sonar, sort_keys=True, indent=2) + "\n")
          PY
          python scripts/hunter_incremental_knowledge.py --pr "$PR_NUMBER" --head "$HEAD_SHA" --base "$BASE_SHA" --observations learning-observations.json > hunter-learning-ledger.json
      - name: Render controlled canonical DPM candidate
        if: steps.engine.outputs.available == 'true' && steps.target.outputs.number != ''
        env:
          PYTHONPATH: src
        run: python scripts/hunter_integrate_learning_ledger.py > hunter-defect-registry-candidate.json
      - name: Prove canonicalization materialization is reproducible (dry-run, non-authoritative)
        # Automatically re-runs the exact same build_learning_ledger +
        # materialize_learning_ledger authorities the local recovery CLI
        # (scripts/hunter_canonicalize_learning.py) uses to apply a change, so
        # that path is continuously exercised against live PR data before a
        # human ever needs to trust it. --dry-run is not optional here: this
        # job's own permissions block above grants it no repository-write
        # capability at all, and must never attempt the atomic registry
        # write. continue-on-error keeps a failure here from
        # skipping the artifact upload below or affecting any required check
        # -- this workflow is not in the required-checks list either way.
        if: steps.engine.outputs.available == 'true' && steps.target.outputs.number != ''
        continue-on-error: true
        env:
          PYTHONPATH: src
          PR_NUMBER: ${{ steps.target.outputs.number }}
          HEAD_SHA: ${{ env.HEAD_SHA }}
          BASE_SHA: ${{ env.BASE_SHA }}
        run: |
          python scripts/hunter_canonicalize_learning.py --pr "$PR_NUMBER" --head "$HEAD_SHA" --base "$BASE_SHA" --observations learning-observations.json --dry-run > hunter-canonicalization-dry-run.log
      - name: Publish non-authoritative learning artifact
        if: steps.engine.outputs.available == 'true' && steps.target.outputs.number != ''
        uses: actions/upload-artifact@v4
        with:
          name: hunter-learning
          path: |
            hunter-learning-ledger.json
            hunter-defect-registry-candidate.json
            hunter-canonicalization-dry-run.log
          if-no-files-found: error
          retention-days: 90
