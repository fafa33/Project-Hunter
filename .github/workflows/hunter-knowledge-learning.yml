name: Hunter Knowledge Learning
on:
  pull_request_review:
    types: [submitted, edited, dismissed]
  pull_request_review_comment:
    types: [created, edited, deleted]
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: hunter-knowledge-learning-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  learn:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout trusted learning engine
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Detect trusted learning engine
        id: engine
        run: |
          if [[ -f scripts/hunter_collect_learning_observations.py && -f scripts/hunter_collect_sonar_observations.py && -f scripts/hunter_incremental_knowledge.py ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "Bootstrap: learning engine is not on trusted default branch yet; no candidate code will be executed."
          fi
      - name: Build exact-head learning artifact
        if: steps.engine.outputs.available == 'true'
        env:
          PYTHONPATH: src
          GITHUB_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          python scripts/hunter_collect_learning_observations.py --repository "$REPOSITORY" --pr "$PR_NUMBER" --head "$HEAD_SHA" --base "$BASE_SHA" > github-learning-observations.json
          python scripts/hunter_collect_sonar_observations.py --project "fafa33_Project-Hunter" --pr "$PR_NUMBER" --head "$HEAD_SHA" --base "$BASE_SHA" > sonar-learning-observations.json
          python - <<'PY'
          import json
          github = json.load(open("github-learning-observations.json", encoding="utf-8"))
          sonar = json.load(open("sonar-learning-observations.json", encoding="utf-8"))
          open("learning-observations.json", "w", encoding="utf-8").write(json.dumps(github + sonar, sort_keys=True, indent=2) + "\n")
          PY
          python scripts/hunter_incremental_knowledge.py --pr "$PR_NUMBER" --head "$HEAD_SHA" --base "$BASE_SHA" --observations learning-observations.json > hunter-learning-ledger.json
      - name: Publish non-authoritative learning artifact
        if: steps.engine.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: hunter-learning
          path: hunter-learning-ledger.json
          if-no-files-found: error
          retention-days: 90
