name: Hunter Draft Promotion Signal

# Advisory signal for Draft PRs that have completed every exact-head
# prerequisite required by Hunter Merge Readiness. Before publishing the signal,
# it deterministically synchronizes the implementer readiness declaration so the
# operator only has to click Ready for Review; it never promotes or merges a PR.

on:
  pull_request_target:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
      - converted_to_draft
  pull_request_review:
    types:
      - submitted
      - edited
      - dismissed
  pull_request_review_comment:
    types:
      - created
      - edited
      - deleted
  push:
    branches:
      - main
  workflow_run:
    workflows:
      - CI
      - Dependency review
      - Hunter Governance Review
      - CodeQL
      - Hunter Governance Review Reconcile
    types:
      - completed

permissions:
  actions: read
  checks: read
  contents: read
  issues: write
  pull-requests: write
  statuses: write

concurrency:
  group: hunter-draft-promotion-signal
  cancel-in-progress: false

jobs:
  signal:
    name: Hunter Draft Promotion Signal
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # Always run the canonical signal script from the trusted default
      # branch, matching the pattern the other Hunter reconciliation
      # workflows use.
      - name: Checkout trusted signal script (default branch)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Evaluate exact-head Draft promotion readiness
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python scripts/hunter_draft_promotion_signal.py
