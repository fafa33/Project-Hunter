name: Hunter Draft Promotion Signal

# Advisory-only signal for Draft PRs that have completed every exact-head
# prerequisite required by Hunter Merge Readiness. This workflow never checks
# out or executes PR code and never promotes a PR automatically.

on:
  pull_request_target:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
      - converted_to_draft
  workflow_run:
    workflows:
      - CI
      - Dependency review
      - Hunter Governance Review
      - CodeQL
    types:
      - completed

permissions:
  actions: read
  checks: read
  contents: read
  issues: write
  pull-requests: read
  statuses: write

jobs:
  signal:
    name: Hunter Draft Promotion Signal
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Evaluate exact-head Draft promotion readiness
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT_PATH: ${{ github.event_path }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request

          repo = os.environ["GH_REPO"]
          token = os.environ["GH_TOKEN"]
          run_url = os.environ["RUN_URL"]
          context = "Hunter Draft Promotion"
          required = (
              "Hunter Governance Review",
              "Quality Gates",
              "dependency-review",
              "CodeQL",
          )

          with open(os.environ["EVENT_PATH"], encoding="utf-8") as handle:
              event = json.load(handle)

          def request_json(method, path, payload=None):
              data = None if payload is None else json.dumps(payload).encode("utf-8")
              request = urllib.request.Request(
                  f"https://api.github.com/repos/{repo}/{path}",
                  data=data,
                  method=method,
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": f"Bearer {token}",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "Content-Type": "application/json",
                  },
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.load(response)

          def publish(sha, state, description):
              request_json(
                  "POST",
                  f"statuses/{sha}",
                  {
                      "state": state,
                      "context": context,
                      "description": description[:140],
                      "target_url": run_url,
                  },
              )
              print(f"{context}: {state} — {description}")

          def open_draft_pr_for_sha(sha):
              page = 1
              while True:
                  pulls = request_json("GET", f"pulls?state=open&per_page=100&page={page}")
                  for pr in pulls:
                      if pr.get("draft") and pr.get("head", {}).get("sha") == sha:
                          return pr
                  if len(pulls) < 100:
                      return None
                  page += 1

          def exact_head_check_runs(sha):
              runs = []
              page = 1
              while True:
                  payload = request_json(
                      "GET",
                      f"commits/{sha}/check-runs?per_page=100&page={page}&filter=all",
                  )
                  batch = payload.get("check_runs", [])
                  runs.extend(batch)
                  if len(batch) < 100:
                      return runs
                  page += 1

          def post_once(pr_number, sha):
              marker = f"<!-- hunter-draft-promotion:{sha} -->"
              page = 1
              while True:
                  comments = request_json(
                      "GET", f"issues/{pr_number}/comments?per_page=100&page={page}"
                  )
                  if any(marker in comment.get("body", "") for comment in comments):
                      print("Promotion comment already exists for this exact head.")
                      return
                  if len(comments) < 100:
                      break
                  page += 1

              request_json(
                  "POST",
                  f"issues/{pr_number}/comments",
                  {
                      "body": (
                          f"{marker}\n"
                          "✅ **Hunter Draft Promotion:** all exact-head prerequisites "
                          "have passed. This Draft PR is ready for its metadata to be "
                          "updated and then promoted to **Ready for Review**.\n\n"
                          "This signal is advisory only; Hunter Governance Review and "
                          "Hunter Merge Readiness remain the merge authorities."
                      )
                  },
              )

          if "pull_request" in event:
              pr = event["pull_request"]
              if not pr.get("draft"):
                  print("PR is not Draft; no Draft-promotion signal is applicable.")
                  raise SystemExit(0)
              sha = pr["head"]["sha"]
          else:
              workflow_run = event.get("workflow_run", {})
              sha = workflow_run.get("head_sha")
              if not sha:
                  print("workflow_run has no head SHA; nothing to evaluate.")
                  raise SystemExit(0)
              pr = open_draft_pr_for_sha(sha)
              if pr is None:
                  print("No open Draft PR matches the completed workflow exact head.")
                  raise SystemExit(0)

          pr_number = pr["number"]
          latest = {}
          for run in exact_head_check_runs(sha):
              name = run.get("name")
              if name not in required:
                  continue
              previous = latest.get(name)
              if previous is None or int(run.get("id", 0)) > int(previous.get("id", 0)):
                  latest[name] = run

          waiting = []
          for name in required:
              run = latest.get(name)
              if run is None:
                  waiting.append(name)
                  continue
              if run.get("status") != "completed" or run.get("conclusion") != "success":
                  conclusion = run.get("conclusion") or run.get("status") or "pending"
                  waiting.append(f"{name}={conclusion}")

          if waiting:
              publish(sha, "pending", "Waiting for exact-head checks: " + ", ".join(waiting))
              raise SystemExit(0)

          publish(sha, "success", "Ready to promote from Draft.")
          post_once(pr_number, sha)
          PY
