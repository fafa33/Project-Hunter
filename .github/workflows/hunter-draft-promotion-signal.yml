name: Hunter Draft Promotion Signal

# Advisory signal for Draft PRs that have completed every exact-head
# prerequisite required by Hunter Merge Readiness. Before publishing the signal,
# it deterministically synchronizes the implementer readiness declaration so the
# operator only has to click Ready for Review; it never promotes or merges a PR.

on:
  pull_request_target:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
      - converted_to_draft
  push:
    branches:
      - main
  workflow_run:
    workflows:
      - CI
      - Dependency review
      - Hunter Governance Review
      - CodeQL
      - Hunter Governance Review Reconcile
    types:
      - completed

permissions:
  actions: read
  checks: read
  contents: read
  issues: write
  pull-requests: write
  statuses: write

concurrency:
  group: hunter-draft-promotion-signal
  cancel-in-progress: false

jobs:
  signal:
    name: Hunter Draft Promotion Signal
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Evaluate exact-head Draft promotion readiness
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import urllib.request

          repo = os.environ["GH_REPO"]
          token = os.environ["GH_TOKEN"]
          run_url = os.environ["RUN_URL"]
          context = "Hunter Draft Promotion"
          required_checks = (
              "Quality Gates",
              "dependency-review",
              "CodeQL",
          )
          governance_context = "Hunter Governance Review"

          with open(os.environ["GITHUB_EVENT_PATH"], encoding="utf-8") as handle:
              event = json.load(handle)

          def request_json(method, path, payload=None):
              data = None if payload is None else json.dumps(payload).encode("utf-8")
              request = urllib.request.Request(
                  f"https://api.github.com/repos/{repo}/{path}",
                  data=data,
                  method=method,
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": f"Bearer {token}",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "Content-Type": "application/json",
                  },
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.load(response)

          def publish(sha, state, description):
              request_json(
                  "POST",
                  f"statuses/{sha}",
                  {
                      "state": state,
                      "context": context,
                      "description": description[:140],
                      "target_url": run_url,
                  },
              )
              print(f"{context}: {state} — {description}")

          def open_draft_prs():
              drafts = []
              page = 1
              while True:
                  pulls = request_json("GET", f"pulls?state=open&base=main&per_page=100&page={page}")
                  drafts.extend(pr for pr in pulls if pr.get("draft"))
                  if len(pulls) < 100:
                      return drafts
                  page += 1

          def open_draft_pr_for_sha(sha):
              for pr in open_draft_prs():
                  if pr.get("head", {}).get("sha") == sha:
                      return pr
              return None

          def exact_head_check_runs(sha):
              runs = []
              page = 1
              while True:
                  payload = request_json(
                      "GET",
                      f"commits/{sha}/check-runs?per_page=100&page={page}&filter=all",
                  )
                  batch = payload.get("check_runs", [])
                  runs.extend(batch)
                  if len(batch) < 100:
                      return runs
                  page += 1

          def latest_commit_status(sha, status_context):
              payload = request_json("GET", f"commits/{sha}/status?per_page=100")
              matches = [
                  status
                  for status in payload.get("statuses", [])
                  if status.get("context") == status_context
              ]
              if not matches:
                  return None
              return max(matches, key=lambda status: int(status.get("id", 0)))

          def synchronize_ready_metadata(pr_number, body):
              declarations = {
                  "READY FOR REVIEW": 0,
                  "CHANGES REQUIRED": 0,
                  "BLOCKED": 0,
              }
              pattern = re.compile(
                  r"(?im)^(?P<prefix>\s*[-*+]\s*)\[(?P<mark>[ xX])\](?P<space>\s*)"
                  r"(?P<label>READY FOR REVIEW|CHANGES REQUIRED|BLOCKED)(?P<suffix>.*)$"
              )

              for match in pattern.finditer(body):
                  declarations[match.group("label").upper()] += 1

              if any(count != 1 for count in declarations.values()):
                  raise RuntimeError(
                      "Implementer readiness declaration is missing, duplicated, or unparseable; refusing automatic metadata mutation."
                  )

              def replace(match):
                  label = match.group("label").upper()
                  mark = "x" if label == "READY FOR REVIEW" else " "
                  return (
                      f"{match.group('prefix')}[{mark}]{match.group('space')}"
                      f"{match.group('label')}{match.group('suffix')}"
                  )

              updated = pattern.sub(replace, body)
              if updated == body:
                  print("Implementer readiness metadata is already synchronized to READY FOR REVIEW.")
                  return

              request_json(
                  "PATCH",
                  f"pulls/{pr_number}",
                  {"body": updated},
              )
              print("Synchronized implementer readiness metadata to READY FOR REVIEW while PR remains Draft.")

          def post_once(pr_number, sha):
              marker = f"<!-- hunter-draft-promotion:{sha} -->"
              page = 1
              while True:
                  comments = request_json(
                      "GET", f"issues/{pr_number}/comments?per_page=100&page={page}"
                  )
                  if any(marker in comment.get("body", "") for comment in comments):
                      print("Promotion comment already exists for this exact head.")
                      return
                  if len(comments) < 100:
                      break
                  page += 1

              request_json(
                  "POST",
                  f"issues/{pr_number}/comments",
                  {
                      "body": (
                          f"{marker}\n"
                          "✅ **Hunter Draft Promotion:** all exact-head prerequisites "
                          "have passed and implementer readiness metadata is synchronized "
                          "to **READY FOR REVIEW**. The operator may now manually mark this "
                          "Draft PR **Ready for Review**.\n\n"
                          "Hunter Governance Review and Hunter Merge Readiness remain the "
                          "merge authorities; review feedback must still be resolved or "
                          "explicitly acknowledged under the repository merge policy."
                      )
                  },
              )

          def evaluate(pr):
              if not pr.get("draft"):
                  print(f"PR #{pr.get('number')} is not Draft; skipping.")
                  return

              sha = pr["head"]["sha"]
              pr_number = pr["number"]
              latest = {}
              for run in exact_head_check_runs(sha):
                  name = run.get("name")
                  if name not in required_checks:
                      continue
                  previous = latest.get(name)
                  if previous is None or int(run.get("id", 0)) > int(previous.get("id", 0)):
                      latest[name] = run

              waiting = []
              for name in required_checks:
                  run = latest.get(name)
                  if run is None:
                      waiting.append(name)
                      continue
                  if run.get("status") != "completed" or run.get("conclusion") != "success":
                      conclusion = run.get("conclusion") or run.get("status") or "pending"
                      waiting.append(f"{name}={conclusion}")

              governance = latest_commit_status(sha, governance_context)
              if governance is None:
                  waiting.append(governance_context)
              elif governance.get("state") != "success":
                  waiting.append(
                      f"{governance_context}={governance.get('state') or 'pending'}"
                  )

              if waiting:
                  publish(sha, "pending", "Waiting for exact-head checks: " + ", ".join(waiting))
                  return

              current = request_json("GET", f"pulls/{pr_number}")
              if not current.get("draft") or current.get("head", {}).get("sha") != sha:
                  print("PR state/head changed during evaluation; refusing metadata mutation.")
                  return

              synchronize_ready_metadata(pr_number, current.get("body") or "")
              publish(sha, "success", "Ready to promote from Draft; metadata synchronized.")
              post_once(pr_number, sha)

          event_name = os.environ.get("GITHUB_EVENT_NAME", "")
          if "pull_request" in event:
              evaluate(event["pull_request"])
              raise SystemExit(0)

          if event_name == "push":
              for pr in open_draft_prs():
                  publish(
                      pr["head"]["sha"],
                      "pending",
                      "Target base advanced; waiting for refreshed governance.",
                  )
              raise SystemExit(0)

          workflow_run = event.get("workflow_run", {})
          workflow_name = workflow_run.get("name")
          if workflow_name == "Hunter Governance Review Reconcile":
              for pr in open_draft_prs():
                  evaluate(pr)
              raise SystemExit(0)

          sha = workflow_run.get("head_sha")
          if not sha:
              print("workflow_run has no head SHA; nothing to evaluate.")
              raise SystemExit(0)
          pr = open_draft_pr_for_sha(sha)
          if pr is None:
              print("No open Draft PR matches the completed workflow exact head.")
              raise SystemExit(0)
          evaluate(pr)
          PY
