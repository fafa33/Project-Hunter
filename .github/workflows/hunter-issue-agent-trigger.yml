name: Hunter / Issue Agent Lifecycle

# ADR 0037 D1: the GitHub-native Issue-agent lifecycle -- one run, four isolated trust domains:
#   control   (authorize, bind, record-validation, finalize, resume-bind): K_AUTH, K_SH, K_SPM, K_STATE
#   executor  (execute): the model key and X_EXEC only; GITHUB_TOKEN {}
#   validator (validate): X_RESULT only; GITHUB_TOKEN {} (actions: read for a resume's cross-run download)
#   publisher (publish): the signing-only key and the create-only push token; never candidate code
# There is no Railway, webhook or n8n client anywhere (D9, AT-42). Every job runs
# scripts/hunter_issue_agent_lifecycle.py, which loads the repository-pinned trust roots first: while
# config/issue_agent_trust_roots.json is unprovisioned, every job refuses MISSING_CONFIGURATION before it
# touches a secret, the ledger or the network (S5 inert state; S6 provisions it).
#
# Rules (AT-41): no id-token, no cache, actions pinned by commit SHA, content-processing jobs check out the
# bound control_sha (github.sha on a label run, the ledger-bound commit on a resume), every job refuses
# run_attempt != 1, and per-Issue concurrency queues (queue: max) instead of cancelling.

on:
  issues:
    types:
      - labeled
  workflow_dispatch:
    inputs:
      issue:
        description: Issue number of the pending resume
        required: false
        type: string
      authorization_id:
        description: Authorization identity of the pending resume
        required: false
        type: string
      stage:
        description: Resume stage (validation, publication, or an owner-approved fallback)
        required: false
        type: string
      nonce:
        description: Pending resume nonce recorded on the anchored ledger
        required: false
        type: string
      remediation_authorization:
        description: >-
          ADR 0039 L4 remediation entry: the base64 K_AUTH-signed remediation authorization document minted by
          the reconcile job. Public Issue claims, public reviewer claims and digests only; authorize refuses it
          unless the issuer signature verifies. Leave empty for every other dispatch.
        required: false
        type: string

run-name: >-
  ${{ github.event_name == 'workflow_dispatch'
      && (inputs.remediation_authorization != ''
          && format('Issue agent remediation')
          || format('Issue agent resume {0} {1}', inputs.stage, inputs.nonce))
      || format('Issue agent #{0}', github.event.issue.number) }}

permissions: {}

concurrency:
  group: >-
    ${{ github.event_name == 'workflow_dispatch'
        && (inputs.remediation_authorization != ''
            && format('hunter-issue-agent-remediation')
            || format('hunter-issue-agent-resume-{0}', inputs.issue))
        || format('hunter-issue-agent-{0}', github.event.issue.number) }}
  cancel-in-progress: false
  queue: max

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  scope-admission:
    name: unprivileged scope admission
    if: >-
      github.event_name == 'issues'
      && github.event.label.name == 'hunter-agent-execute'
      && github.actor == github.repository_owner
      && !github.event.issue.pull_request
      && github.event.issue.state == 'open'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: {}
    outputs:
      eligible: ${{ steps.scope.outputs.eligible }}
    steps:
      - name: Checkout trusted workflow code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11.13"
      - name: Install pinned runtime
        run: python -m pip install --only-binary ':all:' -c requirements/ci-constraints.txt .
      - name: Check canonical scope before privileged environment
        id: scope
        run: python scripts/hunter_issue_scope_admission.py
  authorize:
    needs: scope-admission
    # Serialize shared signed Source Handling CAS writes across Issues.
    concurrency:
      group: hunter-issue-agent-source-handling-authorize
      cancel-in-progress: false
      queue: max
    name: authorize
    if: >-
      always() && (
      (
        github.event_name == 'issues'
        && github.event.label.name == 'hunter-agent-execute'
        && github.actor == github.repository_owner
        && !github.event.issue.pull_request
        && github.event.issue.state == 'open'
        && needs.scope-admission.result == 'success'
        && needs.scope-admission.outputs.eligible == 'true'
      )
      || (github.event_name == 'workflow_dispatch'
          && inputs.remediation_authorization != ''
          && (github.actor == github.repository_owner || github.actor == 'github-actions[bot]'))
      && github.ref == 'refs/heads/main'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: hunter-issue-agent-control
    permissions:
      contents: write
      actions: read
      pull-requests: read
    outputs:
      issue: ${{ steps.prepare.outputs.issue }}
      authorization_id: ${{ steps.prepare.outputs.authorization_id }}
      handoff_artifact_id: ${{ steps.upload.outputs.artifact-id }}
      remediation: ${{ steps.document.outputs.remediation }}
    steps:
      - name: Checkout control_sha
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11.13"
      - name: Install pinned runtime
        run: python -m pip install --only-binary ':all:' -c requirements/ci-constraints.txt .
      # ADR 0039 L4: a remediation dispatch carries the K_AUTH-signed document the reconcile job minted. It is
      # decoded, never templated, and `authorize-prepare` refuses it unless the issuer signature verifies.
      - name: Decode the bound remediation authorization document
        id: document
        if: github.event_name == 'workflow_dispatch' && inputs.remediation_authorization != ''
        env:
          REMEDIATION_AUTHORIZATION: ${{ inputs.remediation_authorization }}
        run: |
          set -euo pipefail
          printf '%s' "$REMEDIATION_AUTHORIZATION" | base64 --decode > "$RUNNER_TEMP/remediation.json"
          echo "remediation=true" >> "$GITHUB_OUTPUT"
      - name: Mint, verify, compile and seal (no durable write)
        id: prepare
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HUNTER_ISSUE_AGENT_AUTHORIZATION_SIGNING_KEY: ${{ secrets.HUNTER_ISSUE_AGENT_AUTHORIZATION_SIGNING_KEY }}
          HUNTER_ISSUE_AGENT_STATE_SIGNING_KEY: ${{ secrets.HUNTER_ISSUE_AGENT_STATE_SIGNING_KEY }}
          HUNTER_SOURCE_HANDLING_SIGNING_KEY: ${{ secrets.HUNTER_SOURCE_HANDLING_SIGNING_KEY }}
          HUNTER_PROMPT_AUTOMATION_SIGNING_KEY: ${{ secrets.HUNTER_PROMPT_AUTOMATION_SIGNING_KEY }}
          REMEDIATION_AUTHORIZATION: ${{ inputs.remediation_authorization }}
        run: |
          set -euo pipefail
          if [ "$REMEDIATION_AUTHORIZATION" != "" ]; then
            python scripts/hunter_issue_agent_lifecycle.py authorize-prepare \
              --document "$RUNNER_TEMP/remediation.json" --out-dir "$RUNNER_TEMP/authorize"
          else
            python scripts/hunter_issue_agent_lifecycle.py authorize-prepare \
              --event "$GITHUB_EVENT_PATH" --out-dir "$RUNNER_TEMP/authorize"
          fi
      - name: Upload the sealed handoff
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.prepare.outputs.handoff_artifact }}
          path: ${{ runner.temp }}/authorize/handoff.sealed
          if-no-files-found: error
          retention-days: 1
      # ADR 0041 F3: present only when a fallback recipient (X_FB) is pinned in the trust roots.
      - name: Upload the fallback-sealed handoff
        id: upload-fallback
        if: steps.prepare.outputs.fallback_handoff_artifact != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.prepare.outputs.fallback_handoff_artifact }}
          path: ${{ runner.temp }}/authorize/fallback.sealed
          if-no-files-found: error
          # ADR 0041 F1: the fallback waits for the owner without a deadline. The sealed handoff is the only copy of
          # the task (there is no confidential durable store), so it is kept for the longest retention GitHub allows.
          retention-days: 90
      - name: Claim on the anchored ledger (AUTHORIZED)
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HUNTER_ISSUE_AGENT_STATE_SIGNING_KEY: ${{ secrets.HUNTER_ISSUE_AGENT_STATE_SIGNING_KEY }}
          HUNTER_SOURCE_HANDLING_SIGNING_KEY: ${{ secrets.HUNTER_SOURCE_HANDLING_SIGNING_KEY }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          FALLBACK_ARTIFACT_ID: ${{ steps.upload-fallback.outputs.artifact-id }}
        run: |
          set -euo pipefail
          if [ -n "$FALLBACK_ARTIFACT_ID" ]; then
            python scripts/hunter_issue_agent_lifecycle.py authorize-commit \
              --out-dir "$RUNNER_TEMP/authorize" --artifact-id "$ARTIFACT_ID" \
              --fallback-artifact-id "$FALLBACK_ARTIFACT_ID"
          else
            python scripts/hunter_issue_agent_lifecycle.py authorize-commit \
              --out-dir "$RUNNER_TEMP/authorize" --artifact-id "$ARTIFACT_ID"
          fi

  execute:
    name: execute
    needs: authorize
    # authorize runs under always() because its own need (scope-admission) is skipped on the signed remediation and
    # preflight-recovery dispatch. Without an explicit status function GitHub applies the implicit success() over
    # the whole dependency chain and skips execute even though authorize succeeded, so the model never runs and the
    # lifecycle terminalizes EXECUTION_NOT_STARTED (Issue #705 attempts 2fd0f835, 6733fa50).
    if: always() && needs.authorize.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: hunter-issue-agent-executor
    permissions: {}
    outputs:
      advisory_code: ${{ steps.execute.outputs.advisory_code }}
      stderr_category: ${{ steps.execute.outputs.stderr_category }}
      probe_category: ${{ steps.execute.outputs.probe_category }}
      canary_primary_refusals: ${{ steps.execute.outputs.canary_primary_refusals }}
      canary_refusal_digest: ${{ steps.execute.outputs.canary_refusal_digest }}
    steps:
      - name: Checkout control_sha
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11.13"
      - name: Install pinned runtime and model client
        run: |
          set -euo pipefail
          python -m pip install --only-binary ':all:' -c requirements/ci-constraints.txt .
          sudo npm install --prefix /opt/hunter --no-save --ignore-scripts @kilocode/cli@7.8.18
      - name: Provision governed Kilo container images
        run: |
          set -euo pipefail
          docker build --pull --file scripts/issue_agent/Dockerfile.kilo-canary \
            --tag hunter-682-kilo-canary:local .
          docker build --pull --file scripts/issue_agent/Dockerfile.broker-canary \
            --tag hunter-682-broker-canary:local .
          docker image inspect hunter-682-kilo-canary:local hunter-682-broker-canary:local >/dev/null
      - name: Verify Docker network isolation prerequisites
        run: |
          set -euo pipefail
          docker info >/dev/null
          docker image inspect python@sha256:78387bc3881b8273120a12ebe6c1ab22b018ccc2c9adf565ae1ac9b536e184ea >/dev/null || \
            docker pull python@sha256:78387bc3881b8273120a12ebe6c1ab22b018ccc2c9adf565ae1ac9b536e184ea
      - name: Create the isolation uid
        run: |
          set -euo pipefail
          sudo useradd --create-home --shell /usr/sbin/nologin hunter-untrusted
          sudo install -d -m 0711 /tmp/hunter-ia
          sudo install -d -m 0711 -o "$(id -u)" -g "$(id -g)" /tmp/hunter-ia/execute
      - name: Download the bound handoff
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.authorize.outputs.handoff_artifact_id }}
          path: ${{ runner.temp }}/handoff
          digest-mismatch: error
      - name: Run the model once through isolation and seal the result
        id: execute
        env:
          HUNTER_ISSUE_AGENT_HANDOFF_KEY: ${{ secrets.HUNTER_ISSUE_AGENT_HANDOFF_KEY }}
          HUNTER_ISSUE_AGENT_EXECUTOR_MODEL_API_KEY: ${{ secrets.HUNTER_ISSUE_AGENT_EXECUTOR_MODEL_API_KEY }}
          ISSUE: ${{ needs.authorize.outputs.issue }}
          AUTHORIZATION_ID: ${{ needs.authorize.outputs.authorization_id }}
          MODEL: ${{ vars.HUNTER_ISSUE_AGENT_EXECUTOR_MODEL }}
          MODEL_KEY_NAME: ${{ vars.HUNTER_ISSUE_AGENT_EXECUTOR_MODEL_KEY_NAME }}
        run: >-
          python scripts/hunter_issue_agent_lifecycle.py execute
          --issue "$ISSUE" --authorization-id "$AUTHORIZATION_ID"
          --handoff "$(find "$RUNNER_TEMP/handoff" -type f -name handoff.sealed)"
          --out "$RUNNER_TEMP/result.sealed" --workroot /tmp/hunter-ia/execute
          --model-key-name "$MODEL_KEY_NAME" --model-argv /opt/hunter/node_modules/.bin/kilo run --model "$MODEL"
      - name: Upload the sealed result
        if: steps.execute.outputs.sealed == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.execute.outputs.result_artifact }}
          path: ${{ runner.temp }}/result.sealed
          if-no-files-found: error
          retention-days: 1

  bind:
    name: bind
    needs: [authorize, execute]
    outputs:
      result_bound: ${{ steps.advance.outputs.result_bound }}
      fallback_authorized: ${{ steps.advance.outputs.fallback_authorized }}
    # A resume dispatch skips `authorize` (and `execute`), so `bind` has no issue and nothing to bind: its resume is
    # `resume-bind`. Running it there failed with `--issue ''` and turned every resume run red.
    if: >-
      always()
      && needs.authorize.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: hunter-issue-agent-control
    permissions:
      contents: write
      actions: read
      pull-requests: read
    steps:
      - name: Checkout trusted main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11.13"
      - name: Install pinned runtime
        run: python -m pip install --only-binary ':all:' -c requirements/ci-constraints.txt .
      - name: Advance (T2 or terminal failure)
        id: advance
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HUNTER_ISSUE_AGENT_STATE_SIGNING_KEY: ${{ secrets.HUNTER_ISSUE_AGENT_STATE_SIGNING_KEY }}
          ISSUE: ${{ needs.authorize.outputs.issue }}
          ADVISORY: ${{ needs.execute.outputs.advisory_code }}
          STDERR_CATEGORY: ${{ needs.execute.outputs.stderr_category }}
          PROBE_CATEGORY: ${{ needs.execute.outputs.probe_category }}
          CANARY_PRIMARY_REFUSALS: ${{ needs.execute.outputs.canary_primary_refusals }}
          CANARY_REFUSAL_DIGEST: ${{ needs.execute.outputs.canary_refusal_digest }}
        run: >-
          python scripts/hunter_issue_agent_lifecycle.py step --role bind --issue "$ISSUE" --advisory "$ADVISORY"
          --stderr-category "$STDERR_CATEGORY" --probe-category "$PROBE_CATEGORY"
          --canary-primary-refusals "$CANARY_PRIMARY_REFUSALS" --canary-refusal-digest "$CANARY_REFUSAL_DIGEST"

  # ADR 0041 F1: the owner records a decision on a pending fallback with a label. Approval requests one
  # nonce-bound fallback run; rejection withdraws the request. Nothing waits on a runner in between.
  fallback-decision:
    name: fallback-decision
    if: >-
      github.event_name == 'issues'
      && (github.event.label.name == 'hunter-codex-fallback-approve'
          || github.event.label.name == 'hunter-codex-fallback-reject')
      && github.actor == github.repository_owner
      && !github.event.issue.pull_request
      && github.event.issue.state == 'open'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: hunter-issue-agent-control
    permissions:
      contents: write
      actions: write
    steps:
      - name: Checkout trusted main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11.13"
      - name: Install pinned runtime
        run: python -m pip install --only-binary ':all:' -c requirements/ci-constraints.txt .
      - name: Record the owner's decision on the anchored ledger
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HUNTER_ISSUE_AGENT_STATE_SIGNING_KEY: ${{ secrets.HUNTER_ISSUE_AGENT_STATE_SIGNING_KEY }}
        run: python scripts/hunter_issue_agent_lifecycle.py fallback-decision --event "$GITHUB_EVENT_PATH"

  # ADR 0041: the single governed Codex fallback, only in an owner-approved resume run that claimed its nonce.
  # It runs on the attested macOS fallback host and holds X_FB only.
  execute-fallback:
    name: execute-fallback
    needs: [resume-bind]
    if: >-
      always()
      && github.event_name == 'workflow_dispatch'
      && inputs.stage == 'fallback'
      && needs.resume-bind.result == 'success'
    runs-on: [self-hosted, macOS, hunter-codex-fallback]
    timeout-minutes: 45
    environment: hunter-issue-agent-fallback-executor
    permissions:
      actions: read
    concurrency:
      group: hunter-codex-fallback
      cancel-in-progress: false
    outputs:
      advisory_code: ${{ steps.execute.outputs.advisory_code }}
      attestation_sha256: ${{ steps.execute.outputs.attestation_sha256 }}
      fallback_model: ${{ steps.execute.outputs.fallback_model }}
    env:
      ISSUE: ${{ inputs.issue }}
      AUTHORIZATION_ID: ${{ inputs.authorization_id }}
    steps:
      - name: Checkout control_sha
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resume-bind.outputs.control_sha || github.sha }}
          persist-credentials: false
      - name: Verify provisioned macOS Python runtime
        run: |
          set -euo pipefail
          /usr/local/bin/python3 -c 'import platform, sys; assert sys.version_info[:2] == (3, 11) and platform.machine() == "x86_64"'
      - name: Install pinned runtime into a per-run environment
        run: |
          set -euo pipefail
          /usr/local/bin/python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/python" -m pip install --only-binary ':all:' -c requirements/ci-constraints.txt .
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
      - name: Read the bound fallback handoff from the ledger
        id: bound
        run: >-
          python scripts/hunter_issue_agent_lifecycle.py bound
          --issue "$ISSUE" --authorization-id "$AUTHORIZATION_ID"
      - name: Download the bound fallback handoff from its authorize run
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ steps.bound.outputs.fallback_handoff_artifact_id }}
          run-id: ${{ steps.bound.outputs.fallback_handoff_run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/fallback-handoff
          digest-mismatch: error
      - name: Attest the host, then run Codex once through the launcher and seal the result
        id: execute
        env:
          HUNTER_ISSUE_AGENT_FALLBACK_HANDOFF_KEY: ${{ secrets.HUNTER_ISSUE_AGENT_FALLBACK_HANDOFF_KEY }}
          MODEL: ${{ vars.HUNTER_ISSUE_AGENT_FALLBACK_MODEL }}
        run: >-
          python scripts/hunter_issue_agent_lifecycle.py execute-fallback
          --issue "$ISSUE" --authorization-id "$AUTHORIZATION_ID"
          --handoff "$(find "$RUNNER_TEMP/fallback-handoff" -type f -name fallback.sealed)"
          --out "$RUNNER_TEMP/result.sealed" --model "$MODEL"
      - name: Upload the sealed fallback result
        if: steps.execute.outputs.sealed == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.execute.outputs.result_artifact }}
          path: ${{ runner.temp }}/result.sealed
          if-no-files-found: error
          retention-days: 1
      - name: Remove every per-run workroot
        if: always()
        run: find /private/var/hunter-fallback/work -mindepth 1 -maxdepth 1 -exec rm -rf {} +

  bind-fallback:
    name: bind-fallback
    needs: [resume-bind, execute-fallback]
    if: >-
      always()
      && github.event_name == 'workflow_dispatch'
      && inputs.stage == 'fallback'
      && needs.resume-bind.result == 'success'
    outputs:
      result_bound: ${{ steps.advance.outputs.result_bound }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: hunter-issue-agent-control
    permissions:
      contents: write
      actions: write
      pull-requests: read
    steps:
      - name: Checkout trusted main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11.13"
      - name: Install pinned runtime
        run: python -m pip install --only-binary ':all:' -c requirements/ci-constraints.txt .
      - name: Advance (fallback result, back to pending, or terminal failure)
        id: advance
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HUNTER_ISSUE_AGENT_STATE_SIGNING_KEY: ${{ secrets.HUNTER_ISSUE_AGENT_STATE_SIGNING_KEY }}
          ISSUE: ${{ inputs.issue }}
          ADVISORY: ${{ needs.execute-fallback.outputs.advisory_code }}
          ATTESTATION: ${{ needs.execute-fallback.outputs.attestation_sha256 }}
          FALLBACK_MODEL: ${{ needs.execute-fallback.outputs.fallback_model }}
        run: >-
          python scripts/hunter_issue_agent_lifecycle.py step --role bind --job bind-fallback --issue "$ISSUE"
          --advisory "$ADVISORY" --attestation-sha256 "$ATTESTATION" --fallback-model "$FALLBACK_MODEL"

  resume-bind:
    name: resume-bind
    if: >-
      github.event_name == 'workflow_dispatch'
      && inputs.remediation_authorization == ''
      && inputs.stage != ''
      && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: hunter-issue-agent-control
    permissions:
      contents: write
      actions: read
    outputs:
      control_sha: ${{ steps.bind.outputs.control_sha }}
    steps:
      - name: Checkout trusted main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11.13"
      - name: Install pinned runtime
        run: python -m pip install --only-binary ':all:' -c requirements/ci-constraints.txt .
      - name: Claim the pending resume nonce by CAS
        id: bind
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HUNTER_ISSUE_AGENT_STATE_SIGNING_KEY: ${{ secrets.HUNTER_ISSUE_AGENT_STATE_SIGNING_KEY }}
          ISSUE: ${{ inputs.issue }}
          AUTHORIZATION_ID: ${{ inputs.authorization_id }}
          STAGE: ${{ inputs.stage }}
          NONCE: ${{ inputs.nonce }}
        run: >-
          python scripts/hunter_issue_agent_lifecycle.py resume-bind
          --issue "$ISSUE" --authorization-id "$AUTHORIZATION_ID" --stage "$STAGE" --nonce "$NONCE"

  validate:
    name: validate
    needs: [authorize, bind, bind-fallback, resume-bind]
    if: >-
      always() && (
        ((github.event_name == 'issues' || needs.authorize.outputs.remediation == 'true')
          && needs.bind.result == 'success'
          && needs.bind.outputs.result_bound == 'true')
        || (github.event_name == 'workflow_dispatch' && inputs.stage == 'fallback'
            && needs.bind-fallback.result == 'success'
            && needs.bind-fallback.outputs.result_bound == 'true')
        || (github.event_name == 'workflow_dispatch' && inputs.stage == 'validation'
            && needs.resume-bind.result == 'success')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: hunter-issue-agent-validator
    permissions:
      actions: read
    outputs:
      outcome: ${{ steps.bound.outputs.validation_outcome }}
    env:
      ISSUE: ${{ needs.authorize.outputs.issue || inputs.issue }}
      AUTHORIZATION_ID: ${{ needs.authorize.outputs.authorization_id || inputs.authorization_id }}
      CONTROL_SHA: ${{ needs.resume-bind.outputs.control_sha || github.sha }}
    steps:
      - name: Checkout control_sha
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resume-bind.outputs.control_sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11.13"
      - name: Install pinned runtime and toolchain
        run: python -m pip install --only-binary ':all:' -c requirements/ci-constraints.txt -e ".[dev]"
      - name: Create the network-less isolation uid
        run: |
          set -euo pipefail
          sudo useradd --create-home --shell /usr/sbin/nologin hunter-untrusted
          sudo iptables -A OUTPUT -m owner --uid-owner hunter-untrusted -j REJECT
          sudo ip6tables -A OUTPUT -m owner --uid-owner hunter-untrusted -j REJECT
      - name: Read the bound result binding from the ledger
        id: bound
        env:
          # Issue #577: run-provenance reads only; this job's token is actions:read and the step runs no untrusted code.
          HUNTER_ISSUE_AGENT_PROVENANCE_TOKEN: ${{ github.token }}
        run: >-
          python scripts/hunter_issue_agent_lifecycle.py bound
          --issue "$ISSUE" --authorization-id "$AUTHORIZATION_ID"
      - name: Download the bound result
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ steps.bound.outputs.result_artifact_id }}
          run-id: ${{ steps.bound.outputs.result_run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/result
          digest-mismatch: error
      - name: Validate the exact unsigned commit (credential-free)
        env:
          HUNTER_ISSUE_AGENT_RESULT_KEY: ${{ secrets.HUNTER_ISSUE_AGENT_RESULT_KEY }}
          # Issue #577: popped by the trusted intake before any subprocess; the isolation uid runs under `env -i`.
          HUNTER_ISSUE_AGENT_PROVENANCE_TOKEN: ${{ github.token }}
        run: >-
          python scripts/hunter_issue_agent_lifecycle.py validate
          --issue "$ISSUE" --authorization-id "$AUTHORIZATION_ID"
          --result "$(find "$RUNNER_TEMP/result" -type f -name result.sealed)"
          --trusted-repo "$GITHUB_WORKSPACE" --out "$RUNNER_TEMP/receipt.json"
      - name: Upload the digest-only receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.bound.outputs.validation_outcome }}
          path: ${{ runner.temp }}/receipt.json
          if-no-files-found: error
          retention-days: 1

  record-validation:
    name: record-validation
    needs: [authorize, validate, resume-bind]
    if: >-
      always()
      && (needs.authorize.result == 'success' || needs.resume-bind.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: hunter-issue-agent-control
    permissions:
      contents: write
      actions: write
      pull-requests: read
    steps:
      - name: Checkout trusted main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11.13"
      - name: Install pinned runtime
        run: python -m pip install --only-binary ':all:' -c requirements/ci-constraints.txt .
      - name: Advance (T3, a validation resume, or terminal failure)
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HUNTER_ISSUE_AGENT_STATE_SIGNING_KEY: ${{ secrets.HUNTER_ISSUE_AGENT_STATE_SIGNING_KEY }}
          ISSUE: ${{ needs.authorize.outputs.issue || inputs.issue }}
        run: python scripts/hunter_issue_agent_lifecycle.py step --role record-validation --issue "$ISSUE"

  publish:
    name: publish
    needs: [authorize, record-validation, validate, resume-bind]
    if: >-
      always() && (
        ((github.event_name == 'issues' || needs.authorize.outputs.remediation == 'true')
          && needs.record-validation.result == 'success'
          && needs.validate.result == 'success')
        || (github.event_name == 'workflow_dispatch' && inputs.stage == 'publication'
            && needs.resume-bind.result == 'success')
        || (github.event_name == 'workflow_dispatch' && inputs.stage == 'fallback'
            && needs.record-validation.result == 'success'
            && needs.validate.result == 'success')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: hunter-issue-agent-publisher
    permissions:
      contents: read
      issues: read
      pull-requests: read
      actions: read
    env:
      ISSUE: ${{ needs.authorize.outputs.issue || inputs.issue }}
      AUTHORIZATION_ID: ${{ needs.authorize.outputs.authorization_id || inputs.authorization_id }}
    steps:
      - name: Checkout control_sha
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resume-bind.outputs.control_sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11.13"
      - name: Install pinned runtime
        run: python -m pip install --only-binary ':all:' -c requirements/ci-constraints.txt .
      - name: Read the bound result binding from the ledger
        id: bound
        env:
          # Issue #577: run-provenance reads only; this job's token is read-only and the step runs no candidate code.
          HUNTER_ISSUE_AGENT_PROVENANCE_TOKEN: ${{ github.token }}
        run: >-
          python scripts/hunter_issue_agent_lifecycle.py bound
          --issue "$ISSUE" --authorization-id "$AUTHORIZATION_ID"
      - name: Download the bound result
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ steps.bound.outputs.result_artifact_id }}
          run-id: ${{ steps.bound.outputs.result_run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/result
          digest-mismatch: error
      - name: Create-only publication of exactly the validated commit (runs no candidate code)
        id: publish
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HUNTER_HGCC_READ_TOKEN: ${{ secrets.HUNTER_HGCC_READ_TOKEN }}
          HUNTER_ISSUE_AGENT_RESULT_KEY: ${{ secrets.HUNTER_ISSUE_AGENT_RESULT_KEY }}
          HUNTER_ISSUE_AGENT_PUBLISHER_PUSH_TOKEN: ${{ secrets.HUNTER_ISSUE_AGENT_PUBLISHER_PUSH_TOKEN }}
          HUNTER_ISSUE_AGENT_PUBLISHER_SIGNING_KEY: ${{ secrets.HUNTER_ISSUE_AGENT_PUBLISHER_SIGNING_KEY }}
        run: >-
          python scripts/hunter_issue_agent_lifecycle.py publish
          --issue "$ISSUE" --authorization-id "$AUTHORIZATION_ID"
          --result "$(find "$RUNNER_TEMP/result" -type f -name result.sealed)"
          --trusted-repo "$GITHUB_WORKSPACE" --out "$RUNNER_TEMP/publication.json"
          --workroot "$RUNNER_TEMP/publish"
      - name: Upload a trusted refusal
        if: steps.publish.outputs.refused == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.bound.outputs.publication_outcome }}
          path: ${{ runner.temp }}/publication.json
          retention-days: 1

  finalize:
    name: finalize
    needs: [authorize, execute, bind, resume-bind, validate, record-validation, publish]
    if: >-
      always()
      && (needs.authorize.result == 'success'
          || (needs.resume-bind.result == 'success' && needs.authorize.result != 'failure'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: hunter-issue-agent-control
    permissions:
      contents: write
      actions: write
      pull-requests: read
    steps:
      - name: Checkout trusted main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11.13"
      - name: Install pinned runtime
        run: python -m pip install --only-binary ':all:' -c requirements/ci-constraints.txt .
      - name: Advance (T4, a publication resume, or terminal failure)
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HUNTER_ISSUE_AGENT_STATE_SIGNING_KEY: ${{ secrets.HUNTER_ISSUE_AGENT_STATE_SIGNING_KEY }}
          ISSUE: ${{ needs.authorize.outputs.issue || inputs.issue }}
        run: python scripts/hunter_issue_agent_lifecycle.py step --role finalize --issue "$ISSUE"
