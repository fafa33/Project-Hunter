name: Hunter Automatic Canonicalization

# Trusted-default-branch, self-hosted continuation of the review lifecycle.
# The repository token is read-only.  The only content-write channel is the
# already-authorized local_git_push path on the owner's Mac, so this workflow
# grants no new GitHub repository-write authority.
on:
  # The merged/closed event is the authoritative writer continuation.
  # workflow_dispatch is the explicit recovery path for an authorized PR.
  # Review and comment events are intentionally not triggers: bot-authored
  # events are approval-held and unmerged PRs cannot enter the writer path.
  # GitHub Actions provides no review-thread-resolution event.
  pull_request:
    types: [closed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR to catch up/reconcile
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read

env:
  PYTHONPATH: src

jobs:
  canonicalize:
    runs-on: [self-hosted, macOS]
    timeout-minutes: 10
    steps:
      - name: Checkout trusted default branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          fetch-depth: 0
      - name: Resolve exact PR identity
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          EVENT_PR: ${{ github.event.pull_request.number }}
          INPUT_PR: ${{ inputs.pr_number }}
        run: |
          set -euo pipefail
          PR_NUMBER="${EVENT_PR:-${INPUT_PR:-}}"
          [[ "${PR_NUMBER}" =~ ^[1-9][0-9]*$ ]]
          HEAD_SHA="$(gh pr view "${PR_NUMBER}" --repo "${REPOSITORY}" --json headRefOid --jq .headRefOid)"
          BASE_SHA="$(gh pr view "${PR_NUMBER}" --repo "${REPOSITORY}" --json baseRefOid --jq .baseRefOid)"
          echo "PR_NUMBER=${PR_NUMBER}" >> "$GITHUB_ENV"
          echo "HEAD_SHA=${HEAD_SHA}" >> "$GITHUB_ENV"
          echo "BASE_SHA=${BASE_SHA}" >> "$GITHUB_ENV"
      - name: Detect trusted canonicalization engine
        id: engine
        run: |
          if [[ -f scripts/hunter_collect_learning_observations.py && -f scripts/hunter_canonicalization_candidate_pr.py ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "Bootstrap: trusted default branch does not contain the canonicalization engine yet; candidate code will not be executed."
          fi
      - name: Set up Python
        if: steps.engine.outputs.available == 'true'
        uses: actions/setup-python@v6
        env:
          # This job runs on a self-hosted macOS runner whose account is not
          # `/Users/runner`. `cache: pip` resolves its cache directory from the
          # runner account's home, so without an explicit portable path the step
          # fails with `mkdir: /Users/runner: Permission denied` and canonicalization
          # never runs. runner.temp is supplied by the runner and is portable
          # across hosted and self-hosted images.
          PIP_CACHE_DIR: ${{ runner.temp }}/pip-cache
          # Issue #551: PIP_CACHE_DIR only relocates pip's own download cache. The action's
          # separate tool-cache installer (where it downloads and installs the Python
          # interpreter itself, before pip ever runs) reads RUNNER_TOOL_CACHE directly --
          # confirmed from its own vendored source, which asserts this variable is defined
          # and otherwise falls back to a runner-agent default that is not guaranteed to be
          # writable by this runner's actual account. Pinning it here, the same way as the
          # pip cache above, removes that assumption instead of relying on a directory that
          # happens to already exist on one specific machine.
          RUNNER_TOOL_CACHE: ${{ runner.temp }}/hostedtoolcache
        with:
          python-version: "3.11"
          cache: pip
      - name: Install trusted canonicalization engine
        if: steps.engine.outputs.available == 'true'
        env:
          PIP_CONSTRAINT: requirements/ci-constraints.txt
        run: |
          # Canonicalization pushes cross the repository pre-push safety lane.
          # Provision that lane's tools in the setup-python interpreter instead of
          # inheriting same-named, non-executable shims from the self-hosted runner.
          # Issue #559: upstream cryptography has published no Intel macOS (x86_64) wheel for any
          # release patched against GHSA-g6cj-pr64-35w5/-jwv3-5hgf-82ww/-m2h6-j472-rp4c (all three
          # fixed only at 49.0.0+, which is arm64-only on macOS) -- so pinning an older wheel-having
          # release would trade the install failure for known, unpatched CVEs instead. This runner's
          # pinned Homebrew Rust toolchain (verified: a fresh, uncached `pip install --no-binary
          # cryptography` build succeeds in under a minute) builds exactly this one package from
          # source at the same patched 50.0.0 the rest of the fleet uses on wheels; every other
          # dependency, and every other platform, stays strictly binary-only.
          python -m pip install --only-binary ':all:' --no-binary cryptography -c requirements/ci-constraints.txt '.[dev]'
          python - <<'PYTOOLS' >> "$GITHUB_PATH"
          import sysconfig
          print(sysconfig.get_path("scripts"))
          PYTOOLS
      - name: Checkout exact reviewed PR for regression evidence
        if: steps.engine.outputs.available == 'true'
        uses: actions/checkout@v7
        with:
          ref: ${{ env.HEAD_SHA }}
          path: reviewed-pr
          persist-credentials: false
          fetch-depth: 1
      - name: Capture authenticated finding lifecycle
        if: steps.engine.outputs.available == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python scripts/hunter_collect_learning_observations.py \
            --repository "${REPOSITORY}" --pr "${PR_NUMBER}" --head "${HEAD_SHA}" --base "${BASE_SHA}" \
            > hunter-finding-lifecycle.json
      - name: Provision GitHub SSH host key for canonicalization push
        if: steps.engine.outputs.available == 'true'
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          touch "$HOME/.ssh/known_hosts"
          if ssh-keygen -F github.com -f "$HOME/.ssh/known_hosts" >/dev/null 2>&1; then
            echo "github.com already present in known_hosts; no provisioning needed."
          else
            # Issue #551: this job's push step authenticates to github.com over SSH (see the
            # next step), which depends on the executing account's own known_hosts -- not on
            # anything `actions/checkout` configures. The self-hosted fleet schedules this job
            # across more than one macOS runner account, and a dedicated non-interactive
            # service account has never made an interactive SSH connection, so it fails closed
            # with "Host key verification failed" before ever reaching the push. Confirmed from
            # real hosted evidence: 12 consecutive canonicalization runs (PRs #691-#729) failed
            # here. Fetching GitHub's own current host keys from its Meta API over HTTPS --
            # GitHub's documented non-interactive provisioning path -- repairs this without ever
            # relaxing host-key verification itself.
            if ! curl -fsSL --proto '=https' --proto-redir '=https' https://api.github.com/meta -o "$RUNNER_TEMP/github-meta.json"; then
              echo "INFRA_PROVISIONING_FAILURE: could not fetch GitHub's published SSH host keys" >&2
              exit 86
            fi
            if ! python3 - "$RUNNER_TEMP/github-meta.json" "$HOME/.ssh/known_hosts" <<'PYEOF'
          import json
          import sys

          meta_path, known_hosts_path = sys.argv[1], sys.argv[2]
          with open(meta_path, encoding="utf-8") as handle:
              meta = json.load(handle)
          keys = meta.get("ssh_keys")
          if not keys:
              raise SystemExit("GitHub Meta API response had no ssh_keys")
          with open(known_hosts_path, "a", encoding="utf-8") as handle:
              for key in keys:
                  handle.write(f"github.com {key}\n")
          PYEOF
            then
              echo "INFRA_PROVISIONING_FAILURE: could not write GitHub's published host keys to known_hosts" >&2
              exit 86
            fi
            if ! ssh-keygen -F github.com -f "$HOME/.ssh/known_hosts" >/dev/null 2>&1; then
              echo "INFRA_PROVISIONING_FAILURE: github.com still missing from known_hosts after provisioning" >&2
              exit 86
            fi
            echo "Provisioned github.com host key(s) from GitHub's own published Meta API."
          fi
          # Issue #551 recurrence: even after the provisioning above reports github.com present,
          # 12 real runs on this fleet's fallback runner account still failed the next step's git
          # fetch with "Host key verification failed" -- diagnosed live, not assumed, that the keys
          # written are byte-identical to a real working known_hosts (compared directly against
          # GitHub's Meta API), so this is not a data bug. Without filesystem access to that account
          # to find the exact mismatch, stop depending on ssh's own default, ambient resolution of
          # which known_hosts file applies to this invocation -- whatever that resolves to on a given
          # runner account/HOME combination -- and instead bind the fetch/push in the next step to
          # the exact file this step just verified, explicitly, on the repository checkout both steps
          # share. This also removes any dependency on a stale core.sshCommand left by some earlier,
          # unrelated job on this long-lived self-hosted checkout (actions/checkout's own cleanup
          # only clears this after the job, never proved it was the cause here, but closing it off
          # costs nothing and cannot regress the already-working primary-runner path).
          echo "::notice::SSH diagnostic -- whoami=$(whoami) HOME=$HOME"
          echo "::notice::SSH diagnostic -- ssh -G resolution: $(ssh -G github.com 2>&1 | grep -iE '^user |^hostname |^userknownhostsfile|^identityfile|^stricthostkeychecking' | tr '\n' ';')"
          echo "::notice::SSH diagnostic -- existing core.sshCommand (local/global): $(git config --get core.sshCommand || echo '<unset>')/$(git config --global --get core.sshCommand || echo '<unset>')"
          # Issue #551 recurrence, same defect class, a second default ssh_config directive: once the
          # known_hosts binding above let the fetch past host-key verification, real fallback-runner
          # evidence (PRs #592, #553, #622, #693, #719, #722) showed it then fail "Permission denied
          # (publickey)" -- ssh's *default* `IdentityFile ~/.ssh/id_*` entries are `~`-expanded exactly
          # like `UserKnownHostsFile` above, through the same password-database home, not `$HOME`. Any
          # identity provisioned at the `$HOME`-relative path this job otherwise uses throughout would
          # be invisible to ssh's own default lookup for the identical reason. List (never read) what
          # is actually present, safely -- filenames and permissions only, no key material -- and bind
          # every conventional identity name explicitly under `$HOME` so a key placed there is found
          # regardless of this account's password-database home. A name ssh does not find here is
          # skipped with a warning, not a hard failure, so this is safe even if none of them exist.
          echo "::notice::SSH diagnostic -- $HOME/.ssh listing: $(ls -la "$HOME/.ssh" 2>&1 | tr '\n' ';')"
          # Deliberately not IdentitiesOnly=yes: these $HOME-relative paths are added to ssh's own
          # default search, never substituted for it, so this cannot remove an identity that already
          # worked (an agent-offered key, or any other default this account already relied on).
          git config core.sshCommand "ssh -o UserKnownHostsFile=$HOME/.ssh/known_hosts -o StrictHostKeyChecking=yes -o IdentityFile=$HOME/.ssh/id_ed25519 -o IdentityFile=$HOME/.ssh/id_rsa -o IdentityFile=$HOME/.ssh/id_ecdsa"
      - name: Propose canonical knowledge when replayable evidence exists
        if: steps.engine.outputs.available == 'true'
        env:
          # Read-only API access for gh pr view/list and issue evidence; SSH remains the only push channel.
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          HUNTER_REGRESSION_ROOT: ${{ github.workspace }}/reviewed-pr
        run: |
          # Keep GitHub's workflow token read-only. Pushes use the owner's existing
          # local SSH identity and still cross the canonical pre-push hook.
          git config core.hooksPath .githooks
          git remote set-url origin "git@github.com:${REPOSITORY}.git"
          python scripts/hunter_canonicalization_candidate_pr.py \
            --pr "${PR_NUMBER}" --head "${HEAD_SHA}" --base "${BASE_SHA}" \
            --observations hunter-finding-lifecycle.json --repo origin
      - name: Preserve lifecycle evidence even when no family maps
        if: steps.engine.outputs.available == 'true' && always()
        uses: actions/upload-artifact@v4
        with:
          name: hunter-finding-lifecycle-${{ env.PR_NUMBER }}-${{ env.HEAD_SHA }}
          path: hunter-finding-lifecycle.json
          if-no-files-found: warn
          retention-days: 90
