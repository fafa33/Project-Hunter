name: Hunter / Issue Agent Issuer Deploy

# Deploys the trusted issuer edge for governed Issue agent execution.
# This workflow is manually triggered and deploys to the configured platform.
# The deployed endpoint URL must be configured as the repository secret
# HUNTER_ISSUE_AGENT_WEBHOOK_URL.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Deployment environment (production|staging)"
        required: true
        default: "production"
        type: choice
        options:
          - production
          - staging

permissions:
  contents: read

concurrency:
  group: hunter-issue-agent-issuer-${{ github.event.inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy trusted issuer edge
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write  # For OIDC to cloud provider

    env:
      ENVIRONMENT: ${{ github.event.inputs.environment }}

    steps:
      - name: Checkout trusted repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11.18"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements/ci-constraints.txt

      - name: Install dependencies
        env:
          PIP_CONSTRAINT: requirements/ci-constraints.txt
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -c requirements/ci-constraints.txt -e ".[dev]"

      - name: Verify issuer entrypoint
        run: |
          set -euo pipefail
          python scripts/hunter_issue_agent_issuer.py --help

      # Issue #575: a green deployment must never be a template/no-op.
      # A trusted, persistent self-hosted issuer and shared registry backend
      # must be provisioned and proven before replacing this fail-closed gate.
      - name: Refuse unconfigured issuer deployment
        run: |
          echo "::error::Issuer deployment is not configured. No persistent shared Workspace Registry, trusted issuer endpoint, or hosted admission proof is provisioned."
          echo "::error::Issue #575 must supply an approved shared authority deployment before enabling this workflow."
          exit 1
