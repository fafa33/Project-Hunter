name: PR335 fix missing test import

on:
  push:
    branches:
      - codex/issue-334-response-validator-phase-b
    paths:
      - .github/workflows/pr335-fix-missing-test-import.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: codex/issue-334-response-validator-phase-b
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11.13"
      - name: Patch import and verify Ruff
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/test_response_validator_phase_b.py')
          text = path.read_text()
          anchor = 'from hunter.evidence_intelligence import model_adapter\n'
          replacement = anchor + 'from hunter.evidence_intelligence.transient_worker import TransientResponseHandoffVault\n'
          if replacement not in text:
              if anchor not in text:
                  raise SystemExit('expected model_adapter import anchor missing')
              text = text.replace(anchor, replacement, 1)
              path.write_text(text)
          PY
          python -m pip install --disable-pip-version-check -c requirements/ci-constraints.txt -e ".[dev]"
          ruff check tests/test_response_validator_phase_b.py
          python -m pytest -q tests/test_response_validator_phase_b.py -k 'fresh_spawn_interpreter_not_fork or huge_integral_decimal_size_bound'
          rm .github/workflows/pr335-fix-missing-test-import.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Fix spawn regression test import"
          git push origin HEAD:codex/issue-334-response-validator-phase-b
