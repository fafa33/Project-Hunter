name: PR335 finalize spawn

on:
  push:
    branches:
      - codex/issue-334-response-validator-phase-b
    paths:
      - .github/workflows/pr335-finalize-spawn.yml

permissions:
  contents: write
  actions: read

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: codex/issue-334-response-validator-phase-b
          fetch-depth: 0
      - name: Wait for numeric fixer and refresh exact branch
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 180); do
            status=$(gh api repos/fafa33/Project-Hunter/actions/runs/32922174877 --jq .status)
            if [ "$status" = "completed" ]; then
              conclusion=$(gh api repos/fafa33/Project-Hunter/actions/runs/32922174877 --jq .conclusion)
              test "$conclusion" = "success"
              break
            fi
            sleep 5
          done
          test "$(gh api repos/fafa33/Project-Hunter/actions/runs/32922174877 --jq .status)" = "completed"
          git fetch origin codex/issue-334-response-validator-phase-b
          git reset --hard origin/codex/issue-334-response-validator-phase-b
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11.13"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements/ci-constraints.txt
      - name: Install project
        env:
          PIP_CONSTRAINT: requirements/ci-constraints.txt
        run: python -m pip install --disable-pip-version-check -c requirements/ci-constraints.txt -e ".[dev]"
      - name: Execute existing governed spawn bootstrap
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/pr335-fixer-bootstrap.yml').read_text().splitlines()
          marker = '      - name: Execute, verify, and commit spawn implementation'
          marker_index = workflow.index(marker)
          run_index = next(i for i in range(marker_index + 1, len(workflow)) if workflow[i] == '        run: |')
          body = []
          for line in workflow[run_index + 1:]:
              if line.startswith('          '):
                  body.append(line[10:])
              elif not line:
                  body.append('')
              else:
                  break
          Path('/tmp/pr335-bootstrap.sh').write_text('\n'.join(body) + '\n')
          PY
          bash -euxo pipefail /tmp/pr335-bootstrap.sh
      - name: Prove spawn boundary and numeric safety on pushed source
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin codex/issue-334-response-validator-phase-b
          git reset --hard origin/codex/issue-334-response-validator-phase-b
          if grep -n 'os\.fork' src/hunter/evidence_intelligence/transient_worker.py; then
            echo 'fork remains in transient worker' >&2
            exit 1
          fi
          grep -n 'get_context("spawn")' src/hunter/evidence_intelligence/transient_worker.py
          if grep -nE 'len\(value\) [<>] int\(schema\["(minItems|maxItems|minLength|maxLength)"\]\)' src/hunter/evidence_intelligence/response_validator.py; then
            echo 'unsafe Decimal-to-int size comparison remains' >&2
            exit 1
          fi
          python -m pytest -q tests/test_response_validator_phase_b.py -k 'fresh_spawn_interpreter or huge_integral_decimal_size_bound or revalidation_uses_parent_fresh_authority_plan or refusing_competing_event_preserves_reserved_owner_body or integral_decimal_schema_size_keywords'
      - name: Remove PR-only fixer workflows and run final preflight
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/pr335-final-size-bound-fix.yml
          rm -f .github/workflows/pr335-fixer-bootstrap.yml
          rm -f .github/workflows/pr335-root-spawn-fix.yml
          rm -f .github/workflows/pr335-finalize-spawn.yml
          python scripts/hunter_pr_preflight.py --mode normal
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m "Remove PR335 fixer workflows after verified spawn fix"
            git push origin HEAD:codex/issue-334-response-validator-phase-b
          fi
