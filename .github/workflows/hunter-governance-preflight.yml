name: Hunter Governance Agent Preflight

# Post-merge enforcement adapter for Issue #276. The executable policy is
# always loaded from the trusted default branch; pull-request code is never
# checked out or executed by this workflow.

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
      - edited
      - ready_for_review
      - converted_to_draft

permissions:
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: hunter-governance-agent-preflight-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preflight:
    name: Governance Agent Preflight
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout trusted default-branch enforcement engine
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Validate live PR identity, body, trace, and governance ownership
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          if [ ! -f scripts/hunter_governance_preflight.py ]; then
            echo "::warning::Issue #276 bootstrap: governance preflight is not yet installed on the default branch."
            echo "::warning::The installing PR remains governed by the existing Governance Review and Merge Readiness gates."
            exit 0
          fi
          python scripts/hunter_governance_preflight.py live-pr \
            --repo "${GH_REPO}" \
            --pr "${PR_NUMBER}"
