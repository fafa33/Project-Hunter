name: Hunter Governance Agent Preflight

# Lightweight structural sanity check. Process metadata is not merge authority.
# The workflow never executes PR-controlled code.

on:
  pull_request_target:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: hunter-governance-agent-preflight-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Governance Agent Preflight
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Validate stable PR identity required by GitHub itself
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          test -n "${PR_NUMBER}"
          test -n "${HEAD_SHA}"
          test "${BASE_REF}" = "main"
          echo "Governance preflight passed: PR exists, has a head SHA, and targets main."
