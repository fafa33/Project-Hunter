name: Hunter / Issue 586 Live Canary
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'scripts/hunter_collect_sonar_observations.py'
      - 'scripts/hunter_issue_agent_lifecycle.py'
      - 'src/hunter/automation/issue_agent_knowledge.py'
      - 'tests/test_issue_agent_knowledge.py'
      - '.github/workflows/hunter-issue586-live-canary.yml'
permissions:
  contents: read
  pull-requests: read
jobs:
  live-observation-canary:
    if: github.event.pull_request.number == 662 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout candidate without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.11.13'
      - name: Collect actual exact-head Sonar findings (no signing key)
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          # Sonar's PR analysis is asynchronous relative to the pull_request event.
          # Retry only the exact-head-not-ready observation, never stale or partial proof.
          python - "$RUNNER_TEMP/sonar.json" "$HEAD_SHA" "$BASE_SHA" <<'PYCODE'
          import json
          import sys
          import time

          from pathlib import Path

          sys.path.insert(0, "scripts")
          import hunter_collect_sonar_observations as sonar

          output, head, base = Path(sys.argv[1]), sys.argv[2], sys.argv[3]
          for attempt in range(1, 21):
              observations = sonar.collect("fafa33_Project-Hunter", 662, head, base)
              assert observations and all(item["reviewed_head_sha"] == head for item in observations)
              unavailable = [item["message"] for item in observations if item.get("availability") != "available"]
              if not unavailable:
                  output.write_text(json.dumps(observations, sort_keys=True, indent=2) + "\n", encoding="utf-8")
                  findings = [item for item in observations if item["event_id"].startswith("sonar-issue-")]
                  print(f"Live Sonar exact-head observations: {len(findings)} issue(s)", flush=True)
                  if not findings:
                      print("CLEAN / NO_NEW_FINDINGS: exact-head Sonar analysis is valid; real Sonar finding ingestion remains NOT_YET_PROVEN", flush=True)
                  break
              if unavailable != ["Sonar exact-head analysis is not available yet"]:
                  raise SystemExit(f"FAIL-CLOSED: Sonar observation unavailable: {unavailable!r}")
              if attempt == 20:
                  raise SystemExit("FAIL-CLOSED: Sonar exact-head analysis unavailable after 20 bounded attempts")
              print(f"Sonar exact-head analysis pending ({attempt}/20); waiting 15s", flush=True)
              time.sleep(15)
          PYCODE
      - name: Verify candidate learning contract
        run: |
          python -m pip install --disable-pip-version-check --only-binary ':all:' -c requirements/ci-constraints.txt . pytest
          python -m pytest -q tests/test_issue_agent_knowledge.py -k 'sonar_finding_flows or proven_resolved_finding'
      - name: Verify signed GitHub knowledge ingestion is consumed by real DPM context
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          # No signing secret, write token, synthetic ledger or mock: consume the
          # existing trusted-main GitHub knowledge ledger and its live provenance.
          python scripts/hunter_issue_agent_lifecycle.py knowledge-context-check \
            --path scripts/hunter_issue_evidence_writer.py \
            --base-sha "$BASE_SHA"
