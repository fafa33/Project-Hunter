name: Hunter / Trusted Preflight Upgrade

# Trusted verification path for pull requests that update preflight definition files.
# Candidate code may execute only inside the read-only validation job. The gate
# sequence itself is launched by the trusted default-branch controller, so a
# candidate cannot self-authorize by weakening hunter_pr_preflight.py.
# The separate publisher job is the only job with status-write authority and never
# executes candidate code.
#
# Issue #419: the trusted environment -- not the candidate -- owns, provisions and
# declares the parallel test runner its full-suite gate runs under. Everything
# installed here comes from the trusted default-branch checkout at the workspace
# root; the candidate is only ever read from ./candidate, so no candidate
# manifest, pin, pytest configuration or plugin can change what executes it.

on:
  pull_request_target:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize

concurrency:
  group: hunter-preflight-upgrade-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate-candidate:
    name: Trusted Candidate Preflight Validation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout trusted controller
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout exact candidate as untrusted input
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11.13"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements/ci-constraints.txt

      - name: Install trusted project dependencies
        env:
          PIP_CONSTRAINT: requirements/ci-constraints.txt
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -c requirements/ci-constraints.txt -e ".[dev]"

      # Named explicitly rather than left to arrive with the dev extra: the lane
      # below is only honest if this environment is the one that owns the runner.
      # Both the install and the pin come from the trusted default-branch tree at
      # the workspace root, so the candidate cannot reach either. The verification
      # fails the job loudly when the runner is absent, instead of letting the
      # gate chain discover it as an argument-parsing error mid-suite.
      - name: Provision and verify the trusted parallel test runner
        env:
          PIP_CONSTRAINT: requirements/ci-constraints.txt
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -c requirements/ci-constraints.txt pytest-xdist
          python scripts/hunter_defect_prevention_preflight.py --verify-parallel-runner

      - name: Validate candidate gate structure with trusted code
        run: |
          set -euo pipefail
          python scripts/hunter_defect_prevention_preflight.py --validate-candidate candidate

      - name: Execute immutable trusted gate chain against exact candidate
        env:
          GITHUB_TOKEN: ""
          GH_TOKEN: ""
          # Issue #419: distribution only. `loadfile` keeps every test in a file
          # on one worker, so intra-file ordering and module-scoped state behave
          # exactly as they do serially and only whole files run concurrently.
          # The gate commands are untouched, so the trusted proof selects exactly
          # the tests the serial lane selected. The trusted controller refuses to
          # run at all if this declaration is anything but the canonical
          # distribution-only lane, or if this environment cannot honour it.
          PYTEST_ADDOPTS: -n auto --dist loadfile
        run: |
          set -euo pipefail
          python scripts/hunter_defect_prevention_preflight.py --run-candidate-gates candidate

  publish-proof:
    name: Publish Exact-Head Trusted Upgrade Proof
    needs: validate-candidate
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      statuses: write

    steps:
      - name: Publish exact-head PR-bound status
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          VALIDATION_RESULT: ${{ needs.validate-candidate.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import urllib.request

          result = os.environ["VALIDATION_RESULT"]
          state = "success" if result == "success" else "failure"
          payload = json.dumps(
              {
                  "state": state,
                  "context": f"Hunter Trusted Preflight Upgrade / PR #{os.environ['PR_NUMBER']}",
                  "description": f"Exact candidate preflight validation {state} ({result})",
                  "target_url": os.environ["RUN_URL"],
              }
          ).encode("utf-8")
          request = urllib.request.Request(
              f"https://api.github.com/repos/{os.environ['GH_REPO']}/statuses/{os.environ['HEAD_SHA']}",
              data=payload,
              method="POST",
              headers={
                  "Authorization": f"Bearer {os.environ['GITHUB_TOKEN']}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "Content-Type": "application/json",
              },
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              if response.status != 201:
                  raise RuntimeError(f"status publication returned HTTP {response.status}")
          PY
