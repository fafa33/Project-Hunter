name: Hunter / Trusted Preflight Upgrade

# Trusted verification path for pull requests that update preflight definition files.
# Executes only trusted default-branch controller code.

on:
  pull_request_target:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: read

concurrency:
  group: hunter-preflight-upgrade-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  upgrade-preflight:
    name: Trusted Preflight Upgrade
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout trusted controller
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11.13"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements/ci-constraints.txt

      - name: Install project
        env:
          PIP_CONSTRAINT: requirements/ci-constraints.txt
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -c requirements/ci-constraints.txt -e ".[dev]"

      - name: Run shared deterministic preflight from trusted base
        run: python scripts/hunter_pr_preflight.py --mode normal
