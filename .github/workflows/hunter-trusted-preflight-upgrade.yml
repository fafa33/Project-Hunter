name: Hunter / Trusted Preflight Upgrade

# Trusted verification path for pull requests that update preflight definition files.
# Candidate files are read as data only; controller code executes from the trusted default branch.

on:
  pull_request_target:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: read
  statuses: write

concurrency:
  group: hunter-preflight-upgrade-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  upgrade-preflight:
    name: Trusted Preflight Upgrade
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout trusted controller
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout candidate definitions as data
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11.13"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements/ci-constraints.txt

      - name: Install trusted project
        env:
          PIP_CONSTRAINT: requirements/ci-constraints.txt
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -c requirements/ci-constraints.txt -e ".[dev]"

      - name: Validate exact candidate preflight definitions as data
        run: |
          set -euo pipefail
          python scripts/hunter_defect_prevention_preflight.py --validate-candidate candidate

      - name: Run shared deterministic preflight from trusted base
        run: python scripts/hunter_pr_preflight.py --mode normal

      - name: Publish exact-head trusted upgrade proof
        if: ${{ always() && !cancelled() }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          JOB_STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import urllib.request

          state = "success" if os.environ["JOB_STATUS"] == "success" else "failure"
          payload = json.dumps(
              {
                  "state": state,
                  "context": f"Hunter Trusted Preflight Upgrade / PR #{os.environ['PR_NUMBER']}",
                  "description": "Trusted candidate preflight definition validation " + state,
                  "target_url": os.environ["RUN_URL"],
              }
          ).encode("utf-8")
          request = urllib.request.Request(
              f"https://api.github.com/repos/{os.environ['GH_REPO']}/statuses/{os.environ['HEAD_SHA']}",
              data=payload,
              method="POST",
              headers={
                  "Authorization": f"Bearer {os.environ['GITHUB_TOKEN']}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "Content-Type": "application/json",
              },
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              if response.status != 201:
                  raise RuntimeError(f"status publication returned HTTP {response.status}")
          PY
