name: Hunter Governance Review Reconcile

# Periodic current-state sanity refresh for open PRs. No metadata history is
# reconstructed and no PR prose is evaluated.

on:
  push:
    branches:
      - main
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  statuses: write

concurrency:
  group: hunter-governance-reconcile
  cancel-in-progress: false

jobs:
  reconcile:
    name: Reconcile open pull requests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout trusted gate engine
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Refresh lightweight governance status
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
        run: |
          set -euo pipefail
          gh pr list \
            --repo "${GITHUB_REPOSITORY}" \
            --state open \
            --base main \
            --json number \
            --jq '.[].number' \
          | while read -r pr_number; do
              [ -z "${pr_number}" ] && continue
              python scripts/hunter_governance_review_v2.py \
                --pr "${pr_number}" \
                --repository "${GITHUB_REPOSITORY}"
            done
