name: Hunter Governance Review Reconcile

# Reconciliation trigger for target-branch advancement and missed events.
#
# GitHub Actions does not fire `pull_request` events when a protected target
# branch advances while PRs are open. Per the Hunter Governance Review
# specification, every approval is valid only for its exact reviewed pair
# (source HEAD + target BASE). This workflow re-evaluates every open PR that
# targets a protected branch:
#
#   - on every push to a protected branch, and
#   - on a 30-minute schedule as a safety net.
#
# Each evaluated PR receives a fresh review of its exact current source HEAD
# and target BASE. When the target BASE advanced, the previous approval is
# stale and the gate publishes REVIEW_FAILED until the PR is updated (which
# re-triggers the primary workflow). See docs/HUNTER_GOVERNANCE_REVIEW.md.

on:
  push:
    branches:
      - main
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  statuses: write

concurrency:
  group: hunter-governance-reconcile
  cancel-in-progress: false

jobs:
  reconcile:
    name: Reconcile open pull requests
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout trusted gate engine (default branch)
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: main
          fetch-depth: 1

      - name: Evaluate open pull requests targeting protected branches
        working-directory: scripts
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          HUNTER_LLM_API_KEY: ${{ secrets.HUNTER_LLM_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          HUNTER_LLM_MODEL: ${{ vars.HUNTER_LLM_MODEL }}
          HUNTER_LLM_BASE_URL: ${{ vars.HUNTER_LLM_BASE_URL }}
          PROTECTED_BRANCHES: ${{ vars.HUNTER_GOVERNANCE_PROTECTED_BRANCHES || 'main' }}
        run: |
          set -euo pipefail
          for base in ${PROTECTED_BRANCHES//,/ }; do
            echo "::group::Open PRs targeting ${base}"
            gh pr list \
              --repo "${GITHUB_REPOSITORY}" \
              --state open \
              --base "${base}" \
              --json number \
              --jq '.[].number' \
            | while read -r pr_number; do
                [ -z "${pr_number}" ] && continue
                echo "Evaluating PR #${pr_number}"
                python -m hunter_governance_review \
                  --pr "${pr_number}" \
                  --repository "${GITHUB_REPOSITORY}" \
                  --root "${GITHUB_WORKSPACE}" \
                || echo "::warning::gate exited $? for PR #${pr_number}; continuing"
              done
            echo "::endgroup::"
          done
