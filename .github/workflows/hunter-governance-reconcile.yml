name: Hunter Governance Review Reconcile

# Current-state sanity refresh for open PRs. No metadata history is
# reconstructed and no PR prose is evaluated. Exact-head branch preflight
# completion triggers an immediate refresh so API-written heads cannot remain
# admitted on stale governance state.
#
# This workflow also owns privileged reviewer orchestration (`actions: write`).
# It has no `pull_request` trigger, so the pull_request-class paths always run
# the trusted default-branch version of this file: a candidate cannot reach
# these permissions by editing a workflow on its own branch. `workflow_dispatch`
# runs the dispatched ref's file, so the privileged job additionally refuses to
# run off the default-branch ref (see the `reconcile` job's `if`).
#
# Issue #534: Draft -> Ready for Review is a lifecycle transition that
# `Hunter / Merge Readiness` reacts to immediately (it listens for
# `ready_for_review`), but until this trigger existed, reconciliation here
# only happened on the next push/review/workflow_run event or the 30-minute
# schedule -- readiness could wake and report a missing orchestration cycle
# before one had a chance to exist. `pull_request_target` is deliberately
# used instead of `pull_request`: GitHub resolves a `pull_request_target`
# workflow from the base branch's copy of the file, so this stays on the same
# trusted-default-branch execution path as every other trigger above, and a
# candidate branch cannot grant itself `actions: write` by editing this file.
#
# Issue #534 recurrence, same defect, new event variant: `synchronize` is the
# other transition `Hunter / Merge Readiness` reacts to immediately, and it is
# the one that changes a PR's exact HEAD. Observing live on PR #535 at exact
# HEAD 51108333821ab42d1ab7aa0b812a72d890f73795: a push at 07:40:33Z woke
# Merge Readiness, Trusted Preflight Upgrade and Governance Agent Preflight,
# but this workflow had no direct `synchronize` trigger, so no trusted
# event-driven path created the exact-head orchestration prerequisite for the
# new HEAD. The only paths left were the `workflow_run` reconciliations that
# depend on a *different* workflow completing first, and the 30-minute
# schedule -- recovery fallbacks, not a primary mechanism, and Merge Readiness
# had already correctly published MALFORMED_REVIEW: WAITING_FOR_REVIEWER.
#
# `synchronize` is the exact-HEAD-changing variant of the same wiring
# asymmetry, so it belongs in the same trusted trigger. Draft PRs also fire
# `synchronize` (unlike `ready_for_review`, which fires only on leaving Draft);
# that is safe because the Draft short-circuit lives in the trusted orchestrator
# itself (`hunter_review_orchestrator.ensure_current`), which returns before
# any review-request lookup or dispatch. Exact-head binding is unaffected: the
# step passes only `--pr`, and the orchestrator re-derives the current HEAD from
# trusted GitHub state rather than from this event's payload.
#
# Issue #575: verified Issue Agent thread resolution also needs an immediate
# current-state refresh. The resolver has no workflow authority, so this trusted
# workflow observes its real `workflow_run` completion, accepts only the scoped
# PR identities published after durable knowledge persistence, and rebinds the
# exact HEAD from live GitHub state before every invocation. The 5-minute sweep
# remains recovery, including for thread resolutions GitHub does not emit as a
# workflow event.

on:
  push:
    branches:
      - main
  workflow_run:
    workflows:
      - Hunter / Pre-PR Preflight
      - Hunter / Trusted Preflight Upgrade
      - Hunter Governance Review
      - Hunter Reviewer Collector
      - Hunter / Issue Agent Reconcile
    types:
      - completed
  # Bot-authored review events are approval-held by GitHub. The trusted
  # 5-minute sweep is the bounded review-state-change reconciliation path,
  # including human submitted/edited/dismissed reviews and inline comments;
  # no review webhook may run a privileged workflow directly. Trusted
  # pull_request_target and workflow_run remain event-driven for head changes.
  pull_request_target:
    branches:
      - main
    types:
      - ready_for_review
      - synchronize
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  actions: write
  checks: read
  contents: read
  pull-requests: read
  statuses: write

concurrency:
  group: hunter-governance-reconcile
  cancel-in-progress: false

jobs:
  reconcile:
    name: Reconcile open pull requests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)

    steps:
      - name: Checkout trusted gate engine
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Refresh lightweight governance status
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          EVENT_WORKFLOW_RUN_NAME: ${{ github.event.workflow_run.name }}
          EVENT_WORKFLOW_RUN_TITLE: ${{ github.event.workflow_run.display_title }}
          EVENT_WORKFLOW_RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          EVENT_WORKFLOW_RUN_PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          EVENT_WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id }}
          EVENT_WORKFLOW_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          EVENT_WORKFLOW_RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: |
          set -euo pipefail
          # Event-driven reconciliation is deliberately scoped to the PR that
          # caused the event. Sweeping every open PR for each review/check event
          # multiplies API traffic and can exhaust the installation rate limit.
          # Scheduled/manual recovery remains the bounded full-sweep path.
          event_name="${{ github.event_name }}"
          failures=0
          resolution_marker=""
          if [[ "${event_name}" == "pull_request_target" ]]; then
            pr_numbers="${{ github.event.pull_request.number }}"
          elif [[ "${event_name}" == "workflow_run" && "${EVENT_WORKFLOW_RUN_NAME}" == "Hunter Governance Review" ]]; then
            # A PR synchronize event runs the read-only governance workflow first.
            # Its workflow_run association carries the triggering PR number, while
            # this trusted default-branch workflow owns actions:write and may
            # safely hand pending exact-head review state to the orchestrator.
            pr_numbers="${EVENT_WORKFLOW_RUN_PR_NUMBER}"
          elif [[ "${event_name}" == "workflow_run" && "${EVENT_WORKFLOW_RUN_NAME}" == "Hunter Reviewer Collector" ]]; then
            # The collector always runs from the trusted default branch, so its
            # own workflow_run.head_sha is main's SHA, never the candidate's --
            # searching open PRs by that SHA would find none and silently skip
            # reconciling the PR this collector was actually dispatched for.
            # The candidate PR is instead the one already-trusted identity this
            # run itself carries: its own run-name, rendered by the collector
            # workflow from the exact inputs it was dispatched with (never from
            # this event, which cannot express them). A malformed or absent
            # title yields no PR number, which the loop below already skips.
            pr_numbers="$(printf '%s' "${EVENT_WORKFLOW_RUN_TITLE}" | grep -oE '^Hunter Reviewer Collector PR [0-9]+' | grep -oE '[0-9]+$' || true)"
          elif [[ "${event_name}" == "workflow_run" && "${EVENT_WORKFLOW_RUN_NAME}" == "Hunter / Issue Agent Reconcile" ]]; then
            # Issue #575: the resolver job has no `actions: write`. Its own workflow
            # run completion is the trusted wake-up, but only if the resolver job
            # succeeded and published PR identities after its durable knowledge
            # append. A failed, ambiguous or manually resolved thread yields no
            # identity here and remains on the bounded scheduled sweep.
            if [[ "${EVENT_WORKFLOW_RUN_CONCLUSION}" != "success" ]]; then
              echo "::notice::Skipping resolution wake-up: resolver workflow conclusion ${EVENT_WORKFLOW_RUN_CONCLUSION}."
              pr_numbers=""
            else
              jobs_json="$(mktemp)"
              artifacts_json="$(mktemp)"
              evidence_zip="$(mktemp)"
              artifact_id=""
              if ! gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${EVENT_WORKFLOW_RUN_ID}/attempts/${EVENT_WORKFLOW_RUN_ATTEMPT}/jobs?per_page=100" > "${jobs_json}"; then
                echo "::error::Cannot read resolver jobs for run ${EVENT_WORKFLOW_RUN_ID}; skipping wake-up."
                failures=1
              elif ! gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${EVENT_WORKFLOW_RUN_ID}/artifacts?per_page=100" > "${artifacts_json}"; then
                echo "::error::Cannot read resolver artifacts for run ${EVENT_WORKFLOW_RUN_ID}; skipping wake-up."
                failures=1
              else
                artifact_id="$(
                  jq -r --arg name "hunter-resolution-reconcile-${EVENT_WORKFLOW_RUN_ID}-${EVENT_WORKFLOW_RUN_ATTEMPT}" \
                    '[.artifacts[] | select(.name == $name and .expired == false) | .id] | if length == 1 then .[0] else empty end' \
                    "${artifacts_json}"
                )"
                if [[ -z "${artifact_id}" ]]; then
                  echo "::notice::No unique unexpired resolution artifact for this exact run and attempt; no wake-up."
                elif ! gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" > "${evidence_zip}"; then
                  echo "::error::Cannot download resolution artifact ${artifact_id}; skipping wake-up."
                  failures=1
                else
                  pr_numbers="$(
                    python scripts/hunter_resolution_reconcile_ingress.py \
                      --event "${GITHUB_EVENT_PATH}" \
                      --jobs "${jobs_json}" \
                      --artifacts "${artifacts_json}" \
                      --evidence-zip "${evidence_zip}" \
                      --repository "${GITHUB_REPOSITORY}" \
                      --event-name "${event_name}" \
                      --for-shell
                  )" || pr_numbers=""
                  if [[ -n "${pr_numbers}" ]]; then
                    resolution_marker="hunter-resolution-reconcile/${EVENT_WORKFLOW_RUN_ID}/${EVENT_WORKFLOW_RUN_ATTEMPT}"
                  fi
                fi
              fi
              rm -f "${jobs_json}" "${artifacts_json}" "${evidence_zip}"
            fi
          elif [[ "${event_name}" == "workflow_run" ]]; then
            pr_numbers="$(
              gh pr list \
                --repo "${GITHUB_REPOSITORY}" \
                --state open \
                --base main \
                --search "${EVENT_WORKFLOW_RUN_HEAD_SHA}" \
                --json number,headRefOid \
                --jq ".[] | select(.headRefOid == \"${EVENT_WORKFLOW_RUN_HEAD_SHA}\") | .number"
            )"
          else
            # Paginate the complete trusted open-PR set. The default gh pr
            # list limit silently skips later PRs during scheduled recovery.
            pr_numbers="$(
              gh api --paginate \
                "repos/${GITHUB_REPOSITORY}/pulls?state=open&base=main&per_page=100" \
                --jq '.[].number'
            )"
          fi

          while read -r pr_number; do
            [ -z "${pr_number}" ] && continue
            # Bind each invocation's failure marker to the live candidate HEAD
            # observed immediately before that invocation. Historical unbound
            # markers must never be attributed to a later pushed candidate.
            invocation_head=""
            if ! invocation_head="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${pr_number}" --jq '.head.sha')"; then
              echo "::error::Cannot fetch HEAD for PR #${pr_number}; continuing."
              failures=1
              continue
            fi
            if [[ ! "${invocation_head}" =~ ^[0-9a-f]{40}$ ]]; then
              echo "::error::Cannot bind reconcile invocation to PR #${pr_number} HEAD; continuing."
              failures=1
              continue
            fi
            if [[ -n "${resolution_marker}" ]]; then
              # One source run/attempt may reconcile a given exact head only once.
              # The global concurrency group serializes this check with marker
              # publication, so a duplicate event sees the existing marker.
              marker_count="$(
                gh api "repos/${GITHUB_REPOSITORY}/commits/${invocation_head}/statuses" \
                  --paginate \
                  --jq "[.[] | select(.context == \"${resolution_marker}\")] | length"
              )" || marker_count=""
              if [[ -z "${marker_count}" ]]; then
                echo "::error::Cannot read resolution reconcile marker for PR #${pr_number}; continuing."
                failures=1
                continue
              fi
              if [[ "${marker_count}" != "0" ]]; then
                echo "::notice::Duplicate resolution wake-up for PR #${pr_number}; already reconciled at ${invocation_head}."
                continue
              fi
              if ! gh api "repos/${GITHUB_REPOSITORY}/statuses/${invocation_head}" \
                -f state=pending \
                -f context="${resolution_marker}" \
                -f description="Resolution wake-up consumed at this exact HEAD" \
                > /dev/null; then
                echo "::error::Cannot record resolution reconcile marker for PR #${pr_number}; continuing."
                failures=1
                continue
              fi
              # Re-read the trusted PR after writing the marker. A push between
              # the two reads makes this invocation stale; the new head keeps its
              # own scheduled/event-driven path and is never refreshed here.
              recheck_head="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${pr_number}" --jq '.head.sha')" || recheck_head=""
              if [[ "${recheck_head}" != "${invocation_head}" ]]; then
                echo "::warning::Reconcile HEAD race after marker for PR #${pr_number}; suppressing invocation outcome markers."
                failures=1
                continue
              fi
            fi
            # Legacy invariant marker: if ! python scripts/hunter_governance_review_v2.py
            B=boot
            BRIDGE="scripts/hunter_governance_review/${B}strap_external_review_469.py"
            refresh_rc=0
            python "${BRIDGE}" governance \
              --pr "${pr_number}" \
              --repository "${GITHUB_REPOSITORY}" \
              --expected-head "${invocation_head}" || refresh_rc=$?
            if [ "${refresh_rc}" -eq 5 ]; then
              echo "::warning::Reconcile HEAD race for PR #${pr_number}; suppressing invocation outcome markers."
              failures=1
              continue
            elif [ "${refresh_rc}" -ne 0 ]; then
              echo "::error::Governance refresh failed for PR #${pr_number} at ${invocation_head}; continuing."
              failures=1
            fi
            # Bootstrap detection: until hunter_review_orchestrator.py exists on the
            # trusted default branch, there is no trusted orchestrator to run. Never
            # run a candidate copy in its place, and do not fail the refresh merely
            # because the trusted orchestrator is not available yet; the governance
            # step above still owns exact-head review authority.
            orchestration_rc=0
            if [ ! -f scripts/hunter_review_orchestrator.py ]; then
              echo "::notice::Bootstrap phase: hunter_review_orchestrator.py not yet on default branch; skipping orchestration for PR #${pr_number}."
            else
              # Exit 3 is a blocked exact-head review prerequisite, not a
              # process failure. It must remain visible and must NEVER imply
              # review completion or Ready; candidate admission owns that gate.
              orchestration_rc=0
              python scripts/hunter_review_orchestrator.py ensure \
                --pr "${pr_number}" \
                --repository "${GITHUB_REPOSITORY}" \
                --expected-head "${invocation_head}" || orchestration_rc=$?
              if [ "${orchestration_rc}" -eq 5 ]; then
                echo "::warning::Reconcile HEAD race for PR #${pr_number}; suppressing invocation outcome markers."
                failures=1
                continue
              elif [ "${orchestration_rc}" -eq 3 ]; then
                echo "::warning::WAITING_FOR_EXACT_HEAD_REVIEW for PR #${pr_number}; commit a valid exact-head request before review dispatch."
              elif [ "${orchestration_rc}" -eq 4 ]; then
                echo "::warning::Review orchestration infrastructure pending for PR #${pr_number} at ${invocation_head}; no completion marker."
              elif [ "${orchestration_rc}" -ne 0 ]; then
                echo "::error::Review orchestration failed for PR #${pr_number} at ${invocation_head}; continuing."
                failures=1
              fi
            fi
            if [ "${refresh_rc}" -eq 0 ] && [ "${orchestration_rc}" -eq 0 ] && [ -f scripts/hunter_review_orchestrator.py ]; then
              echo "::notice::Reconcile invocation completed for PR #${pr_number} at ${invocation_head}; continuing."
            fi
          done <<< "${pr_numbers}"

          exit "${failures}"
