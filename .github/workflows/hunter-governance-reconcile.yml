name: Hunter Governance Review Reconcile

# Current-state sanity refresh for open PRs. No metadata history is
# reconstructed and no PR prose is evaluated. Exact-head branch preflight
# completion triggers an immediate refresh so API-written heads cannot remain
# admitted on stale governance state.
#
# This workflow also owns privileged reviewer orchestration (`actions: write`).
# It has no `pull_request` trigger, so GitHub always runs the trusted
# default-branch version of this file: a candidate cannot reach this permission
# by editing a workflow on its own branch.
#
# Issue #534: Draft -> Ready for Review is a lifecycle transition that
# `Hunter / Merge Readiness` reacts to immediately (it listens for
# `ready_for_review`), but until this trigger existed, reconciliation here
# only happened on the next push/review/workflow_run event or the 30-minute
# schedule -- readiness could wake and report a missing orchestration cycle
# before one had a chance to exist. `pull_request_target` is deliberately
# used instead of `pull_request`: GitHub resolves a `pull_request_target`
# workflow from the base branch's copy of the file, so this stays on the same
# trusted-default-branch execution path as every other trigger above, and a
# candidate branch cannot grant itself `actions: write` by editing this file.
#
# Issue #534 recurrence, same defect, new event variant: `synchronize` is the
# other transition `Hunter / Merge Readiness` reacts to immediately, and it is
# the one that changes a PR's exact HEAD. Observing live on PR #535 at exact
# HEAD 51108333821ab42d1ab7aa0b812a72d890f73795: a push at 07:40:33Z woke
# Merge Readiness, Trusted Preflight Upgrade and Governance Agent Preflight,
# but this workflow had no direct `synchronize` trigger, so no trusted
# event-driven path created the exact-head orchestration prerequisite for the
# new HEAD. The only paths left were the `workflow_run` reconciliations that
# depend on a *different* workflow completing first, and the 30-minute
# schedule -- recovery fallbacks, not a primary mechanism, and Merge Readiness
# had already correctly published MALFORMED_REVIEW: WAITING_FOR_REVIEWER.
#
# `synchronize` is the exact-HEAD-changing variant of the same wiring
# asymmetry, so it belongs in the same trusted trigger. Draft PRs also fire
# `synchronize` (unlike `ready_for_review`, which fires only on leaving Draft);
# that is safe because the Draft short-circuit lives in the trusted orchestrator
# itself (`hunter_review_orchestrator.ensure_current`), which returns before
# any review-request lookup or dispatch. Exact-head binding is unaffected: the
# step passes only `--pr`, and the orchestrator re-derives the current HEAD from
# trusted GitHub state rather than from this event's payload.

on:
  # repository_dispatch runs the default-branch workflow definition, unlike
  # workflow_dispatch with a caller-selected candidate ref. API-authenticated
  # owner/operator recovery does not execute candidate-authored workflow code.
  repository_dispatch:
    types:
      - hunter-trusted-recovery
  push:
    branches:
      - main
  workflow_run:
    workflows:
      - Hunter / Pre-PR Preflight
      - Hunter / Trusted Preflight Upgrade
      - Hunter Governance Review
      - Hunter Reviewer Collector
    types:
      - completed
  # Bot-authored review events are approval-held by GitHub. The trusted
  # 5-minute sweep is the bounded review-state-change reconciliation path,
  # including human submitted/edited/dismissed reviews and inline comments;
  # no review webhook may run a privileged workflow directly. Trusted
  # pull_request_target and workflow_run remain event-driven for head changes.
  pull_request_target:
    branches:
      - main
    types:
      - ready_for_review
      - synchronize
  schedule:
    - cron: "*/5 * * * *"

permissions:
  actions: write
  checks: read
  contents: write # Required to issue trusted repository_dispatch from default branch
  pull-requests: read
  statuses: write

concurrency:
  group: hunter-governance-reconcile
  cancel-in-progress: false

jobs:
  reconcile:
    name: Reconcile open pull requests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout trusted gate engine
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Publish trusted collector completion
        if: github.event_name == 'schedule' || github.event_name == 'repository_dispatch' || (github.event_name == 'workflow_run' && github.event.workflow_run.name == 'Hunter Reviewer Collector' && github.event.workflow_run.conclusion == 'success')
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          COLLECTOR_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          # Bound collector recovery I/O so the mandatory governance refresh
          # is never held behind an unbounded run-history enumeration.
          if [[ "${{ github.event_name }}" == "schedule" || "${{ github.event_name }}" == "repository_dispatch" ]]; then
            # Bounded network scan: never enumerate all retained run history
            # before the mandatory governance refresh. Rotate the starting
            # page across sweeps so old valid runs cannot starve forever.
            recovery_deadline=$((SECONDS + 90))
            page=1 # Always examine the populated first page; avoid empty-page starvation
            candidates=()
            scanned_pages=0
            while (( SECONDS < recovery_deadline && scanned_pages < 3 )); do
              batch="$(timeout 12s gh api "repos/$GITHUB_REPOSITORY/actions/workflows/hunter-reviewer-collector.yml/runs?status=completed&per_page=100&page=$page" --jq '.workflow_runs[] | select(.conclusion == "success") | [.id, .display_title] | @tsv' 2>/dev/null)" || break
              [[ -n "$batch" ]] || break
              while IFS= read -r line; do
                [[ -n "$line" ]] && candidates+=("$line")
              done <<< "$batch"
              ((scanned_pages+=1))
              ((page+=1))
              ((page<=100)) || page=1
            done
          else
            candidates=("$COLLECTOR_RUN_ID")
          fi
          # Reserve time for the mandatory governance refresh. Recovery is
          # opportunistic; each schedule retries the remaining candidates.
          recovery_deadline=${recovery_deadline:-$((SECONDS + 90))}
          recovered=0
          for candidate in "${candidates[@]}"; do
            if [[ "${{ github.event_name }}" == "schedule" || "${{ github.event_name }}" == "repository_dispatch" ]]; then
              (( SECONDS < recovery_deadline && recovered < 5 )) || break
            fi
            run_id="${candidate%%$'\t'*}"
            [[ "$run_id" =~ ^[0-9]+$ ]] || continue
            if [[ "${{ github.event_name }}" == "schedule" || "${{ github.event_name }}" == "repository_dispatch" ]]; then
              title="${candidate#*$'\t'}"
              if [[ "$title" =~ ^Hunter\ Reviewer\ Collector\ PR\ ([1-9][0-9]*)\ HEAD\ ([0-9a-f]{40})(\ GEN\ .*)?$ ]]; then
                pr="${BASH_REMATCH[1]}"
                head="${BASH_REMATCH[2]}"
              else
                continue
              fi
              # Only active current-head PRs may consume recovery budget.
              current="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$pr" --jq '[.state, .head.sha] | @tsv' 2>/dev/null)" || continue
              [[ "$current" == $'open\t'"$head" ]] || continue
              # Never skip proof/receipt validation based on a public commit
              # status: a prior status writer may have forged this context.
            fi
            attempt="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id" --jq '.run_attempt' 2>/dev/null)" || continue
            [[ "$attempt" =~ ^[1-9][0-9]*$ ]] || continue
            receipt="$RUNNER_TEMP/collector-receipt"
            rm -rf "$receipt"
            mkdir -p "$receipt/results" "$receipt/proof"
            # A single matched artifact is extracted directly under --dir.
            gh run download "$run_id" --repo "$GITHUB_REPOSITORY" \
              --pattern "hunter-reviewer-results-*-${attempt}" \
              --dir "$receipt/results" >/dev/null 2>&1 || continue
            gh run download "$run_id" --repo "$GITHUB_REPOSITORY" \
              --pattern "hunter-dispatch-proof-*-${attempt}" \
              --dir "$receipt/proof" >/dev/null 2>&1 || continue
            [[ "$(find "$receipt/results" -type f | wc -l | tr -d ' ')" == 1 ]] || continue
            [[ "$(find "$receipt/proof" -type f | wc -l | tr -d ' ')" == 1 ]] || continue
            [[ -f "$receipt/results/reviewer-results.json" && -f "$receipt/proof/collector-dispatch-proof.txt" ]] || continue
            mv "$receipt/results/reviewer-results.json" "$receipt/reviewer-results.json"
            mv "$receipt/proof/collector-dispatch-proof.txt" "$receipt/collector-dispatch-proof.txt"
            ((recovered+=1))
            python scripts/hunter_review_orchestrator.py trusted-collector-complete \
              --repository "$GITHUB_REPOSITORY" --run-id "$run_id" || \
              echo "Collector completion unavailable for run $run_id; continue"
          done

      - name: Refresh lightweight governance status
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          EVENT_WORKFLOW_RUN_NAME: ${{ github.event.workflow_run.name }}
          EVENT_WORKFLOW_RUN_TITLE: ${{ github.event.workflow_run.display_title }}
          EVENT_WORKFLOW_RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          EVENT_WORKFLOW_RUN_PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
        run: |
          set -euo pipefail
          # Event-driven reconciliation is deliberately scoped to the PR that
          # caused the event. Sweeping every open PR for each review/check event
          # multiplies API traffic and can exhaust the installation rate limit.
          # Scheduled recovery remains the bounded full-sweep path.
          event_name="${{ github.event_name }}"
          if [[ "${event_name}" == "pull_request_target" ]]; then
            pr_numbers="${{ github.event.pull_request.number }}"
          elif [[ "${event_name}" == "workflow_run" && "${EVENT_WORKFLOW_RUN_NAME}" == "Hunter Governance Review" ]]; then
            # A PR synchronize event runs the read-only governance workflow first.
            # Its workflow_run association carries the triggering PR number, while
            # this trusted default-branch workflow owns actions:write and may
            # safely hand pending exact-head review state to the orchestrator.
            pr_numbers="${EVENT_WORKFLOW_RUN_PR_NUMBER}"
          elif [[ "${event_name}" == "workflow_run" && "${EVENT_WORKFLOW_RUN_NAME}" == "Hunter Reviewer Collector" ]]; then
            # The collector always runs from the trusted default branch, so its
            # own workflow_run.head_sha is main's SHA, never the candidate's --
            # searching open PRs by that SHA would find none and silently skip
            # reconciling the PR this collector was actually dispatched for.
            # The candidate PR is instead the one already-trusted identity this
            # run itself carries: its own run-name, rendered by the collector
            # workflow from the exact inputs it was dispatched with (never from
            # this event, which cannot express them). A malformed or absent
            # title yields no PR number, which the loop below already skips.
            pr_numbers="$(printf '%s' "${EVENT_WORKFLOW_RUN_TITLE}" | grep -oE '^Hunter Reviewer Collector PR [0-9]+' | grep -oE '[0-9]+$' || true)"
          elif [[ "${event_name}" == "workflow_run" ]]; then
            pr_numbers="$(
              gh pr list \
                --repo "${GITHUB_REPOSITORY}" \
                --state open \
                --base main \
                --search "${EVENT_WORKFLOW_RUN_HEAD_SHA}" \
                --json number,headRefOid \
                --jq ".[] | select(.headRefOid == \"${EVENT_WORKFLOW_RUN_HEAD_SHA}\") | .number"
            )"
          else
            # Paginate the complete trusted open-PR set. The default gh pr
            # list limit silently skips later PRs during scheduled recovery.
            pr_numbers="$(
              gh api --paginate \
                "repos/${GITHUB_REPOSITORY}/pulls?state=open&base=main&per_page=100" \
                --jq '.[].number'
            )"
          fi

          failures=0
          while read -r pr_number; do
            [ -z "${pr_number}" ] && continue
            # Legacy invariant marker: if ! python scripts/hunter_governance_review_v2.py
            B=boot
            BRIDGE="scripts/hunter_governance_review/${B}strap_external_review_469.py"
            if ! python "${BRIDGE}" governance \
              --pr "${pr_number}" \
              --repository "${GITHUB_REPOSITORY}"; then
              echo "::error::Governance refresh failed for PR #${pr_number}; continuing."
              failures=1
            fi
            # Bootstrap detection: until hunter_review_orchestrator.py exists on the
            # trusted default branch, there is no trusted orchestrator to run. Never
            # run a candidate copy in its place, and do not fail the refresh merely
            # because the trusted orchestrator is not available yet; the governance
            # step above still owns exact-head review authority.
            if [ ! -f scripts/hunter_review_orchestrator.py ]; then
              echo "::notice::Bootstrap phase: hunter_review_orchestrator.py not yet on default branch; skipping orchestration for PR #${pr_number}."
            elif ! python scripts/hunter_review_orchestrator.py ensure \
              --pr "${pr_number}" \
              --repository "${GITHUB_REPOSITORY}"; then
              echo "::error::Review orchestration failed for PR #${pr_number}; continuing."
              failures=1
            fi
          done <<< "${pr_numbers}"

          exit "${failures}"
