name: Temporary Source Handling Finalize

on:
  push:
    branches:
      - ava/source-handling-tests-first

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ava/source-handling-tests-first
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.13'
      - name: Install project
        run: python -m pip install -c requirements/ci-constraints.txt -e '.[dev]'
      - name: Apply typed fixture correction
        shell: bash
        run: python -c 'from pathlib import Path; p=Path("tests/test_source_handling_authority_enforcement.py"); s=p.read_text(encoding="utf-8"); old="                \"fact\": {\n                    **authorized_payload[\"fact\"],\n                    \"sensitivity\": \"INTERNAL\",\n                },\n"; new="                \"fact\": {\n                    \"sensitivity\": \"INTERNAL\",\n                    \"operation_restrictions\": [],\n                    \"persistence_restriction\": \"FULL_CONTENT_ALLOWED\",\n                    \"secret_presence\": [],\n                    \"operation_restrictions_known\": True,\n                    \"secret_presence_known\": True,\n                    \"withdrawn\": False,\n                    \"deleted_at_source\": False,\n                    \"historically_unavailable\": False,\n                    \"availability_known\": True,\n                },\n"; assert old in s or new in s; p.write_text(s.replace(old,new,1),encoding="utf-8") if old in s else None'
      - name: Canonicalize changed Python
        run: |
          ruff check --fix src/hunter/evidence_intelligence/source_handling.py tests/source_handling_runtime_harness.py tests/test_source_handling_authority_contract.py tests/test_source_handling_authority_enforcement.py
          black src/hunter/evidence_intelligence/source_handling.py tests/source_handling_runtime_harness.py tests/test_source_handling_authority_contract.py tests/test_source_handling_authority_enforcement.py
      - name: Full deterministic preflight
        run: python scripts/hunter_pr_preflight.py
      - name: Commit clean result and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/tmp-source-handling-finalize.yml
          git add src/hunter/evidence_intelligence/source_handling.py tests/source_handling_runtime_harness.py tests/test_source_handling_authority_contract.py tests/test_source_handling_authority_enforcement.py
          git commit -m "fix: finalize source handling authority corrections [source-handling-finalized]"
          git push origin HEAD:ava/source-handling-tests-first
