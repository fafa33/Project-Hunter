name: Temporary Source Handling Finalize

on:
  push:
    branches:
      - ava/source-handling-tests-first

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ava/source-handling-tests-first
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.13'
      - name: Install project
        run: python -m pip install -c requirements/ci-constraints.txt -e '.[dev]'
      - name: Apply exact typed fixture correction
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/test_source_handling_authority_enforcement.py')
          text = path.read_text(encoding='utf-8')
          old = '''                "fact": {
                    **authorized_payload["fact"],
                    "sensitivity": "INTERNAL",
                },
'''
          new = '''                "fact": {
                    "sensitivity": "INTERNAL",
                    "operation_restrictions": [],
                    "persistence_restriction": "FULL_CONTENT_ALLOWED",
                    "secret_presence": [],
                    "operation_restrictions_known": True,
                    "secret_presence_known": True,
                    "withdrawn": False,
                    "deleted_at_source": False,
                    "historically_unavailable": False,
                    "availability_known": True,
                },
'''
          if old not in text and new not in text:
              raise SystemExit('typed fixture anchor missing')
          if old in text:
              path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Canonicalize changed test
        run: |
          ruff check --fix tests/test_source_handling_authority_enforcement.py
          black tests/test_source_handling_authority_enforcement.py
      - name: Remove temporary workflow before preflight
        run: git rm .github/workflows/tmp-source-handling-finalize.yml
      - name: Full deterministic preflight
        run: python scripts/hunter_pr_preflight.py
      - name: Commit clean result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_source_handling_authority_enforcement.py
          git commit -m "fix: finalize source handling authority corrections"
          git push origin HEAD:ava/source-handling-tests-first
