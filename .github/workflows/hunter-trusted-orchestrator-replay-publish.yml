name: Hunter / Trusted Orchestrator Replay Publish

# Trusted candidate orchestrator replay harness (Issue #534 follow-on) --
# privileged half. See hunter-trusted-orchestrator-replay-validate.yml for
# the candidate-touching half.
#
# This workflow is triggered by `workflow_run`, which GitHub always resolves
# and runs from the BASE repository's own copy of this file, on the default
# branch, regardless of what triggered the upstream run or what that PR
# branch's own copy of any workflow file says. It never checks out candidate
# content, never imports a candidate module, and never executes candidate
# code or a candidate-controlled path as a command: it only downloads the two
# small JSON artifacts the validate workflow produced, independently
# re-derives every trusted quantity itself (never trusting either artifact's
# own account of what it did), and publishes one exact-head, PR-bound status.
#
# This structural split -- rather than one pull_request_target-triggered
# workflow with per-job permission scoping -- is what makes "no untrusted
# code ever executes in a job holding write credentials, secrets, or a
# mutation-capable token" true by construction and not just by careful
# permissions bookkeeping within a single trigger: the only job that ever
# touches candidate content (in the separate validate workflow) never runs
# under a trigger that grants secrets or a privileged token in the first
# place, and this job -- the only one with statuses:write -- never checks out
# or reads candidate content at all.
#
# A green "Hunter Trusted Orchestrator Replay" status proves the candidate's
# controller-logic modules satisfy fixed, deterministic, offline invariants
# against fixed fixtures. It does NOT prove real GitHub propagation delay,
# real reviewer-provider latency, real webhook timing, or real provider
# availability -- those remain live, post-merge canary evidence. See
# scripts/hunter_trusted_orchestrator_replay.py for the full evidence boundary.

on:
  workflow_run:
    workflows: ["Hunter / Trusted Orchestrator Replay Validate"]
    types:
      - completed

jobs:
  publish-proof:
    name: Publish Exact-Head Trusted Replay Proof
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Never checks out candidate content and never runs any candidate script
    # or candidate-controlled path as a command -- only trusted controller
    # code and two small trusted-produced JSON artifacts, downloaded by
    # fixed name from the exact triggering run id.
    permissions:
      contents: read
      actions: read
      statuses: write

    steps:
      - name: Resolve exact-head PR context from the triggering run
        id: context
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          pr_number="$(gh api "repos/${GH_REPO}/actions/runs/${RUN_ID}" --jq '.pull_requests[0].number // empty')"
          if [ -z "$pr_number" ]; then
            echo "no associated pull request found for triggering run ${RUN_ID}" >&2
            exit 1
          fi
          echo "pr_number=$pr_number" >> "$GITHUB_OUTPUT"

      - name: Checkout trusted controller
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11.13"

      - name: Download replay receipt
        if: ${{ github.event.workflow_run.conclusion == 'success' }}
        uses: actions/download-artifact@v4
        with:
          name: replay-receipt
          path: .
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}
        continue-on-error: true

      - name: Download digest verification result
        if: ${{ always() }}
        uses: actions/download-artifact@v4
        with:
          name: digest-check
          path: .
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}
        continue-on-error: true

      - name: Independently validate the trusted replay receipt
        id: validate_receipt
        env:
          GITHUB_TOKEN: ""
          GH_TOKEN: ""
          WORKFLOW_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          PR_NUMBER: ${{ steps.context.outputs.pr_number }}
          CANDIDATE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          if [ "$WORKFLOW_CONCLUSION" != "success" ] || \
             [ ! -f replay-receipt.json ] || [ ! -f digest-check.json ]; then
            echo "validate workflow did not produce complete evidence; treating replay as failed" >&2
            echo "result=failure" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if python scripts/hunter_trusted_orchestrator_replay.py validate \
            --workspace-root "$GITHUB_WORKSPACE" \
            --receipt replay-receipt.json \
            --digest-check digest-check.json \
            --pr "$PR_NUMBER" \
            --candidate-sha "$CANDIDATE_SHA"; then
            echo "result=success" >> "$GITHUB_OUTPUT"
          else
            echo "result=failure" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish exact-head PR-bound status
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          PR_NUMBER: ${{ steps.context.outputs.pr_number }}
          VALIDATION_RESULT: ${{ steps.validate_receipt.outputs.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import urllib.request

          result = os.environ["VALIDATION_RESULT"]
          state = "success" if result == "success" else "failure"
          payload = json.dumps(
              {
                  "state": state,
                  "context": f"Hunter Trusted Orchestrator Replay / PR #{os.environ['PR_NUMBER']}",
                  "description": f"Trusted candidate controller replay {state} ({result})",
                  "target_url": os.environ["RUN_URL"],
              }
          ).encode("utf-8")
          request = urllib.request.Request(
              f"https://api.github.com/repos/{os.environ['GH_REPO']}/statuses/{os.environ['HEAD_SHA']}",
              data=payload,
              method="POST",
              headers={
                  "Authorization": f"Bearer {os.environ['GITHUB_TOKEN']}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "Content-Type": "application/json",
              },
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              if response.status != 201:
                  raise RuntimeError(f"status publication returned HTTP {response.status}")
          PY
