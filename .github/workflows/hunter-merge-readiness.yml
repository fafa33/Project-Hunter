name: Hunter / Merge Readiness

# Current-state merge gate. Only real merge risk blocks:
# - Draft state or unresolved mergeability/conflicts
# - unresolved inline review threads
# - current CHANGES_REQUESTED reviews
# - failed or incomplete exact-head code/security checks
# - failed lightweight Hunter Governance Review
#
# PR prose, branch naming, Issue identity, top-level comments, reactions, and
# metadata-only edits are not merge authority.

on:
  pull_request_target:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
      - converted_to_draft
  pull_request_review:
    types:
      - submitted
      - edited
      - dismissed
  pull_request_review_comment:
    types:
      - created
      - edited
      - deleted
  workflow_run:
    workflows:
      - CI
      - Dependency review
      - Hunter Governance Review
    types:
      - completed
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Pull request number to reconcile"
        required: true
        type: number

permissions:
  checks: read
  contents: read
  pull-requests: read
  statuses: write

concurrency:
  group: >-
    hunter-merge-readiness-${{
      github.event.pull_request.number
      || github.event.workflow_run.pull_requests[0].number
      || github.event.inputs.pr_number
      || (github.event_name == 'schedule' && 'sweep')
      || github.run_id
    }}
  cancel-in-progress: false

jobs:
  controller:
    name: Hunter Merge Readiness Controller
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout trusted controller
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Publish current-state merge readiness
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python scripts/hunter_merge_readiness_v2.py
