name: Hunter Merge Readiness Controller

# Publishes the single user-facing `Hunter Merge Readiness` commit status.
#
# Merge means merge: no stale governance result and no unresolved feedback may
# coexist with a green readiness status.
#
# Feedback contract:
# - every unresolved inline review thread blocks;
# - every current CHANGES_REQUESTED review blocks;
# - every top-level PR Conversation comment blocks until the repository owner
#   acknowledges that exact current comment with a 👍 reaction;
# - editing a previously acknowledged comment invalidates that acknowledgement
#   until the owner removes/re-applies 👍 after the edit;
# - bots, informational comments, dependency reports, and owner-authored comments
#   receive no exemption.
#
# workflow_dispatch lets an operator force an immediate, full reconciliation for a
# single PR (the same check-runs-based evaluation the periodic schedule performs),
# instead of waiting on the schedule's real-world cadence or re-running a webhook-
# triggered run that only performs the lightweight invalidate-and-wait shortcut.

on:
  pull_request_target:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
      - edited
      - ready_for_review
      - converted_to_draft
      - review_requested
      - review_request_removed
  pull_request_review:
    types:
      - submitted
      - edited
      - dismissed
  pull_request_review_comment:
    types:
      - created
      - edited
      - deleted
  issue_comment:
    types:
      - created
      - edited
      - deleted
  workflow_run:
    workflows:
      - Hunter Governance Review
    types:
      - completed
  # GitHub Actions has no reaction event. Polling makes owner 👍 acknowledgements
  # observable without requiring a dummy PR edit/comment to wake the gate.
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Pull request number to force a full reconciliation for"
        required: true
        type: number

permissions:
  actions: read
  checks: read
  contents: read
  issues: read
  pull-requests: read
  statuses: write

concurrency:
  group: hunter-merge-readiness-${{ github.event.pull_request.number || github.event.issue.number || github.event.workflow_run.pull_requests[0].number || github.event.inputs.pr_number || github.run_id }}
  cancel-in-progress: true

jobs:
  controller:
    name: Hunter Merge Readiness Controller
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # Always run the canonical controller from the trusted default branch, never
      # from the ref that happened to trigger this run. This matters most for
      # workflow_dispatch: an operator can dispatch from any branch that carries
      # this workflow file, and an unpinned checkout would execute that branch's
      # version of hunter_merge_readiness.py with statuses: write permission.
      - name: Checkout trusted controller (default branch)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Publish deterministic merge-readiness state
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python scripts/hunter_merge_readiness.py
