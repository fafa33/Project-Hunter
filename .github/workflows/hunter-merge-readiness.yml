name: Hunter Merge Readiness Controller

# Publishes the single user-facing `Hunter Merge Readiness` commit status.
#
# State model:
# - pending: PR is Draft or the current Governance Review / exact-head checks are still running.
# - failure: PR is Ready for Review but metadata or a real prerequisite failed.
# - success: PR is Ready for Review and every exact-head prerequisite passed.
#
# Freshness model:
# - every PR lifecycle event first invalidates any previous green signal;
# - final evaluation is driven by completion of the current Hunter Governance Review run;
# - a Governance Review completion is accepted only for the PR head it evaluated;
# - the authoritative governance commit status must have been created after that run started.
#
# Security model:
# - pull_request_target/workflow_run execute only trusted default-branch workflow code.
# - no PR code is checked out or executed.
# - PR metadata and changed-file names are untrusted data.
# - Hunter Governance Review commit status remains the governance authority.

on:
  pull_request_target:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
      - edited
      - ready_for_review
      - converted_to_draft
      - review_requested
      - review_request_removed
  workflow_run:
    workflows:
      - Hunter Governance Review
    types:
      - completed

permissions:
  actions: read
  checks: read
  contents: read
  pull-requests: read
  statuses: write

concurrency:
  group: hunter-merge-readiness-${{ github.event.pull_request.number || github.event.workflow_run.pull_requests[0].number || github.run_id }}
  cancel-in-progress: true

jobs:
  controller:
    name: Hunter Merge Readiness Controller
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Publish deterministic merge-readiness state
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import time
          import urllib.request
          from datetime import datetime, timezone

          repo = os.environ["GH_REPO"]
          token = os.environ["GH_TOKEN"]
          event_name = os.environ["EVENT_NAME"]
          run_url = os.environ["RUN_URL"]
          context = "Hunter Merge Readiness"
          governance_context = "Hunter Governance Review"

          required_checks = (
              "Quality Gates",
              "dependency-review",
              "CodeQL",
          )
          hard_failures = {
              "failure",
              "timed_out",
              "action_required",
              "startup_failure",
          }

          with open(os.environ["GITHUB_EVENT_PATH"], encoding="utf-8") as handle:
              event = json.load(handle)

          def request_json(method, path, payload=None):
              data = None if payload is None else json.dumps(payload).encode("utf-8")
              request = urllib.request.Request(
                  f"https://api.github.com/repos/{repo}/{path}",
                  data=data,
                  method=method,
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": f"Bearer {token}",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "Content-Type": "application/json",
                  },
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.load(response)

          def parse_time(value):
              if not value:
                  return None
              return datetime.fromisoformat(value.replace("Z", "+00:00")).astimezone(timezone.utc)

          trigger_head_sha = None
          governance_run_started_at = None
          governance_run_conclusion = None

          if event_name == "workflow_run":
              workflow_run = event.get("workflow_run") or {}
              pulls = workflow_run.get("pull_requests") or []
              if not pulls:
                  print("Governance workflow completion is not attached to a pull request; skipping.")
                  raise SystemExit(0)
              pr_number = str(pulls[0]["number"])
              trigger_head_sha = ((pulls[0].get("head") or {}).get("sha") or "").strip()
              if not trigger_head_sha:
                  print("Governance workflow completion has no PR head SHA; leaving current readiness state unchanged.")
                  raise SystemExit(0)
              governance_run_started_at = parse_time(workflow_run.get("run_started_at"))
              governance_run_conclusion = workflow_run.get("conclusion")
          else:
              pull_request = event.get("pull_request") or {}
              pr_number = str(pull_request.get("number") or "")
              if not pr_number:
                  print("Pull request event has no PR number; skipping.")
                  raise SystemExit(0)

          pr = request_json("GET", f"pulls/{pr_number}")
          if pr.get("state") != "open":
              print(f"PR #{pr_number} is no longer open; skipping.")
              raise SystemExit(0)

          body = pr.get("body") or ""
          draft = bool(pr.get("draft"))
          author = ((pr.get("user") or {}).get("login") or "")
          sha = ((pr.get("head") or {}).get("sha") or "").strip()
          if not sha:
              raise RuntimeError("Current PR head SHA is unavailable")

          def publish(state, description):
              description = description[:140]
              request_json(
                  "POST",
                  f"statuses/{sha}",
                  {
                      "state": state,
                      "context": context,
                      "description": description,
                      "target_url": run_url,
                  },
              )
              print(f"{context}: {state} — {description}")

          def dependency_only_pr():
              if author not in {"dependabot[bot]", "renovate[bot]"}:
                  return False
              files = []
              page = 1
              while True:
                  batch = request_json(
                      "GET", f"pulls/{pr_number}/files?per_page=100&page={page}"
                  )
                  files.extend(item["filename"] for item in batch)
                  if len(batch) < 100:
                      break
                  page += 1
              if not files:
                  return False
              allowed_root = {
                  "pyproject.toml",
                  "poetry.lock",
                  "package-lock.json",
                  "pnpm-lock.yaml",
              }
              return all(
                  filename.startswith("requirements/") or filename in allowed_root
                  for filename in files
              )

          def validate_metadata():
              if dependency_only_pr():
                  return None

              rows = []
              in_table = False
              for line in body.splitlines():
                  stripped = line.strip()
                  if stripped.startswith("|") and "Acceptance criterion" in stripped:
                      in_table = True
                      continue
                  if not stripped.startswith("|"):
                      in_table = False
                      continue
                  if not in_table:
                      continue
                  cells = [cell.strip() for cell in stripped.strip("|").split("|")]
                  if len(cells) < 2:
                      continue
                  status = cells[1].lower()
                  if status in {"pass", "fail", "blocked", "not applicable"}:
                      rows.append((cells[0], status))

              if not rows:
                  return "Acceptance-criteria matrix is missing or unparseable."

              unresolved = [name for name, status in rows if status in {"fail", "blocked"}]
              if unresolved:
                  return "FAIL/BLOCKED acceptance criteria remain: " + ", ".join(unresolved)

              checked = []
              allowed = ("ready for review", "changes required", "blocked")
              for match in re.finditer(r"(?im)^\s*[-*+]\s*\[([ xX])\]\s*(.+)", body):
                  marker, text = match.group(1), match.group(2).strip().lower()
                  if marker.lower() != "x":
                      continue
                  normalized = text.replace("`", "").replace("*", "")
                  for declaration in allowed:
                      if normalized.startswith(declaration):
                          checked.append(declaration)
                          break

              if len(checked) != 1:
                  return "Exactly one implementer readiness declaration must be checked."
              if checked[0] != "ready for review":
                  return f"Implementer readiness is {checked[0].upper()}, not READY FOR REVIEW."
              return None

          def all_check_runs():
              runs = []
              page = 1
              while True:
                  payload = request_json(
                      "GET", f"commits/{sha}/check-runs?per_page=100&page={page}&filter=all"
                  )
                  batch = payload["check_runs"]
                  runs.extend(batch)
                  if len(batch) < 100:
                      break
                  page += 1
              return runs

          def latest_commit_status(status_context):
              statuses = []
              page = 1
              while True:
                  batch = request_json(
                      "GET", f"commits/{sha}/statuses?per_page=100&page={page}"
                  )
                  statuses.extend(
                      status
                      for status in batch
                      if status.get("context") == status_context
                  )
                  if len(batch) < 100:
                      break
                  page += 1
              if not statuses:
                  return None
              return max(statuses, key=lambda status: int(status.get("id", 0)))

          try:
              if event_name == "workflow_run" and trigger_head_sha != sha:
                  print(
                      f"Ignoring stale Governance Review completion for {trigger_head_sha}; "
                      f"PR #{pr_number} is now at {sha}."
                  )
                  raise SystemExit(0)

              # Every PR lifecycle event immediately invalidates any previous green signal.
              if draft:
                  publish("pending", "Waiting for Ready for Review (PR is Draft).")
                  raise SystemExit(0)

              publish("pending", "Validating current governance and exact-head checks.")

              metadata_error = validate_metadata()
              if metadata_error:
                  publish("failure", metadata_error)
                  raise SystemExit(0)

              # A PR event must never consume a terminal governance status left by an
              # earlier evaluation of the same SHA. Final evaluation happens only after
              # the Governance Review workflow for this lifecycle event completes.
              if event_name != "workflow_run":
                  publish("pending", "Waiting for current Hunter Governance Review.")
                  raise SystemExit(0)

              if governance_run_conclusion != "success":
                  publish(
                      "failure",
                      f"Current Hunter Governance Review workflow ended {governance_run_conclusion or 'without a conclusion'}.",
                  )
                  raise SystemExit(0)

              if governance_run_started_at is None:
                  publish("failure", "Current Governance Review run has no trustworthy start time.")
                  raise SystemExit(0)

              attempts = 45
              for attempt in range(1, attempts + 1):
                  latest = {}
                  for run in all_check_runs():
                      name = run.get("name")
                      if name not in required_checks:
                          continue
                      previous = latest.get(name)
                      if previous is None or int(run.get("id", 0)) > int(previous.get("id", 0)):
                          latest[name] = run

                  missing = []
                  pending = []
                  failed = []
                  succeeded = []

                  for name in required_checks:
                      run = latest.get(name)
                      if run is None:
                          missing.append(name)
                          continue
                      status = run.get("status")
                      conclusion = run.get("conclusion")
                      if status != "completed":
                          pending.append(name)
                      elif conclusion == "success":
                          succeeded.append(name)
                      elif conclusion in hard_failures:
                          failed.append(f"{name}={conclusion}")
                      else:
                          # Cancelled/skipped/stale/neutral can be transient around
                          # lifecycle edits. Wait for a newer exact-head run.
                          pending.append(name)

                  governance = latest_commit_status(governance_context)
                  governance_success = False
                  if governance is None:
                      missing.append(governance_context)
                  else:
                      governance_created_at = parse_time(governance.get("created_at"))
                      if (
                          governance_created_at is None
                          or governance_created_at < governance_run_started_at
                      ):
                          pending.append(f"{governance_context} (fresh evaluation)")
                      else:
                          governance_state = governance.get("state") or "pending"
                          if governance_state == "success":
                              governance_success = True
                          elif governance_state in {"failure", "error"}:
                              failed.append(f"{governance_context}={governance_state}")
                          else:
                              pending.append(governance_context)

                  if failed:
                      publish("failure", "Exact-head prerequisite failed: " + ", ".join(failed))
                      raise SystemExit(0)

                  if (
                      governance_success
                      and not missing
                      and not pending
                      and len(succeeded) == len(required_checks)
                  ):
                      publish("success", "Ready to merge: all fresh exact-head prerequisites passed.")
                      raise SystemExit(0)

                  waiting = missing + pending
                  publish("pending", "Waiting for exact-head checks: " + ", ".join(waiting))
                  if attempt < attempts:
                      time.sleep(20)

              publish("failure", "Timed out waiting for fresh exact-head prerequisites.")
          except SystemExit:
              raise
          except Exception as exc:
              # An infrastructure/controller error is a real failure, not a lifecycle wait.
              try:
                  publish("failure", f"Readiness controller error: {type(exc).__name__}")
              finally:
                  raise
          PY
