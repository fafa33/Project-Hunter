name: Hunter Merge Readiness

# One visible, deterministic answer to: "is this PR actually ready to merge now?"
#
# Security model:
# - pull_request_target executes this workflow from the trusted default branch.
# - no PR code is checked out or executed.
# - PR body, author, and changed-file metadata are treated as untrusted data.
# - permissions are read-only.
# - Hunter Governance Review remains the governance authority; this job only
#   aggregates lifecycle metadata and exact-head check results into one signal.

on:
  pull_request_target:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
      - edited
      - ready_for_review
      - converted_to_draft

permissions:
  actions: read
  checks: read
  contents: read
  pull-requests: read

concurrency:
  group: hunter-merge-readiness-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  readiness:
    name: Hunter Merge Readiness
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Validate lifecycle metadata
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_DRAFT: ${{ github.event.pull_request.draft }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import sys
          import urllib.request

          repo = os.environ["GH_REPO"]
          pr_number = os.environ["PR_NUMBER"]
          token = os.environ["GH_TOKEN"]
          body = os.environ.get("PR_BODY", "")
          draft = os.environ.get("PR_DRAFT", "").lower() == "true"
          author = os.environ.get("PR_AUTHOR", "")

          def api(path):
              request = urllib.request.Request(
                  f"https://api.github.com/repos/{repo}/{path}",
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": f"Bearer {token}",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.load(response)

          if draft:
              print("NOT MERGE READY: PR is still Draft.")
              sys.exit(1)

          # Keep the same narrow dependency-bot exception as Hunter Governance
          # Review. Bot identity alone is never sufficient; every changed file
          # must also be in the dependency-only allowlist.
          trusted_bots = {"dependabot[bot]", "renovate[bot]"}
          trusted_dependency_pr = False
          if author in trusted_bots:
              files = []
              page = 1
              while True:
                  batch = api(f"pulls/{pr_number}/files?per_page=100&page={page}")
                  files.extend(item["filename"] for item in batch)
                  if len(batch) < 100:
                      break
                  page += 1

              def allowed_dependency_file(filename):
                  if filename.startswith(("src/", "scripts/", "tests/", "docs/", ".github/")):
                      return False
                  if filename.startswith("requirements/"):
                      return True
                  return filename in {
                      "pyproject.toml",
                      "poetry.lock",
                      "package-lock.json",
                      "pnpm-lock.yaml",
                  }

              trusted_dependency_pr = bool(files) and all(
                  allowed_dependency_file(filename) for filename in files
              )

          if trusted_dependency_pr:
              print("Trusted dependency-only bot PR: template readiness metadata is exempt.")
              sys.exit(0)

          rows = []
          in_table = False
          for line in body.splitlines():
              stripped = line.strip()
              if stripped.startswith("|") and "Acceptance criterion" in stripped:
                  in_table = True
                  continue
              if not stripped.startswith("|"):
                  in_table = False
                  continue
              if not in_table:
                  continue
              cells = [cell.strip() for cell in stripped.strip("|").split("|")]
              if len(cells) < 2:
                  continue
              status = cells[1].lower()
              if status in {"pass", "fail", "blocked", "not applicable"}:
                  rows.append((cells[0], status))

          if not rows:
              print("NOT MERGE READY: acceptance-criteria matrix has no parseable criteria.")
              sys.exit(1)

          unresolved = [name for name, status in rows if status in {"fail", "blocked"}]
          if unresolved:
              print("NOT MERGE READY: FAIL/BLOCKED acceptance criteria: " + ", ".join(unresolved))
              sys.exit(1)

          checked = []
          allowed = ("ready for review", "changes required", "blocked")
          for match in re.finditer(r"(?im)^\s*[-*+]\s*\[([ xX])\]\s*(.+)", body):
              marker, text = match.group(1), match.group(2).strip().lower()
              if marker not in ("x", "X"):
                  continue
              normalized = text.replace("`", "").replace("*", "")
              for declaration in allowed:
                  if normalized.startswith(declaration):
                      checked.append(declaration)
                      break

          if len(checked) != 1:
              print("NOT MERGE READY: exactly one implementer readiness declaration must be checked.")
              sys.exit(1)
          if checked[0] != "ready for review":
              print(f"NOT MERGE READY: implementer readiness is {checked[0].upper()}.")
              sys.exit(1)

          print("Lifecycle metadata is merge-ready.")
          PY

      - name: Wait for exact-head required checks
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python - <<'PY'
          import json
          import os
          import sys
          import time
          import urllib.request

          repo = os.environ["GH_REPO"]
          sha = os.environ["HEAD_SHA"]
          token = os.environ["GH_TOKEN"]
          required = (
              "Hunter Governance Review",
              "Quality Gates",
              "dependency-review",
              "CodeQL",
          )

          def check_runs():
              request = urllib.request.Request(
                  f"https://api.github.com/repos/{repo}/commits/{sha}/check-runs?per_page=100",
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": f"Bearer {token}",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.load(response)["check_runs"]

          # Quality Gates historically takes several minutes. Keep this check in
          # progress while the real exact-head checks are still in progress,
          # rather than publishing a misleading early green result.
          for attempt in range(45):
              runs = check_runs()
              latest = {}
              for run in runs:
                  name = run.get("name")
                  if name not in required:
                      continue
                  previous = latest.get(name)
                  if previous is None or run.get("id", 0) > previous.get("id", 0):
                      latest[name] = run

              missing = [name for name in required if name not in latest]
              pending = [
                  name
                  for name in required
                  if name in latest and latest[name].get("status") != "completed"
              ]
              failed = [
                  name
                  for name in required
                  if name in latest
                  and latest[name].get("status") == "completed"
                  and latest[name].get("conclusion") != "success"
              ]

              if failed:
                  for name in failed:
                      run = latest[name]
                      print(
                          f"NOT MERGE READY: {name} concluded {run.get('conclusion')} "
                          f"on exact head {sha}."
                      )
                  sys.exit(1)

              if not missing and not pending:
                  print(f"MERGE READY: all required checks passed on exact head {sha}.")
                  for name in required:
                      print(f"- {name}: success")
                  sys.exit(0)

              waiting = missing + pending
              print(
                  f"Waiting for exact-head checks ({attempt + 1}/45): "
                  + ", ".join(waiting)
              )
              time.sleep(20)

          print("NOT MERGE READY: timed out waiting for exact-head required checks.")
          sys.exit(1)
          PY
