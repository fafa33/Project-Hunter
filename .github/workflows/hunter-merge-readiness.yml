name: Hunter / Merge Readiness

# Publishes the single user-facing `Hunter Merge Readiness` commit status.
#
# Merge means merge: no stale governance result and no unresolved feedback may
# coexist with a green readiness status.
#
# Architecture (see scripts/hunter_merge_readiness.py):
#
#   trigger -> identify PR -> read current canonical GitHub state -> compute
#   semantic revision -> resolve matching Governance evidence -> evaluate
#   blockers -> publish exactly one current readiness result
#
# Every trigger below is only an adapter that answers "which pull request
# number(s) might need reconciling?". None of them carries decision authority:
# the controller re-reads live state for each identified pull request and
# decides purely from that. A duplicated, delayed, reordered, or replayed
# delivery can therefore only cause a redundant reconciliation of current
# state, never a different result.
#
# Feedback contract:
# - every unresolved inline review thread blocks;
# - every current CHANGES_REQUESTED review blocks;
# - human and unknown top-level PR Conversation comments block until the
#   repository owner acknowledges that exact current comment with a 👍 reaction;
# - editing a previously acknowledged non-exempt comment invalidates that
#   acknowledgement until the owner removes/re-applies 👍 after the edit;
# - only structurally identifiable status/advisory comments emitted by trusted
#   repository automation are exempt from owner acknowledgement. Unknown bots
#   remain fail-closed.
#
# None of that feedback is an input to Hunter Governance Review, so none of it
# invalidates Governance evidence; it is re-read live on every reconciliation
# instead. Resolving a thread or applying an acknowledgement therefore converges
# on the next reconciliation without requiring a Governance re-run.
#
# workflow_dispatch lets an operator force an immediate reconciliation for a
# single PR. It has no special decision semantics whatsoever -- it runs the
# identical reconcile_pr() path the schedule and every webhook run use.

on:
  pull_request_target:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
      - edited
      - ready_for_review
      - converted_to_draft
      - review_requested
      - review_request_removed
  pull_request_review:
    types:
      - submitted
      - edited
      - dismissed
  pull_request_review_comment:
    types:
      - created
      - edited
      - deleted
  issue_comment:
    types:
      - created
      - edited
      - deleted
  workflow_run:
    workflows:
      - Hunter Governance Review
    types:
      - completed
  # GitHub Actions has no reaction event, and no event fires when a required
  # check other than Governance Review completes. The sweep is the safety net
  # that makes those observable; it has no special decision semantics either.
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Pull request number to force a reconciliation for"
        required: true
        type: number

# Least privilege. `actions: read` and `contents: write` are both gone: the
# controller no longer resolves workflow runs to attribute Governance evidence
# (the evidence states its own owner), and no longer creates the per-PR git-ref
# lock that the removed timestamp/invalidation machinery required.
permissions:
  checks: read
  contents: read
  issues: read
  pull-requests: read
  statuses: write

# Per-PR concurrency. Cancelling a predecessor is safe by construction: no
# reconciliation depends on a predecessor completing, and the successor re-reads
# current state from scratch. The schedule sweep evaluates many pull requests in
# one job and so has no per-PR key; it shares a single sweep group instead, and a
# sweep racing a PR-triggered run cannot publish a stale success because the
# controller re-reads and re-compares the semantic revision immediately before
# publishing green.
concurrency:
  group: >-
    hunter-merge-readiness-${{
      github.event.pull_request.number
      || github.event.issue.number
      || github.event.workflow_run.pull_requests[0].number
      || github.event.inputs.pr_number
      || (github.event_name == 'schedule' && 'sweep')
      || github.run_id
    }}
  cancel-in-progress: true

jobs:
  controller:
    name: Hunter Merge Readiness Controller
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # Always run the canonical controller from the trusted default branch, never
      # from the ref that happened to trigger this run. This matters most for
      # workflow_dispatch: an operator can dispatch from any branch that carries
      # this workflow file, and an unpinned checkout would execute that branch's
      # version of the readiness controller with statuses: write permission.
      - name: Checkout trusted controller (default branch)
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Publish deterministic merge-readiness state
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python scripts/hunter_merge_readiness.py
