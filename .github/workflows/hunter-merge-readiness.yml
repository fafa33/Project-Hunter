name: Hunter / Merge Readiness

# Publishes the single user-facing `Hunter Merge Readiness` commit status.
#
# Merge means merge: no stale governance result and no unresolved feedback may
# coexist with a green readiness status.
#
# Feedback contract:
# - every unresolved inline review thread blocks;
# - every current CHANGES_REQUESTED review blocks;
# - human and unknown top-level PR Conversation comments block until the
#   repository owner acknowledges that exact current comment with a 👍 reaction;
# - editing a previously acknowledged non-exempt comment invalidates that
#   acknowledgement until the owner removes/re-applies 👍 after the edit;
# - only structurally identifiable status/advisory comments emitted by trusted
#   repository automation are exempt from owner acknowledgement. Unknown bots
#   remain fail-closed.
#
# workflow_dispatch lets an operator force an immediate, full reconciliation for a
# single PR (the same check-runs-based evaluation the periodic schedule performs),
# instead of waiting on the schedule's real-world cadence or re-running a webhook-
# triggered run that only performs the lightweight invalidate-and-wait shortcut.
#
# Per-PR mutual exclusion: the concurrency group below only covers runs that share
# a single triggering context (e.g. two pull_request_target events for the same
# PR). A schedule run evaluates every open PR in one job and has no PR-specific
# concurrency key to give it, so it cannot be serialized against a same-PR
# pull_request_target run at the workflow level. That race (a scheduled sweep
# reading stale state while a real edit's invalidation is still being recorded)
# is instead closed at the controller level via an atomic per-PR git-ref lock
# (see acquire_pr_lock/release_pr_lock in hunter_merge_readiness.py), which is
# why `contents: write` is granted below -- git ref creation is the only GitHub
# REST primitive here with real compare-and-swap semantics. The lock ref lives
# under refs/hunter-merge-readiness-locks/*, not refs/heads/*, specifically so
# creating/deleting it is not a branch push and cannot recursively trigger
# hunter-pre-pr-preflight.yml (push: branches-ignore: [main]) or any other
# push/create-triggered workflow in this repository.

on:
  pull_request_target:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
      - edited
      - ready_for_review
      - converted_to_draft
      - review_requested
      - review_request_removed
  pull_request_review:
    types:
      - submitted
      - edited
      - dismissed
  pull_request_review_comment:
    types:
      - created
      - edited
      - deleted
  issue_comment:
    types:
      - created
      - edited
      - deleted
  workflow_run:
    workflows:
      - Hunter Governance Review
    types:
      - completed
  # GitHub Actions has no reaction event. Polling keeps acknowledgements of
  # non-exempt comments observable without requiring a dummy PR edit/comment.
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Pull request number to force a full reconciliation for"
        required: true
        type: number

permissions:
  actions: read
  checks: read
  # write (not read) is required only for the per-PR reconciliation lock's
  # atomic git-ref create/delete (refs/hunter-merge-readiness-locks/pr-*, a
  # non-branch, non-tag ref namespace). The controller never creates,
  # modifies, or deletes any other ref, tree, or blob; branch protection on
  # `main` and every other ref is unaffected, and this ref namespace never
  # fires a `push` or `create` webhook event.
  contents: write
  issues: read
  pull-requests: read
  statuses: write

concurrency:
  group: hunter-merge-readiness-${{ github.event.pull_request.number || github.event.issue.number || github.event.workflow_run.pull_requests[0].number || github.event.inputs.pr_number || github.run_id }}
  cancel-in-progress: true

jobs:
  controller:
    name: Hunter Merge Readiness Controller
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # Always run the canonical controller from the trusted default branch, never
      # from the ref that happened to trigger this run. This matters most for
      # workflow_dispatch: an operator can dispatch from any branch that carries
      # this workflow file, and an unpinned checkout would execute that branch's
      # version of the readiness controller with statuses: write permission.
      - name: Checkout trusted controller (default branch)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Publish deterministic merge-readiness state
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python scripts/hunter_merge_readiness_entrypoint.py
