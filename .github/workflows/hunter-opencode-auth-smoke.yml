name: Hunter / OpenCode Auth Smoke

on:
  workflow_dispatch:

permissions: {}

jobs:
  auth-smoke:
    if: github.ref == 'refs/heads/main' && github.actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment: hunter-issue-agent-executor
    permissions: {}
    steps:
      - name: Checkout trusted main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned model client
        run: sudo python3 scripts/install_opencode_runtime.py --destination /opt/hunter/bin/opencode
      - name: Test model authentication without logging secrets or response
        env:
          OPENCODE_API_KEY: ${{ secrets.HUNTER_ISSUE_AGENT_OPENCODE_API_KEY }}
          MODEL: ${{ vars.HUNTER_ISSUE_AGENT_EXECUTOR_MODEL }}
        run: |
          set -euo pipefail
          if [ -z "$OPENCODE_API_KEY" ] || [ -z "$MODEL" ]; then
            echo 'AUTH_SMOKE_MISSING_CONFIGURATION'
            exit 1
          fi
          sudo useradd --create-home --shell /usr/sbin/nologin hunter-untrusted
          mkdir -p "$RUNNER_TEMP/opencode-auth-smoke"
          chmod 755 "$RUNNER_TEMP/opencode-auth-smoke"
          cd "$RUNNER_TEMP/opencode-auth-smoke"
          # Capture diagnostics privately; never upload or print provider output.
          diagnostic_file="$(mktemp)"
          chmod 600 "$diagnostic_file"
          trap 'rm -f "$diagnostic_file"' EXIT
          set +e
          timeout 90s sudo -n --preserve-env=OPENCODE_API_KEY,MODEL -u hunter-untrusted \
            /usr/bin/env HOME=/home/hunter-untrusted /opt/hunter/bin/opencode run \
            --model "$MODEL" 'Reply with exactly AUTH_OK' > "$diagnostic_file" 2>&1
          result=$?
          set -e
          if [ "$result" -ne 0 ]; then
            # Report only fixed category labels. Do not echo raw model output.
            category=RUNTIME_ERROR
            if [ "$result" -eq 124 ]; then
              category=TIMEOUT
            elif grep -Eiq 'unauthorized|invalid.api.key|authentication.failed|401|403|forbidden' "$diagnostic_file"; then
              category=AUTH_REJECTED
            elif grep -Eiq 'model.not.found|unknown.model|model.*not.*found|404' "$diagnostic_file"; then
              category=MODEL_NOT_FOUND
            elif grep -Eiq 'ECONNREFUSED|ENOTFOUND|ETIMEDOUT|network|fetch.failed|connection' "$diagnostic_file"; then
              category=NETWORK_ERROR
            elif grep -Eiq 'permission.denied|EACCES|cannot.access|not.permitted' "$diagnostic_file"; then
              category=PERMISSION_ERROR
            fi
            echo "AUTH_SMOKE_FAILED category=$category exit_code=$result"
            exit 1
          fi
          echo 'AUTH_SMOKE_MODEL_EXIT_SUCCESS'
