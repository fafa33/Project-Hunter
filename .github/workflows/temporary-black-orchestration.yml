name: Temporary Black Orchestration

on:
  push:
    branches:
      - feat/evidence-pre-model-orchestration

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/evidence-pre-model-orchestration
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Black
        run: python -m pip install black==24.10.0
      - name: Format and remove temporary workflow
        run: |
          black tests/test_evidence_intelligence_pre_model_orchestration.py
          rm .github/workflows/temporary-black-orchestration.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_evidence_intelligence_pre_model_orchestration.py .github/workflows/temporary-black-orchestration.yml
          git diff --cached --quiet || git commit -m "style: black format orchestration tests"
          git push
