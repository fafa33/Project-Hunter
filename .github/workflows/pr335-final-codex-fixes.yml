name: PR335 final Codex fixes

on:
  push:
    branches:
      - codex/issue-334-response-validator-phase-b
    paths:
      - .github/workflows/pr335-final-codex-fixes.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: codex/issue-334-response-validator-phase-b
          fetch-depth: 0
      - name: Apply targeted patch
        run: python .github/pr335_final_fix.py
      - name: Commit and clean temporary fixer
        shell: bash
        run: |
          python -m compileall -q src/hunter/evidence_intelligence tests/test_response_validator_phase_b.py
          git rm .github/workflows/pr335-final-codex-fixes.yml .github/pr335_final_fix.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/hunter/evidence_intelligence/response_validator.py src/hunter/evidence_intelligence/transient_worker.py tests/test_response_validator_phase_b.py
          git diff --cached --check
          git commit -m "Fix final PR 335 Codex findings"
          git push origin HEAD:codex/issue-334-response-validator-phase-b
