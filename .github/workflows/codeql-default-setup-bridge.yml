name: CodeQL default setup bridge

# Exposes GitHub's real CodeQL default-setup analysis as an exact-head `CodeQL`
# check run. It does not run a second/advanced CodeQL configuration.

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: read
  pull-requests: read
  security-events: read

jobs:
  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Verify current PR CodeQL default-setup analysis
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          merge_sha="$(gh api "repos/${GH_REPO}/pulls/${PR_NUMBER}" --jq '.merge_commit_sha // empty')"
          echo "Waiting for CodeQL default-setup analysis for head=${HEAD_SHA} merge=${merge_sha}"

          for attempt in $(seq 1 60); do
            analyses="$(gh api --method GET "repos/${GH_REPO}/code-scanning/analyses" \
              -f pr="${PR_NUMBER}" \
              -f tool_name="CodeQL" \
              -f per_page=100)"

            current="$(jq -c \
              --arg head "${HEAD_SHA}" \
              --arg merge "${merge_sha}" \
              '[.[] | select((.tool.name // "") == "CodeQL") | select(.commit_sha == $head or .commit_sha == $merge)] | sort_by(.created_at) | reverse | .[0] // empty' \
              <<<"${analyses}")"

            if [ -n "${current}" ]; then
              error="$(jq -r '.error // ""' <<<"${current}")"
              rules="$(jq -r '.rules_count // 0' <<<"${current}")"
              if [ -n "${error}" ]; then
                echo "CodeQL default-setup analysis failed: ${error}"
                exit 1
              fi
              if [ "${rules}" -gt 0 ]; then
                echo "CodeQL default-setup analysis verified (${rules} rules)."
                exit 0
              fi
            fi

            echo "CodeQL analysis not current yet (attempt ${attempt}/60)."
            sleep 10
            merge_sha="$(gh api "repos/${GH_REPO}/pulls/${PR_NUMBER}" --jq '.merge_commit_sha // empty')"
          done

          echo "Timed out waiting for a current successful CodeQL default-setup analysis."
          exit 1
