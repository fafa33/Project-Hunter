name: CodeQL default setup bridge

# Exposes GitHub's real CodeQL default-setup analysis as an exact-head `CodeQL`
# check run. It does not run a second/advanced CodeQL configuration.

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: read
  pull-requests: read
  security-events: read

jobs:
  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Verify current PR CodeQL default-setup analysis
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          merge_sha="${{ github.event.pull_request.merge_commit_sha }}"
          echo "Waiting for CodeQL default-setup analysis for head=${HEAD_SHA} merge=${merge_sha}"

          for attempt in $(seq 1 60); do
            # GitHub can regenerate the synthetic merge commit when main moves
            # while this bounded poll is running. Refresh it before matching
            # analysis evidence so a valid current CodeQL result is not rejected
            # merely because the event payload carried the previous merge SHA.
            if refreshed_merge_sha="$(gh api "repos/${GH_REPO}/pulls/${PR_NUMBER}" --jq '.merge_commit_sha // empty' 2>/dev/null)" \
              && [ -n "${refreshed_merge_sha}" ]; then
              merge_sha="${refreshed_merge_sha}"
            fi
            if ! analyses="$(gh api --method GET "repos/${GH_REPO}/code-scanning/analyses"               -f pr="${PR_NUMBER}" -f tool_name="CodeQL" -f per_page=100 2>/dev/null)"; then
              echo "CodeQL API unavailable on attempt ${attempt}/60; retrying."
              sleep 10
              continue
            fi

            if ! current="$(jq -c               --arg head "${HEAD_SHA}" --arg merge "${merge_sha}"               '[.[] | select((.tool.name // "") == "CodeQL") | select(.commit_sha == $head or .commit_sha == $merge)] | sort_by(.created_at) | reverse | .[0] // empty'               <<<"${analyses}" 2>/dev/null)"; then
              echo "CodeQL API returned malformed analysis data on attempt ${attempt}/60; retrying."
              sleep 10
              continue
            fi

            if [ -n "${current}" ]; then
              error="$(jq -r '.error // ""' <<<"${current}")"
              rules="$(jq -r '.rules_count // 0' <<<"${current}")"
              if [ -n "${error}" ]; then
                echo "CodeQL default-setup analysis failed: ${error}"
                exit 1
              fi
              if [ "${rules}" -gt 0 ]; then
                echo "CodeQL default-setup analysis verified (${rules} rules)."
                exit 0
              fi
            fi

            echo "CodeQL analysis not current yet (attempt ${attempt}/60)."
            sleep 10
          done

          echo "Timed out waiting for a current successful CodeQL default-setup analysis."
          exit 1
