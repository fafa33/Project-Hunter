          new = '''        response_artifact: ProviderResponseArtifact | None = None\n        if isinstance(result, _ProtectedTransportObservation) and result.response_present:\n            response_artifact = ProviderResponseArtifact(\n                state="RESPONSE_EVIDENCE_UNAVAILABLE_BY_POLICY",\n                reason_code=RESPONSE_EVIDENCE_UNAVAILABLE_REASON,\n                attempt_id=attempt.attempt_id,\n                handoff_id=prepared.handoff.handoff_id,\n                execution_profile_identity=profile.profile_identity,\n                request_evidence_identity=attempt.request_evidence_identity,\n                request_evidence_state=attempt.request_evidence_state,\n                response_protocol_identity=result.response_protocol_identity,\n                response_protocol_version=result.response_protocol_version,\n                transport_identity=result.transport_identity,\n                transport_version=result.transport_version,\n                recorded_at=recorded_at.astimezone(UTC),\n                provider_status_metadata=result.provider_status_metadata,\n            )\n        elif isinstance(result, TransportResult) and result.response_text is not None:\n            response_artifact = self._capture_response_evidence(\n                prepared=prepared,\n                profile=profile,\n                decision=decision,\n                result=result,\n                recorded_at=recorded_at,\n            )\n'''
          if old not in s:
              raise SystemExit('record artifact target not found')
          s = s.replace(old, new, 1)

          old = '''        except Exception as error:  # noqa: BLE001 - persistence failure is itself an outcome\n            if response_artifact is None:\n'''
          new = '''        except Exception as error:  # noqa: BLE001 - persistence failure is itself an outcome\n            if isinstance(result, _ProtectedTransportObservation) and self._transient_response_vault is not None:\n                self._transient_response_vault._discard_pending_authorized(  # noqa: SLF001\n                    self.__transient_handoff_capability,\n                    session_id=result.session_id,\n                )\n            if response_artifact is None:\n'''
