          new = '''        # A policy-non-retained response may exist only inside the hardened worker.\n        protected_transient = (\n            permitted_response_evidence_state(prepared.resolved_authority.decision)\n            == "RESPONSE_EVIDENCE_UNAVAILABLE_BY_POLICY"\n        )\n        if protected_transient and self._transient_response_vault is None:\n            raise TransientResponseAccessError(\n                "TRANSIENT_NOT_RETAINED dispatch requires the canonical protected worker"\n            )\n\n        # 6. Atomic single-use consumption. This is the only place a dispatch\n        #    authorization is minted, and it is minted only after the compare-and-set\n        #    has already claimed the handoff, so at most one caller can proceed.\n        if handoff.is_expired_at(dispatched_at):\n'''
