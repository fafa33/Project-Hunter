name: PR335 protected worker

on:
  push:
    branches:
      - codex/issue-334-response-validator-phase-b

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: codex/issue-334-response-validator-phase-b
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11.13'
      - name: Install project
        run: python -m pip install --disable-pip-version-check -c requirements/ci-constraints.txt -e '.[dev]'
      - name: Apply protected worker implementation
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('src/hunter/evidence_intelligence/model_adapter.py')
          s = p.read_text()
          s = s.replace('import hashlib\nimport json\nimport os\nimport re\nimport socket\nimport threading\nfrom array import array\n', 'import ctypes\nimport hashlib\nimport json\nimport multiprocessing\nimport os\nimport re\nimport resource\nimport sys\nimport threading\n')

          start = s.index('@dataclass(frozen=True)\nclass _TransientResponseEntry:')
          end = s.index('\ndef _canonical_json', start)
          replacement = r'''@dataclass(frozen=True)
class _TransientResponseEntry:
    response_capture_identity: str
    attempt_id: str
    handoff_id: str
    outcome_id: str
    execution_profile_identity: str
    response_protocol_identity: str
    response_protocol_version: str
    transport_identity: str
    transport_version: str


@dataclass(frozen=True)
class _TransientResponseEnvelope:
    response_capture_identity: str
    attempt_id: str
    handoff_id: str
    outcome_id: str
    execution_profile_identity: str
    response_protocol_identity: str
    response_protocol_version: str
    transport_identity: str
    transport_version: str


@dataclass(frozen=True)
class _ProtectedTransportObservation:
    result_class: str
    delivery_certainty: DeliveryCertainty
    execution_evidence: ProviderExecutionEvidence
    transport_identity: str
    transport_version: str
    response_protocol_identity: str
    response_protocol_version: str
    provider_status_metadata: tuple[tuple[str, str], ...]
    correlation_identity: str | None
    idempotency_key: str | None
    reason_code: str
    response_present: bool
    transient_body_available: bool
    session_id: str | None


class TransientResponseRuleUnavailable(TransientResponseAccessError):
    """Protected worker reached semantic execution but its governed rule was unavailable."""


class TransientResponseExecutionError(TransientResponseAccessError):
    """Protected worker semantic execution failed after it began."""


@dataclass
class _ProtectedWorkerSession:
    session_id: str
    process: Any = field(repr=False)
    connection: Any = field(repr=False)
    envelope: _TransientResponseEnvelope | None = None
    validation_event_id: str | None = None
    lock: threading.Lock = field(default_factory=threading.Lock, repr=False)


def _harden_transient_worker() -> None:
    """Apply the OS inspection boundary before provider response bytes can exist."""
    resource.setrlimit(resource.RLIMIT_CORE, (0, 0))
    try:
        os.setsid()
    except OSError:
        pass
    libc = ctypes.CDLL(None, use_errno=True)
    if sys.platform.startswith("linux"):
        # PR_SET_DUMPABLE=0 blocks same-UID ptrace and /proc memory/fd inspection.
        if libc.prctl(4, 0, 0, 0, 0) != 0:
            errno = ctypes.get_errno()
            raise OSError(errno, "PR_SET_DUMPABLE failed")
        # PR_SET_NO_NEW_PRIVS=1 prevents the worker from acquiring new privilege.
        if libc.prctl(38, 1, 0, 0, 0) != 0:
            errno = ctypes.get_errno()
            raise OSError(errno, "PR_SET_NO_NEW_PRIVS failed")
    elif sys.platform == "darwin":
        # PT_DENY_ATTACH prevents debugger attachment to the response-bearing worker.
        if libc.ptrace(31, 0, None, 0) != 0:
            errno = ctypes.get_errno()
            raise OSError(errno, "PT_DENY_ATTACH failed")
    else:
        raise OSError(f"no protected transient worker hardening is installed for {sys.platform}")


def _protected_transient_worker_main(
    connection: Any,
    *,
    session_id: str,
    transport: ProviderTransport,
    request: TransportRequest,
    authorization: DispatchAuthorization,
    credential: TransportCredential,
) -> None:
    """Own provider response bytes and semantic consumption outside the caller process."""
    body: str | None = None
    envelope: _TransientResponseEnvelope | None = None
    validation_event_id: str | None = None
    try:
        try:
            _harden_transient_worker()
        except Exception as error:  # noqa: BLE001 - startup must fail closed before send
            connection.send(("startup_error", type(error).__name__))
            return
        connection.send(("ready", None))
        command, _payload = connection.recv()
        if command != "dispatch":
            connection.send(("protocol_error", "dispatch command required"))
            return
        try:
            result = transport.send(request, authorization=authorization, credential=credential)
        except Exception as error:  # noqa: BLE001 - preserve the caller's existing transport-failure semantics
            connection.send(("transport_raised", type(error).__name__))
            return
        if not isinstance(result, TransportResult):
            connection.send(("noncanonical_transport_result", None))
            return

        body = result.response_text
        body_available = body is not None and response_content_credential_risk(body) is None
        observation = {
            "result_class": result.result_class,
            "delivery_certainty": result.delivery_certainty,
            "execution_evidence": result.execution_evidence,
            "transport_identity": result.transport_identity,
            "transport_version": result.transport_version,
            "response_protocol_identity": result.response_protocol_identity,
            "response_protocol_version": result.response_protocol_version,
            "provider_status_metadata": result.provider_status_metadata,
            "correlation_identity": result.correlation_identity,
            "idempotency_key": result.idempotency_key,
            "reason_code": result.reason_code,
            "response_present": body is not None,
            "transient_body_available": body_available,
            "session_id": session_id if body_available else None,
        }
        connection.send(("observation", observation))
        if not body_available:
            body = None
            return

        while True:
            command, payload = connection.recv()
            if command == "discard":
                body = None
                return
            if command == "bind":
                candidate = _TransientResponseEnvelope(**payload)
                if envelope is not None and envelope != candidate:
                    connection.send(("bind_rejected", None))
                    continue
                envelope = candidate
                connection.send(("bound", session_id))
                continue
            if command == "reserve":
                if envelope is None or any(
                    getattr(envelope, name) != value
                    for name, value in payload["coordinates"].items()
                    if hasattr(envelope, name)
                ):
                    connection.send(("reserve_rejected", None))
                    continue
                event_id = str(payload["validation_event_id"])
                if validation_event_id is not None and validation_event_id != event_id:
                    connection.send(("reserve_rejected", None))
                    continue
                validation_event_id = event_id
                connection.send(("reserved", event_id))
                continue
            if command == "evaluate":
                if body is None or envelope is None or validation_event_id is None:
                    connection.send(("body_unavailable", None))
                    return
                coordinates = payload["coordinates"]
                if str(coordinates.validation_event_id) != validation_event_id:
                    connection.send(("authorization_mismatch", None))
                    return
                for name in (
                    "response_capture_identity",
                    "attempt_id",
                    "handoff_id",
                    "outcome_id",
                    "execution_profile_identity",
                ):
                    if getattr(envelope, name) != getattr(coordinates, name):
                        connection.send(("authorization_mismatch", None))
                        return
                try:
                    findings = payload["runtime"].evaluate(
                        response_text=body,
                        coordinates=coordinates,
                        output_contract=payload["output_contract"],
                        evidence_inputs=payload["evidence_inputs"],
                        provider_status_metadata=payload["provider_status_metadata"],
                        required_dimensions=payload["required_dimensions"],
                    )
                except Exception as error:  # noqa: BLE001 - parent maps closed semantic failure classes
                    body = None
                    if type(error).__name__ == "ResponseValidationRuleUnavailable":
                        connection.send(("rule_unavailable", None))
                    else:
                        connection.send(("execution_error", type(error).__name__))
                    return
                body = None
                connection.send(("findings", findings))
                return
            connection.send(("protocol_error", command))
            return
    except (EOFError, BrokenPipeError, OSError):
        body = None
    finally:
        body = None
        try:
            connection.close()
        except OSError:
            pass


class _TransientResponseConsumer:
    """Validator-side control plane; it never owns a response body or readable body descriptor."""

    def __init__(self) -> None:
        self.__sessions: dict[str, _ProtectedWorkerSession] = {}
        self.__lock = threading.Lock()

    def _bind_session(self, entry: _TransientResponseEntry, session: _ProtectedWorkerSession) -> None:
        envelope = _TransientResponseEnvelope(**asdict(entry))
        with session.lock:
            session.connection.send(("bind", asdict(envelope)))
            if not session.connection.poll(30):
                raise TransientResponseAccessError("protected transient worker did not acknowledge capture binding")
            kind, _payload = session.connection.recv()
            if kind != "bound":
                raise TransientResponseAccessError("protected transient worker rejected capture binding")
            session.envelope = envelope
        with self.__lock:
            if entry.response_capture_identity in self.__sessions:
                raise TransientResponseAccessError("transient response capture is already pending")
            self.__sessions[entry.response_capture_identity] = session

    def available_for_validation(self, **coordinates: str) -> bool:
        with self.__lock:
            session = self.__sessions.get(coordinates["response_capture_identity"])
        return (
            session is not None
            and session.process.is_alive()
            and session.envelope is not None
            and self.__matches(session.envelope, coordinates)
        )

    def reserve_authorized(self, *, validation_event_id: str, **coordinates: str) -> bool:
        with self.__lock:
            session = self.__sessions.get(coordinates["response_capture_identity"])
        if session is None or session.envelope is None or not self.__matches(session.envelope, coordinates):
            return False
        with session.lock:
            if not session.process.is_alive():
                return False
            session.connection.send(
                (
                    "reserve",
                    {"validation_event_id": validation_event_id, "coordinates": dict(coordinates)},
                )
            )
            if not session.connection.poll(30):
                return False
            kind, payload = session.connection.recv()
            if kind != "reserved" or payload != validation_event_id:
                return False
            session.validation_event_id = validation_event_id
            return True

    def evaluate_authorized(
        self,
        *,
        coordinates: Any,
        runtime: Any,
        output_contract: Mapping[str, Any],
        evidence_inputs: tuple[tuple[str, str], ...],
        provider_status_metadata: tuple[tuple[str, str], ...],
        required_dimensions: tuple[str, ...],
        response_protocol_identity: str,
        response_protocol_version: str,
        transport_identity: str,
        transport_version: str,
    ) -> tuple[Any, ...]:
        capture_identity = coordinates.response_capture_identity
        with self.__lock:
            session = self.__sessions.pop(capture_identity, None)
        if session is None or session.envelope is None:
            raise TransientResponseAccessError("transient response material is unavailable")
        expected = {
            "response_capture_identity": capture_identity,
            "attempt_id": coordinates.attempt_id,
            "handoff_id": coordinates.handoff_id,
            "outcome_id": coordinates.outcome_id,
            "execution_profile_identity": coordinates.execution_profile_identity,
            "response_protocol_identity": response_protocol_identity,
            "response_protocol_version": response_protocol_version,
            "transport_identity": transport_identity,
            "transport_version": transport_version,
        }
        if not self.__matches(session.envelope, expected) or session.validation_event_id != coordinates.validation_event_id:
            self.__discard_session(session)
            raise TransientResponseAccessError("transient response lineage does not match authorization")
        try:
            with session.lock:
                if not session.process.is_alive():
                    raise TransientResponseAccessError("protected transient worker is unavailable")
                session.connection.send(
                    (
                        "evaluate",
                        {
                            "coordinates": coordinates,
                            "runtime": runtime,
                            "output_contract": dict(output_contract),
                            "evidence_inputs": evidence_inputs,
                            "provider_status_metadata": provider_status_metadata,
                            "required_dimensions": required_dimensions,
                        },
                    )
                )
                if not session.connection.poll(30):
                    raise TransientResponseAccessError("protected transient worker did not return semantic result")
                kind, payload = session.connection.recv()
        finally:
            session.process.join(timeout=2)
            if session.process.is_alive():
                session.process.terminate()
                session.process.join(timeout=2)
            session.connection.close()
        if kind == "findings":
            return tuple(payload)
        if kind == "rule_unavailable":
            raise TransientResponseRuleUnavailable("protected transient rule unavailable")
        if kind == "execution_error":
            raise TransientResponseExecutionError("protected transient semantic execution failed")
        raise TransientResponseAccessError("protected transient response became unavailable before semantic execution")

    def discard_authorized(self, **coordinates: str) -> None:
        with self.__lock:
            session = self.__sessions.get(coordinates["response_capture_identity"])
            if session is None or session.envelope is None or not self.__matches(session.envelope, coordinates):
                return
            del self.__sessions[coordinates["response_capture_identity"]]
        self.__discard_session(session)

    @staticmethod
    def __discard_session(session: _ProtectedWorkerSession) -> None:
        try:
            with session.lock:
                if session.process.is_alive():
                    session.connection.send(("discard", None))
        except (BrokenPipeError, EOFError, OSError):
            pass
        session.process.join(timeout=2)
        if session.process.is_alive():
            session.process.terminate()
            session.process.join(timeout=2)
        try:
            session.connection.close()
        except OSError:
            pass

    @staticmethod
    def __matches(entry: _TransientResponseEnvelope, coordinates: Mapping[str, str]) -> bool:
        return all(not hasattr(entry, name) or getattr(entry, name) == value for name, value in coordinates.items())


class TransientResponseHandoffVault:
    """Control plane for protected ADR 0035 transient workers; it never stores response bytes."""

    def __init__(self) -> None:
        self.__model_adapter_bound = False
        self.__model_adapter_capability: object | None = None
        self.__response_validator_bound = False
        self.__consumer: _TransientResponseConsumer | None = None
        self.__pending_sessions: dict[str, _ProtectedWorkerSession] = {}
        self.__lock = threading.Lock()

    def _bind_model_adapter(self, owner: object, installer: Any) -> None:
        expected = vars(ModelAdapterService)["_ModelAdapterService__install_transient_handoff_capability"]
        if (
            type(owner) is not ModelAdapterService
            or getattr(owner, "_transient_response_vault", None) is not self
            or getattr(installer, "__self__", None) is not owner
            or getattr(installer, "__func__", None) is not expected
            or self.__model_adapter_bound
        ):
            raise TransientResponseAccessError("transient handoff producer owner is not canonical")
        capability = object()
        self.__model_adapter_bound = True
        self.__model_adapter_capability = capability
        installer(capability)

    def _bind_response_validator(self, owner: object, installer: Any) -> None:
        from hunter.evidence_intelligence.response_validator import ResponseValidator

        expected = vars(ResponseValidator)["_ResponseValidator__install_transient_response_consumer"]
        if (
            type(owner) is not ResponseValidator
            or getattr(owner, "_transient_response_vault", None) is not self
            or getattr(installer, "__self__", None) is not owner
            or getattr(installer, "__func__", None) is not expected
            or self.__response_validator_bound
        ):
            raise TransientResponseAccessError("transient handoff consumer owner is not canonical")
        consumer = _TransientResponseConsumer()
        installer(consumer)
        self.__consumer = consumer
        self.__response_validator_bound = True

    def _dispatch_protected_authorized(
        self,
        capability: object | None,
        *,
        transport: ProviderTransport,
        request: TransportRequest,
        authorization: DispatchAuthorization,
        credential: TransportCredential,
    ) -> _ProtectedTransportObservation:
        if capability is None or capability is not self.__model_adapter_capability:
            raise TransientResponseAccessError("protected transient dispatch requires Model Adapter authority")
        if not self.__response_validator_bound or self.__consumer is None:
            raise TransientResponseAccessError("protected transient dispatch has no canonical ResponseValidator owner")
        if not (sys.platform.startswith("linux") or sys.platform == "darwin"):
            raise TransientResponseAccessError("protected transient worker is unavailable on this platform")
        context = multiprocessing.get_context("fork")
        parent_connection, child_connection = context.Pipe(duplex=True)
        session_id = os.urandom(24).hex()
        process = context.Process(
            target=_protected_transient_worker_main,
            kwargs={
                "connection": child_connection,
                "session_id": session_id,
                "transport": transport,
                "request": request,
                "authorization": authorization,
                "credential": credential,
            },
            daemon=True,
        )
        process.start()
        child_connection.close()
        session = _ProtectedWorkerSession(session_id=session_id, process=process, connection=parent_connection)
        if not parent_connection.poll(30):
            _TransientResponseConsumer._TransientResponseConsumer__discard_session(session)
            raise TransientResponseAccessError("protected transient worker did not establish isolation")
        kind, payload = parent_connection.recv()
        if kind != "ready":
            _TransientResponseConsumer._TransientResponseConsumer__discard_session(session)
            raise TransientResponseAccessError(f"protected transient worker failed before dispatch: {kind}")
        parent_connection.send(("dispatch", None))
        if not parent_connection.poll(120):
            _TransientResponseConsumer._TransientResponseConsumer__discard_session(session)
            raise TransientResponseAccessError("protected transient transport did not return")
        kind, payload = parent_connection.recv()
        if kind == "transport_raised":
            _TransientResponseConsumer._TransientResponseConsumer__discard_session(session)
            raise TransientResponseAccessError(f"protected transport raised {payload}")
        if kind != "observation" or not isinstance(payload, dict):
            _TransientResponseConsumer._TransientResponseConsumer__discard_session(session)
            raise TransientResponseAccessError("protected transport returned a non-canonical observation")
        observation = _ProtectedTransportObservation(**payload)
        if observation.session_id is not None:
            with self.__lock:
                self.__pending_sessions[observation.session_id] = session
        else:
            process.join(timeout=2)
            parent_connection.close()
        return observation

    def _deposit_authorized(
        self,
        capability: object | None,
        *,
        entry: _TransientResponseEntry,
        session_id: str,
    ) -> None:
        if capability is None or capability is not self.__model_adapter_capability:
            raise TransientResponseAccessError("transient response deposit requires Model Adapter authority")
        consumer = self.__consumer
        if consumer is None:
            raise TransientResponseAccessError("transient response handoff has no canonical ResponseValidator owner")
        with self.__lock:
            session = self.__pending_sessions.pop(session_id, None)
        if session is None:
            raise TransientResponseAccessError("protected transient worker session is unavailable")
        try:
            consumer._bind_session(entry, session)  # noqa: SLF001 - exact protected handoff boundary
        except Exception:
            _TransientResponseConsumer._TransientResponseConsumer__discard_session(session)
            raise

    def _discard_pending_authorized(self, capability: object | None, *, session_id: str | None) -> None:
        if capability is None or capability is not self.__model_adapter_capability or session_id is None:
            return
        with self.__lock:
            session = self.__pending_sessions.pop(session_id, None)
        if session is not None:
            _TransientResponseConsumer._TransientResponseConsumer__discard_session(session)
'''
