          old_end = s.index('\n\n        return ModelDispatchOutcome', old_start)
          replacement_end = '''        if (\n            outcome == "SUCCEEDED_TRANSPORT"\n            and response_artifact is not None\n            and response_artifact.state == "RESPONSE_EVIDENCE_UNAVAILABLE_BY_POLICY"\n            and isinstance(result, _ProtectedTransportObservation)\n            and result.transient_body_available\n            and result.session_id is not None\n            and handoff_id is not None\n            and self._transient_response_vault is not None\n        ):\n            self._transient_response_vault._deposit_authorized(  # noqa: SLF001 - capability-checked handoff\n                self.__transient_handoff_capability,\n                session_id=result.session_id,\n                entry=_TransientResponseEntry(\n                    response_capture_identity=response_artifact.response_artifact_identity,\n                    attempt_id=attempt.attempt_id,\n                    handoff_id=handoff_id,\n                    outcome_id=record.outcome_id,\n                    execution_profile_identity=profile.profile_identity,\n                    response_protocol_identity=result.response_protocol_identity,\n                    response_protocol_version=result.response_protocol_version,\n                    transport_identity=result.transport_identity,\n                    transport_version=result.transport_version,\n                ),\n            )\n        elif isinstance(result, _ProtectedTransportObservation) and self._transient_response_vault is not None:\n            self._transient_response_vault._discard_pending_authorized(  # noqa: SLF001\n                self.__transient_handoff_capability,\n                session_id=result.session_id,\n            )'''
          s = s[:old_start] + replacement_end + s[old_end:]
          p.write_text(s)

          p = Path('src/hunter/evidence_intelligence/response_validator.py')
          s = p.read_text()
          s = s.replace(
              '    TransientResponseAccessError,\n    TransientResponseHandoffVault,\n',
              '    TransientResponseAccessError,\n    TransientResponseExecutionError,\n    TransientResponseHandoffVault,\n    TransientResponseRuleUnavailable,\n',
          )

          old = '''            if not reserved:\n                return self._refusal_result(\n                    allocation=allocation,\n                    state=ValidationState.INPUT_UNAVAILABLE,\n                    reason_code="TRANSIENT_RESPONSE_CAPTURE_RESERVED_BY_OTHER_EVENT",\n                    available_authority=(\n                        ("profile_publication_id", inputs.coordinates.profile_publication_id),\n                        ("profile_resolution_id", inputs.coordinates.profile_resolution_id),\n                        ("response_capture_identity", inputs.coordinates.response_capture_identity),\n                        ("validation_event_id", inputs.coordinates.validation_event_id),\n                    ),\n                )\n\n        authorization = ResponseValidationAuthorization'''
          new = '''            if not reserved:\n                return self._refusal_result(\n                    allocation=allocation,\n                    state=ValidationState.INPUT_UNAVAILABLE,\n                    reason_code="TRANSIENT_RESPONSE_CAPTURE_RESERVED_BY_OTHER_EVENT",\n                    available_authority=(\n                        ("profile_publication_id", inputs.coordinates.profile_publication_id),\n                        ("profile_resolution_id", inputs.coordinates.profile_resolution_id),\n                        ("response_capture_identity", inputs.coordinates.response_capture_identity),\n                        ("validation_event_id", inputs.coordinates.validation_event_id),\n                    ),\n                )\n            consumer = self.__transient_response_consumer\n            if consumer is None or not consumer.reserve_authorized(\n                validation_event_id=inputs.coordinates.validation_event_id,\n                response_capture_identity=inputs.coordinates.response_capture_identity,\n                attempt_id=inputs.coordinates.attempt_id,\n                handoff_id=inputs.coordinates.handoff_id,\n                outcome_id=inputs.coordinates.outcome_id,\n                execution_profile_identity=inputs.coordinates.execution_profile_identity,\n            ):\n                return self._refusal_result(\n                    allocation=allocation,\n                    state=ValidationState.INPUT_UNAVAILABLE,\n                    reason_code="TRANSIENT_RESPONSE_ACCESS_UNAVAILABLE",\n                    available_authority=(\n                        ("response_capture_identity", inputs.coordinates.response_capture_identity),\n                        ("validation_event_id", inputs.coordinates.validation_event_id),\n                    ),\n                )\n\n        authorization = ResponseValidationAuthorization'''
          if old not in s:
              raise SystemExit('reservation consumer target not found')
          s = s.replace(old, new, 1)

          old_start = s.index('        response_text: str\n        if canonical.coordinates.input_mode is ValidationInputMode.DURABLE:')
          old_end = s.index('\n        state = highest_precedence_validation_state', old_start)
          replacement_exec = r'''        if canonical.coordinates.input_mode is ValidationInputMode.DURABLE:
            content = rederived.response_artifact.content
            if content is None:
                raise ResponseValidationExecutionError("durable authorization has no canonical response content")
            try:
                findings = self._runtime.evaluate(
                    response_text=content,
                    coordinates=canonical.coordinates,
                    output_contract=rederived.output_contract,
                    evidence_inputs=rederived.evidence_inputs,
                    provider_status_metadata=rederived.provider_status_metadata,
                    required_dimensions=rederived.required_dimensions,
                )
            except ResponseValidationRuleUnavailable:
                findings = (
                    ResponseValidationFinding(
                        "RULE_AVAILABILITY",
                        ValidationState.RULE_UNAVAILABLE,
                        "EXECUTABLE_VALIDATION_RULE_UNAVAILABLE",
                    ),
                )
            except Exception:  # noqa: BLE001 - validator failure becomes the closed deterministic state
                findings = (
                    ResponseValidationFinding(
                        "VALIDATOR_EXECUTION",
                        ValidationState.VALIDATOR_ERROR,
                        "VALIDATOR_EXECUTION_FAILED",
                    ),
                )
        else:
            consumer = self.__transient_response_consumer
            if consumer is None:
                return self._presemantic_execution_refusal(
                    canonical,
                    reason_code="TRANSIENT_RESPONSE_ACCESS_UNAVAILABLE",
                )
            try:
                findings = consumer.evaluate_authorized(
                    coordinates=canonical.coordinates,
                    runtime=self._runtime,
                    output_contract=rederived.output_contract,
                    evidence_inputs=rederived.evidence_inputs,
                    provider_status_metadata=rederived.provider_status_metadata,
                    required_dimensions=rederived.required_dimensions,
                    response_protocol_identity=rederived.response_artifact.response_protocol_identity,
                    response_protocol_version=rederived.response_artifact.response_protocol_version,
                    transport_identity=rederived.response_artifact.transport_identity,
                    transport_version=rederived.response_artifact.transport_version,
                )
            except TransientResponseRuleUnavailable:
                findings = (
                    ResponseValidationFinding(
                        "RULE_AVAILABILITY",
                        ValidationState.RULE_UNAVAILABLE,
                        "EXECUTABLE_VALIDATION_RULE_UNAVAILABLE",
                    ),
                )
            except TransientResponseExecutionError:
                findings = (
                    ResponseValidationFinding(
                        "VALIDATOR_EXECUTION",
                        ValidationState.VALIDATOR_ERROR,
                        "VALIDATOR_EXECUTION_FAILED",
                    ),
                )
            except TransientResponseAccessError:
                return self._presemantic_execution_refusal(
                    canonical,
                    reason_code="TRANSIENT_RESPONSE_ACCESS_UNAVAILABLE",
                )
'''
          s = s[:old_start] + replacement_exec + s[old_end:]
          p.write_text(s)

          p = Path('tests/test_response_validator_phase_b.py')
          s = p.read_text()
          if 'import os\n' not in s:
              s = s.replace('import logging\n', 'import logging\nimport os\n')
          old = '''    vault_state = vars(harness.transient_response_vault)\n    assert "_TransientResponseHandoffVault__entries" not in vault_state\n    assert "_TransientResponseHandoffVault__consumer_endpoint" not in vault_state\n    assert not any("owner" in name for name in vault_state)\n    assert marker not in repr(vault_state)\n    assert marker not in repr(vars(harness.adapter))\n    producer = vault_state["_TransientResponseHandoffVault__producer_endpoint"]\n    with pytest.raises(BlockingIOError):\n        producer.recv(1, socket.MSG_DONTWAIT)\n\n    authorization = _authorize(harness)\n    consumer = harness.validator._ResponseValidator__transient_response_consumer  # noqa: SLF001\n    assert marker not in repr(vars(consumer))\n    result = harness.validator.execute(authorization)\n    retry = harness.validator.execute(authorization)\n\n    assert result is retry\n    assert result.outcome.state is ValidationState.VALID\n    assert consumer._TransientResponseConsumer__entries == {}  # noqa: SLF001\n'''
          new = '''    vault_state = vars(harness.transient_response_vault)\n    assert "_TransientResponseHandoffVault__entries" not in vault_state\n    assert "_TransientResponseHandoffVault__producer_endpoint" not in vault_state\n    assert marker not in repr(vault_state)\n    assert marker not in repr(vars(harness.adapter))\n\n    authorization = _authorize(harness)\n    consumer = harness.validator._ResponseValidator__transient_response_consumer  # noqa: SLF001\n    consumer_state = vars(consumer)\n    assert "_TransientResponseConsumer__entries" not in consumer_state\n    assert marker not in repr(consumer_state)\n    sessions = consumer_state["_TransientResponseConsumer__sessions"]\n    assert len(sessions) == 1\n    session = next(iter(sessions.values()))\n    assert not hasattr(session, "descriptor")\n    if sys.platform.startswith("linux"):\n        with pytest.raises(OSError):\n            os.listdir(f"/proc/{session.process.pid}/fd")\n        with pytest.raises(OSError):\n            os.open(f"/proc/{session.process.pid}/mem", os.O_RDONLY)\n\n    result = harness.validator.execute(authorization)\n    retry = harness.validator.execute(authorization)\n\n    assert result is retry\n    assert result.outcome.state is ValidationState.VALID\n    assert consumer._TransientResponseConsumer__sessions == {}  # noqa: SLF001\n'''
          if old not in s:
              raise SystemExit('transient inspection test target not found')
          s = s.replace(old, new, 1)
          s = s.replace('import socket\n', '')
          if 'import sys\n' not in s:
              s = s.replace('import sqlite3\n', 'import sqlite3\nimport sys\n')
          p.write_text(s)
          PY
      - name: Format and validate
