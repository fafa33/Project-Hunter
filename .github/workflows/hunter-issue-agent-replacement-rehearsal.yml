name: Hunter / Issue Agent Replacement Rehearsal
on:
  workflow_dispatch:
    inputs:
      authorization_b64:
        description: Base64 signed Issue Agent authorization
        required: true
        type: string
      result_b64:
        description: Base64 non-publishing replacement result
        required: true
        type: string
permissions:
  contents: read
jobs:
  rehearse:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11.13"
      - name: Validate structurally non-publishing rehearsal
        env:
          AUTHORIZATION_B64: ${{ inputs.authorization_b64 }}
          RESULT_B64: ${{ inputs.result_b64 }}
          HUNTER_ISSUE_AGENT_AUTHORIZATION_VERIFYING_KEY: ${{ secrets.HUNTER_ISSUE_AGENT_AUTHORIZATION_VERIFYING_KEY }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$AUTHORIZATION_B64" | base64 --decode > "$RUNNER_TEMP/authorization.json"
          printf '%s' "$RESULT_B64" | base64 --decode > "$RUNNER_TEMP/result.json"
          unset AUTHORIZATION_B64 RESULT_B64
          PYTHONPATH=src python scripts/hunter_issue_agent_replacement_rehearsal.py             --authorization "$RUNNER_TEMP/authorization.json"             --result "$RUNNER_TEMP/result.json"
