name: Hunter / Issue Agent Replacement Rehearsal
on:
  # workflow_call: the S6 rehearsal producer hands its verified pair to this job; the validator stays a separate,
  # credential-free trust domain from the control job that holds K_AUTH.
  workflow_call:
    inputs:
      authorization_b64:
        required: true
        type: string
      result_b64:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      authorization_b64:
        description: Base64 signed Issue Agent authorization
        required: true
        type: string
      result_b64:
        description: Base64 non-publishing replacement result
        required: true
        type: string
# Structurally non-publishing (ADR 0037 S5): no environment, no publication or model secret, no write.
permissions: {}
concurrency:
  group: hunter-issue-agent-rehearsal
  cancel-in-progress: false
  queue: max
jobs:
  rehearse:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11.13"
      - name: Install pinned authorization verification dependency
        env:
          PIP_CONSTRAINT: requirements/ci-constraints.txt
        run: 'python -m pip install --disable-pip-version-check --only-binary=:all: "cryptography==50.0.0"'
      - name: Validate structurally non-publishing rehearsal
        env:
          AUTHORIZATION_B64: ${{ inputs.authorization_b64 }}
          RESULT_B64: ${{ inputs.result_b64 }}
          HUNTER_ISSUE_AGENT_AUTHORIZATION_VERIFYING_KEY: ${{ secrets.HUNTER_ISSUE_AGENT_AUTHORIZATION_VERIFYING_KEY }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$AUTHORIZATION_B64" | base64 --decode > "$RUNNER_TEMP/authorization.json"
          printf '%s' "$RESULT_B64" | base64 --decode > "$RUNNER_TEMP/result.json"
          unset AUTHORIZATION_B64 RESULT_B64
          PYTHONPATH=src python scripts/hunter_issue_agent_replacement_rehearsal.py             --authorization "$RUNNER_TEMP/authorization.json"             --result "$RUNNER_TEMP/result.json"
