name: Hunter Collector Result Publisher

# The one small trusted publisher of reviewer-collector results. It is resolved from the default
# branch (workflow_run), checks out only default-branch code and never executes candidate content.
#
# The collector itself holds no status write. This workflow re-reads the actual collector run, its
# integrity-checked receipt and the current pull-request state from GitHub, and only then publishes
# the single non-blocking result a receipt can prove (REVIEWER_UNAVAILABLE), followed by a refresh of
# that pull request's governance status. It trusts no dispatch payload, run title or artifact alone.
#
# A collector run that failed, was cancelled or timed out never reaches the job below: nothing is
# published and the cycle stays pending. Recovery is GitHub's "Re-run all jobs" on the collector
# run, which raises this event again for the new attempt.
on:
  workflow_run:
    workflows:
      - Hunter Reviewer Collector
    types:
      - completed

permissions:
  actions: read # read the collector run and download its receipt
  checks: read
  contents: read
  pull-requests: read
  statuses: write # publish the verified result and the governance status

concurrency:
  group: hunter-collector-publisher-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish verified collector result
    if: >-
      github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.event == 'pull_request_target'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout trusted publisher
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Verify the collector run and publish its result
        id: publish
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          COLLECTOR_RUN_ID: ${{ github.event.workflow_run.id }}
          COLLECTOR_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        run: python scripts/hunter_collector_publisher.py --repository "$GITHUB_REPOSITORY" --run-id "$COLLECTOR_RUN_ID" --run-attempt "$COLLECTOR_RUN_ATTEMPT"

      - name: Refresh governance status for the verified pull request
        if: steps.publish.outputs.pr_number != ''
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          VERIFIED_PR_NUMBER: ${{ steps.publish.outputs.pr_number }}
        run: >-
          python scripts/hunter_governance_review/bootstrap_external_review_469.py governance
          --pr "$VERIFIED_PR_NUMBER" --repository "$GITHUB_REPOSITORY"
