name: Hunter Reviewer Collector

run-name: >-
  Hunter Reviewer Collector PR ${{ inputs.pr_number }} HEAD ${{ inputs.head_sha }}${{
  inputs.generation_id && format(' GEN {0}', inputs.generation_id) || '' }}

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request to review
        required: true
        type: string
      head_sha:
        description: Exact 40-character candidate HEAD
        required: true
        type: string
      dispatch_proof:
        description: Opaque per-dispatch capability issued by trusted orchestrator
        required: true
        type: string
      generation_id:
        description: >-
          Remediation generation of this exact head, or empty for the candidate's
          first cycle. The collector re-derives it from trusted review-thread
          state and fails closed on disagreement, so this input correlates the
          run; it never authorises one.
        required: false
        default: ""
        type: string

# `actions: write` is what lets this collector dispatch a reviewer that runs as
# its own workflow. The collector is dispatch-only: the trusted default-branch
# orchestrator is the single entry point, so PR lifecycle events cannot race or
# duplicate the exact-head collector cycle. `statuses: write` is what lets this
# run publish its own completion directly onto the candidate's exact head (see
# "Publish collector completion" below): this run's own workflow_run event
# always reports main's SHA, never the candidate's, so the candidate/head this
# collector was dispatched for must be recorded as evidence this run itself
# writes, not derived later from an event that cannot carry it.
permissions:
  contents: read
  actions: write
  pull-requests: write

concurrency:
  group: hunter-reviewer-collector-${{ inputs.pr_number }}
  cancel-in-progress: false

jobs:
  collect:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    # Global independent-review opportunity budget. Completion triggers trusted
    # reconcile, which finalizes timeout/unavailability without blocking.
    #
    # PR #535 live evidence: this must never be shorter than the worst case every enabled
    # reviewer in docs/CODE_WRITE_POLICY.json's reviewer_pool can spend before
    # the collector moves on (each agent's review_timeout_seconds, summed in
    # priority order) plus this job's own checkout/publish overhead --
    # otherwise GitHub cancels the job mid-invocation and silently turns a
    # reviewer that was still within its own configured budget into an
    # incomplete run. `test_collector_workflow_lifetime_covers_the_reviewer_chain_budget`
    # (tests/test_hunter_review_orchestrator.py) derives that minimum from the
    # same pool and fails the moment this value stops covering it.
    timeout-minutes: 47
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Collect actual configured reviewer invocations
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          PR_NUMBER: ${{ inputs.pr_number }}
          CANDIDATE_HEAD: ${{ inputs.head_sha }}
          REMEDIATION_GENERATION: ${{ inputs.generation_id }}
        run: >-
          python scripts/hunter_reviewer_collector.py
          --pr "$PR_NUMBER" --head "$CANDIDATE_HEAD"
          --generation "$REMEDIATION_GENERATION"
          --output reviewer-results.json
      - name: Save opaque dispatch capability for trusted completion
        env:
          DISPATCH_PROOF: ${{ inputs.dispatch_proof }}
        run: printf '%s' "$DISPATCH_PROOF" > collector-dispatch-proof.txt
      - uses: actions/upload-artifact@v4
        with:
          name: hunter-reviewer-results-${{ inputs.head_sha }}-${{ github.run_attempt }}
          path: |
            reviewer-results.json
            collector-dispatch-proof.txt
          if-no-files-found: error
          retention-days: 30
