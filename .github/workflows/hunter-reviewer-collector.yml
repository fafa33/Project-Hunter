name: Hunter Reviewer Collector

# The run name carries the exact dispatch identity. GitHub does not report
# workflow-dispatch inputs on a run, so the trusted orchestrator correlates a
# run to this pull request and head through this name rather than through
# timestamps, which would also match an unrelated dispatch.
run-name: Hunter Reviewer Collector PR ${{ inputs.pr_number }} HEAD ${{ inputs.head_sha }}

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request to review
        required: true
        type: string
      head_sha:
        description: Exact 40-character candidate HEAD
        required: true
        type: string

permissions:
  contents: read
  actions: write
  pull-requests: write
  statuses: write

concurrency:
  group: hunter-reviewer-collector-${{ inputs.pr_number }}
  cancel-in-progress: false

jobs:
  collect:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Collect actual configured reviewer invocations
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
          CANDIDATE_HEAD: ${{ inputs.head_sha }}
        run: >-
          python scripts/hunter_reviewer_collector.py
          --pr "$PR_NUMBER" --head "$CANDIDATE_HEAD"
          --output reviewer-results.json
      - uses: actions/upload-artifact@v4
        with:
          name: hunter-reviewer-results-${{ inputs.head_sha }}-${{ github.run_attempt }}
          path: reviewer-results.json
          if-no-files-found: error
          retention-days: 30
      - name: Publish trusted collector completion
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python scripts/hunter_review_orchestrator.py collector-complete
          --repository "${{ github.repository }}"
          --pr "${{ inputs.pr_number }}"
          --head "${{ inputs.head_sha }}"
          --run-id "${{ github.run_id }}"
