name: Hunter Reviewer Collector

on:
  pull_request_target:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request to review
        required: true
        type: string
      head_sha:
        description: Exact 40-character candidate HEAD
        required: true
        type: string

permissions:
  contents: read
  actions: read
  pull-requests: write

concurrency:
  group: hunter-reviewer-collector-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: false

jobs:
  collect:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Collect actual configured reviewer invocations
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
          CANDIDATE_HEAD: ${{ github.event.pull_request.head.sha || inputs.head_sha }}
        run: >-
          python scripts/hunter_reviewer_collector.py
          --pr "$PR_NUMBER" --head "$CANDIDATE_HEAD"
          --output reviewer-results.json
      - uses: actions/upload-artifact@v4
        with:
          name: hunter-reviewer-results-${{ inputs.head_sha }}-${{ github.run_attempt }}
          path: reviewer-results.json
          if-no-files-found: error
          retention-days: 30
