name: Hunter Reviewer Collector

run-name: >-
  Hunter Reviewer Collector PR ${{ github.event.client_payload.pr_number }} HEAD ${{ github.event.client_payload.head_sha }}${{
  github.event.client_payload.generation_id && format(' GEN {0}', github.event.client_payload.generation_id) || '' }}

# This privileged workflow is loaded from default branch only.
# Candidate-selected workflow_dispatch refs are forbidden.
on:
  repository_dispatch:
    types: [hunter-reviewer-collect]

# The collector may dispatch reviewer workflows but must never publish trusted
# completion statuses on a candidate head. It uploads the result receipt and
# dispatch proof; the trusted default-branch reconcile workflow verifies the
# run, attempt and evidence before publishing completion.
permissions:
  contents: read
  actions: write
  pull-requests: write

concurrency:
  group: hunter-reviewer-collector-${{ github.event.client_payload.pr_number }}
  cancel-in-progress: false

jobs:
  collect:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    # Global independent-review opportunity budget. Completion triggers trusted
    # reconcile, which finalizes timeout/unavailability without blocking.
    #
    # PR #535 live evidence: this must never be shorter than the worst case every enabled
    # reviewer in docs/CODE_WRITE_POLICY.json's reviewer_pool can spend before
    # the collector moves on (each agent's review_timeout_seconds, summed in
    # priority order) plus this job's own checkout/publish overhead --
    # otherwise GitHub cancels the job mid-invocation and silently turns a
    # reviewer that was still within its own configured budget into an
    # incomplete run. `test_collector_workflow_lifetime_covers_the_reviewer_chain_budget`
    # (tests/test_hunter_review_orchestrator.py) derives that minimum from the
    # same pool and fails the moment this value stops covering it.
    timeout-minutes: 47
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Collect actual configured reviewer invocations
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          PR_NUMBER: ${{ github.event.client_payload.pr_number }}
          CANDIDATE_HEAD: ${{ github.event.client_payload.head_sha }}
          REMEDIATION_GENERATION: ${{ github.event.client_payload.generation_id }}
          COLLECTOR_DISPATCH_PROOF: ${{ github.event.client_payload.dispatch_proof }}
        run: >-
          python scripts/hunter_reviewer_collector.py
          --pr "$PR_NUMBER" --head "$CANDIDATE_HEAD"
          --generation "$REMEDIATION_GENERATION"
          --output reviewer-results.json
      - name: Save opaque dispatch capability for trusted completion
        env:
          DISPATCH_PROOF: ${{ github.event.client_payload.dispatch_proof }}
        run: printf '%s' "$DISPATCH_PROOF" > collector-dispatch-proof.txt
      - uses: actions/upload-artifact@v4
        with:
          name: hunter-reviewer-results-${{ github.event.client_payload.head_sha }}-${{ github.run_attempt }}
          path: reviewer-results.json
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: hunter-dispatch-proof-${{ github.event.client_payload.head_sha }}-${{ github.run_attempt }}
          path: collector-dispatch-proof.txt
          if-no-files-found: error
          retention-days: 30
