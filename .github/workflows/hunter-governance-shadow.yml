name: Hunter Governance Shadow

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number
        required: true
        type: number

permissions:
  actions: read
  checks: read
  contents: read
  pull-requests: read
  statuses: read

jobs:
  shadow:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Record non-authoritative shadow observation
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.inputs.pr_number }}
        run: PYTHONPATH=scripts:src python scripts/hunter_governance_shadow.py --repository "${{ github.repository }}" --pr "${PR_NUMBER}" --generation 1
      - uses: actions/upload-artifact@v6
        with:
          name: hunter-governance-shadow-${{ github.event.pull_request.head.sha || github.sha }}
          path: shadow/observation.json
          if-no-files-found: error
