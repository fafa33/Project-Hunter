name: Temporary Black Format

on:
  push:
    branches:
      - ava/source-handling-tests-first

permissions:
  contents: write

concurrency:
  group: tmp-black-format-source-handling
  cancel-in-progress: true

jobs:
  format:
    if: ${{ !contains(github.event.head_commit.message, '[black-formatted]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ava/source-handling-tests-first
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11.13"

      - name: Install exact formatter
        run: python -m pip install black==24.10.0

      - name: Format only affected files
        run: |
          black src/hunter/evidence_intelligence/source_handling.py tests/test_source_handling_authority_enforcement.py

      - name: Commit formatter output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/hunter/evidence_intelligence/source_handling.py tests/test_source_handling_authority_enforcement.py
          if git diff --cached --quiet; then
            echo "No formatting changes required"
            exit 0
          fi
          git commit -m "style: apply Black to source handling [black-formatted]"
          git push origin HEAD:ava/source-handling-tests-first
