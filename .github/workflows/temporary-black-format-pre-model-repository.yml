name: Temporary Black Format Pre-Model Repository

on:
  push:
    branches:
      - codex/evidence-pre-model-repository-inventory
    paths:
      - .github/workflows/temporary-black-format-pre-model-repository.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/evidence-pre-model-repository-inventory
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.13"
      - name: Install Black
        run: python -m pip install black==24.10.0
      - name: Format and remove temporary workflow
        run: |
          set -euo pipefail
          black src/hunter/evidence_intelligence/pre_model_repository.py tests/test_evidence_intelligence_pre_model_repository.py
          rm .github/workflows/temporary-black-format-pre-model-repository.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/hunter/evidence_intelligence/pre_model_repository.py tests/test_evidence_intelligence_pre_model_repository.py .github/workflows/temporary-black-format-pre-model-repository.yml
          git commit -m "style: format repository-backed pre-model adapter"
          git push
