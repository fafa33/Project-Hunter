name: Hunter / Issue Agent OpenCode Diagnostic

on:
  workflow_dispatch:

permissions: {}

jobs:
  probe:
    if: github.ref == 'refs/heads/main' && github.actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment: hunter-issue-agent-executor
    steps:
      - name: Checkout trusted main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11.13"
      - name: Install pinned runtime and model client
        run: |
          set -euo pipefail
          python -m pip install --only-binary ':all:' -c requirements/ci-constraints.txt .
          sudo python scripts/install_opencode_runtime.py --destination /opt/hunter/bin/opencode
      - name: Create dedicated untrusted principal
        run: |
          sudo useradd --create-home --shell /usr/sbin/nologin hunter-untrusted
          sudo install -d -m 0711 /tmp/hunter-ia
          sudo install -d -m 0711 -o "$(id -u)" -g "$(id -g)" /tmp/hunter-ia/execute
      - name: Run bounded diagnostic via production isolation launcher
        env:
          HUNTER_ISSUE_AGENT_EXECUTOR_MODEL_API_KEY: ${{ secrets.HUNTER_ISSUE_AGENT_OPENCODE_API_KEY }}
          MODEL: ${{ vars.HUNTER_ISSUE_AGENT_EXECUTOR_MODEL }}
          MODEL_KEY_NAME: ${{ vars.HUNTER_ISSUE_AGENT_EXECUTOR_MODEL_KEY_NAME }}
        run: |
          set -euo pipefail
          # The probe launches through hunter.automation.issue_agent_roles.opencode_invocation, the same contract
          # the production executor uses, and asserts a tracked-file edit through the production collector.
          python scripts/hunter_opencode_diagnostic_probe.py \
            --source "$GITHUB_WORKSPACE" \
            --workspace /tmp/hunter-ia/execute/workspace \
            --git-dir /tmp/hunter-ia/execute/trusted.git \
            --home /tmp/hunter-ia/execute/home \
            --opencode /opt/hunter/bin/opencode \
            --model "$MODEL" \
            --secret-env HUNTER_ISSUE_AGENT_EXECUTOR_MODEL_API_KEY \
            --model-key-name "$MODEL_KEY_NAME" \
            --isolation-user hunter-untrusted \
            --timeout 240
