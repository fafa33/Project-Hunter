# final-trigger-2026-08-26
name: PR335 final size-bound fix

on:
  push:
    branches:
      - codex/issue-334-response-validator-phase-b
    paths:
      - .github/workflows/pr335-final-size-bound-fix.yml

permissions:
  contents: write

jobs:
  fix-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: codex/issue-334-response-validator-phase-b
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11.13"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements/ci-constraints.txt
      - name: Install project
        env:
          PIP_CONSTRAINT: requirements/ci-constraints.txt
        run: python -m pip install --disable-pip-version-check -c requirements/ci-constraints.txt -e ".[dev]"
      - name: Fix exact Decimal size-bound comparisons and add regression
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("src/hunter/evidence_intelligence/response_validator.py")
          text = path.read_text()
          replacements = {
              'len(value) < int(schema["minItems"])': 'len(value) < schema["minItems"]',
              'len(value) > int(schema["maxItems"])': 'len(value) > schema["maxItems"]',
              'len(value) < int(schema["minLength"])': 'len(value) < schema["minLength"]',
              'len(value) > int(schema["maxLength"])': 'len(value) > schema["maxLength"]',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f"expected size-bound comparison not found: {old}")
              text = text.replace(old, new, 1)
          path.write_text(text)
          tests = Path("tests/test_response_validator_phase_b.py")
          test_text = tests.read_text()
          marker = "def test_pr335_huge_decimal_schema_size_bound_is_compared_without_int_materialization"
          if marker not in test_text:
              test_text += '''\n\ndef test_pr335_huge_decimal_schema_size_bound_is_compared_without_int_materialization(tmp_path: Path) -> None:\n    harness = fixture.make_harness(\n        tmp_path,\n        output_contract='{\"type\":\"string\",\"minLength\":1e1000000000}',\n        raw_response='\"a\"',\n        profile_overrides={\"required_dimensions\": (\"SYNTAX\", \"SCHEMA\", \"OUTPUT_CONTRACT\")},\n    )\n    result = _execute(harness)\n    assert result.outcome.state is ValidationState.INVALID_OUTPUT_CONTRACT\n'''
              tests.write_text(test_text)
          PY
          python -m pytest -q tests/test_response_validator_phase_b.py -k 'integral_decimal_schema_size_keywords or huge_decimal_schema_size_bound or reservation_owner'
          python scripts/hunter_pr_preflight.py --mode normal
          rm .github/workflows/pr335-final-size-bound-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/hunter/evidence_intelligence/response_validator.py tests/test_response_validator_phase_b.py .github/workflows/pr335-final-size-bound-fix.yml
          git diff --cached --check
          git commit -m "Harden JSON Schema size-bound comparisons"
          git push origin HEAD:codex/issue-334-response-validator-phase-b
