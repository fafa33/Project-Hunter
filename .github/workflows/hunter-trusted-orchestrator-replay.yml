name: Hunter / Trusted Orchestrator Replay

# Trusted candidate orchestrator replay harness (Issue #534 follow-on).
#
# hunter_review_orchestrator.py, hunter_reviewer_collector.py and
# hunter_governance_review_v2.py execute only from the trusted default branch
# (pull_request_target / workflow_run / push:main), by deliberate trust-boundary
# design: a candidate branch must never self-authorize privileged execution of
# its own controller-logic changes. That design is correct, but it also means a
# candidate PR that changes this trusted controller logic can never exercise its
# own fix from its own live CI runs -- reconcile/collector/readiness always run
# against main, which does not yet contain the candidate's change. This is the
# "trust-boundary bootstrap deadlock".
#
# This workflow breaks the deadlock without weakening the boundary, in three
# jobs of strictly increasing trust and strictly decreasing candidate contact:
#   1. validate-replay   (contents: read, blanked tokens) checks out the exact
#      candidate and replays its controller-logic modules against fixed,
#      offline scenario fixtures, producing a receipt.
#   2. verify-candidate-digest (contents: read ONLY -- no write permission of
#      any kind) independently re-checks-out the exact candidate and
#      recomputes each scenario's candidate-module digest itself, never
#      trusting job 1's receipt.
#   3. publish-proof (statuses: write) never checks out candidate content at
#      all: it re-derives every other trusted quantity itself and takes the
#      digest result from job 2, then publishes a status.
#
# Splitting the candidate-touching recomputation (job 2) out of the
# status-publishing job (job 3) means no job that checks out untrusted
# candidate content ever also holds a write permission, so this design does
# not trip "checkout of untrusted code in a privileged context" even though
# the harness only ever reads candidate bytes to hash or replay them, never
# executes them outside job 1's credential-blanked subprocess worker.
#
# The candidate never gets production write credentials, never runs from a
# workflow the candidate's own branch controls, and can never convert a passing
# replay into merge authority: no production authority resolver (Merge
# Readiness, Governance Review, candidate admission) consults this status.
#
# A green "Hunter Trusted Orchestrator Replay" status proves the candidate's
# controller-logic modules satisfy fixed, deterministic, offline invariants
# against fixed fixtures. It does NOT prove real GitHub propagation latency,
# real reviewer-provider latency, real webhook timing, or real provider
# availability -- those remain live, post-merge canary evidence. See
# scripts/hunter_trusted_orchestrator_replay.py for the full evidence boundary.

on:
  pull_request_target:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize

concurrency:
  group: hunter-orchestrator-replay-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate-replay:
    name: Trusted Candidate Orchestrator Replay
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout trusted controller
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout exact candidate as untrusted input
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11.13"

      - name: Run trusted candidate orchestrator replay
        env:
          GITHUB_TOKEN: ""
          GH_TOKEN: ""
        run: |
          set -euo pipefail
          python scripts/hunter_trusted_orchestrator_replay.py run \
            --candidate-root candidate \
            --pr "${{ github.event.pull_request.number }}" \
            --candidate-sha "${{ github.event.pull_request.head.sha }}" \
            --out replay-receipt.json

      - name: Upload replay receipt
        uses: actions/upload-artifact@v4
        with:
          name: replay-receipt
          path: replay-receipt.json
          retention-days: 14

  verify-candidate-digest:
    name: Independently Verify Candidate Module Digests
    needs: validate-replay
    if: ${{ always() && !cancelled() && needs.validate-replay.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # No write permission of any kind. This is the only job that touches
    # candidate content after job 1, and it must never also be able to mint a
    # status, check, or PR write -- see the workflow-level comment above.
    permissions:
      contents: read

    steps:
      - name: Checkout trusted controller
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false

      # Re-checked-out here, independently of job 1, so this job recomputes
      # candidate module digests itself rather than trusting job 1's receipt.
      - name: Checkout exact candidate as untrusted input
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11.13"

      - name: Download replay receipt
        uses: actions/download-artifact@v4
        with:
          name: replay-receipt
          path: .

      - name: Verify candidate module digests
        env:
          GITHUB_TOKEN: ""
          GH_TOKEN: ""
        run: |
          set -euo pipefail
          python scripts/hunter_trusted_orchestrator_replay.py verify-digests \
            --receipt replay-receipt.json \
            --candidate-root candidate \
            --out digest-check.json

      # Runs even when the step above found a mismatch and exited non-zero,
      # so publish-proof still gets the specific per-scenario error detail
      # rather than falling back to a generic "evidence missing" failure.
      - name: Upload digest verification result
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: digest-check
          path: digest-check.json
          retention-days: 14

  publish-proof:
    name: Publish Exact-Head Trusted Replay Proof
    needs: [validate-replay, verify-candidate-digest]
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Never checks out candidate content (see the workflow-level comment
    # above) -- only trusted controller code and two small trusted-produced
    # JSON artifacts.
    permissions:
      contents: read
      statuses: write

    steps:
      - name: Checkout trusted controller
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11.13"

      - name: Download replay receipt
        if: needs.validate-replay.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: replay-receipt
          path: .

      - name: Download digest verification result
        if: ${{ always() }}
        uses: actions/download-artifact@v4
        with:
          name: digest-check
          path: .
        continue-on-error: true

      - name: Independently validate the trusted replay receipt
        id: validate_receipt
        env:
          GITHUB_TOKEN: ""
          GH_TOKEN: ""
        run: |
          set -euo pipefail
          if [ "${{ needs.validate-replay.result }}" != "success" ] || [ ! -f digest-check.json ]; then
            echo "validate-replay or verify-candidate-digest did not produce evidence; treating replay as failed" >&2
            echo "result=failure" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if python scripts/hunter_trusted_orchestrator_replay.py validate \
            --receipt replay-receipt.json \
            --digest-check digest-check.json \
            --pr "${{ github.event.pull_request.number }}" \
            --candidate-sha "${{ github.event.pull_request.head.sha }}"; then
            echo "result=success" >> "$GITHUB_OUTPUT"
          else
            echo "result=failure" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish exact-head PR-bound status
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          VALIDATION_RESULT: ${{ steps.validate_receipt.outputs.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import urllib.request

          result = os.environ["VALIDATION_RESULT"]
          state = "success" if result == "success" else "failure"
          payload = json.dumps(
              {
                  "state": state,
                  "context": f"Hunter Trusted Orchestrator Replay / PR #{os.environ['PR_NUMBER']}",
                  "description": f"Trusted candidate controller replay {state} ({result})",
                  "target_url": os.environ["RUN_URL"],
              }
          ).encode("utf-8")
          request = urllib.request.Request(
              f"https://api.github.com/repos/{os.environ['GH_REPO']}/statuses/{os.environ['HEAD_SHA']}",
              data=payload,
              method="POST",
              headers={
                  "Authorization": f"Bearer {os.environ['GITHUB_TOKEN']}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "Content-Type": "application/json",
              },
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              if response.status != 201:
                  raise RuntimeError(f"status publication returned HTTP {response.status}")
          PY
