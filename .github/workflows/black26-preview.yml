name: Black 26 one-shot compatibility migration

on:
  push:
    branches:
      - issue-342-dependency-patch

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: issue-342-dependency-patch
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Apply Black 26.3.1 stable style and remove one-shot workflow
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check black==26.3.1
          black .
          git rm .github/workflows/black26-preview.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Apply Black 26 stable style compatibility migration'
          git push origin HEAD:issue-342-dependency-patch
