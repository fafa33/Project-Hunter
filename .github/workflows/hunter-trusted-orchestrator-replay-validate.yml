name: Hunter / Trusted Orchestrator Replay Validate

# Trusted candidate orchestrator replay harness (Issue #534 follow-on) --
# candidate-touching half. See hunter-trusted-orchestrator-replay-publish.yml
# for the privileged half and the full two-workflow trust boundary rationale.
#
# hunter_review_orchestrator.py, hunter_reviewer_collector.py and
# hunter_governance_review_v2.py execute only from the trusted default branch
# (pull_request_target / workflow_run / push:main), by deliberate trust-boundary
# design: a candidate branch must never self-authorize privileged execution of
# its own controller-logic changes. That design is correct, but it also means a
# candidate PR that changes this trusted controller logic can never exercise its
# own fix from its own live CI runs -- reconcile/collector/readiness always run
# against main, which does not yet contain the candidate's change. This is the
# "trust-boundary bootstrap deadlock".
#
# This workflow replays the candidate's controller-logic modules against
# fixed, offline scenario fixtures and independently recomputes their module
# digests -- and does nothing else. It is deliberately triggered by
# `pull_request_target` with explicitly read-only jobs and trusted base-controlled workflow: no job here ever holds a write
# permission, a repository secret, or a status/check-publishing token, so
# there is nothing for untrusted candidate code (which both jobs below
# execute, by necessity, inside a further credential-blanked, process-isolated
# subprocess -- see scripts/hunter_trusted_orchestrator_replay_worker.py) to
# escalate even if a candidate branch's own copy of this workflow file were
# tampered with. The only thing either job produces is an artifact; the
# separate, privileged publish workflow re-derives every trusted quantity
# itself and never trusts either job's own account of what it did.
#
# validate-replay   (contents: read, blanked tokens) checks out the exact
#   candidate and replays its controller-logic modules against fixed,
#   offline scenario fixtures, producing a receipt.
# verify-candidate-digest (contents: read ONLY -- no write permission of any
#   kind) independently re-checks-out the exact candidate and recomputes each
#   scenario's candidate-module digest itself, never trusting job 1's receipt.
#
# A green "Hunter Trusted Orchestrator Replay" status (published by the
# separate publish workflow) proves the candidate's controller-logic modules
# satisfy fixed, deterministic, offline invariants against fixed fixtures. It
# does NOT prove real GitHub propagation delay, real reviewer-provider
# latency, real webhook timing, or real provider availability -- those remain
# live, post-merge canary evidence. See
# scripts/hunter_trusted_orchestrator_replay.py for the full evidence boundary.

on:
  pull_request_target:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize

concurrency:
  group: hunter-orchestrator-replay-validate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate-replay:
    name: Trusted Candidate Orchestrator Replay
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout trusted controller
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout exact candidate as untrusted input
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11.13"

      - name: Provision and verify trusted network namespace
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y bubblewrap
          test -x /usr/bin/bwrap
          # Ubuntu 24.04 runners restrict unprivileged user namespaces through AppArmor, which makes
          # `bwrap --unshare-net` fail while configuring loopback ("RTM_NEWADDR: Operation not permitted").
          # Lift only that restriction on this ephemeral runner, then verify the namespace really denies egress.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          /usr/bin/bwrap --die-with-parent --unshare-net --unshare-pid --unshare-ipc --unshare-uts --new-session --cap-drop ALL --ro-bind / / --dev /dev --proc /proc --tmpfs /run -- \
            python -c 'import socket; s=socket.socket(); s.settimeout(1); exec("try:\n s.connect((\"1.1.1.1\", 443))\nexcept OSError:\n pass\nelse:\n raise SystemExit(1)")'

      - name: Run trusted candidate orchestrator replay
        env:
          GITHUB_TOKEN: ""
          GH_TOKEN: ""
          PR_NUMBER: ${{ github.event.pull_request.number }}
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # The trusted controller is checked out from main; isolate its entire execution here,
          # so this protection is effective before the candidate helper changes are merged.
          # The harness writes its fixture and the receipt in the workspace root, so the root stays writable, but the
          # trusted harness (`scripts/`: controller, worker, definition) and the candidate checkout are bound
          # read-only on top of it, so neither can be rewritten while the replay runs.
          # The loader path is derived from the interpreter's own prefix, not inherited from the environment, so a
          # variable set earlier in the job cannot point the dynamic loader at attacker-supplied libraries.
          py_lib="$(python -c 'import os, sys; print(os.path.join(sys.base_prefix, "lib"))')"
          env -i PATH="$PATH" LD_LIBRARY_PATH="$py_lib" LANG=C.UTF-8 HOME=/tmp GITHUB_TOKEN= GH_TOKEN= \
            /usr/bin/bwrap --die-with-parent --unshare-net --unshare-pid --unshare-ipc --unshare-uts --new-session --cap-drop ALL --ro-bind / / --dev /dev --proc /proc --tmpfs /run --tmpfs /tmp \
            --bind "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE" \
            --ro-bind "$GITHUB_WORKSPACE/scripts" "$GITHUB_WORKSPACE/scripts" \
            --ro-bind "$GITHUB_WORKSPACE/candidate" "$GITHUB_WORKSPACE/candidate" -- \
            python scripts/hunter_trusted_orchestrator_replay.py run \
            --workspace-root "$GITHUB_WORKSPACE" \
            --candidate-root candidate \
            --pr "$PR_NUMBER" \
            --candidate-sha "$CANDIDATE_SHA" \
            --out replay-receipt.json || {
              rc=$?
              # Diagnostic only: name each failing scenario (inert, truncated, workflow-command syntax defanged).
              python - <<'PY' || true
          import json
          try:
              results = json.load(open("replay-receipt.json"))["scenario_results"]
          except Exception as exc:
              print(f"replay receipt unreadable: {type(exc).__name__}")
          else:
              for item in results:
                  if item.get("outcome") != "pass":
                      line = json.dumps({k: v for k, v in item.items() if k != "invariant"})[:600]
                      print("failing scenario:", line.replace("::", ": :"))
          PY
              exit "$rc"
            }

      - name: Upload replay receipt
        uses: actions/upload-artifact@v4
        with:
          name: replay-receipt
          path: replay-receipt.json
          retention-days: 14

  verify-candidate-digest:
    name: Independently Verify Candidate Module Digests
    needs: validate-replay
    if: ${{ always() && !cancelled() && needs.validate-replay.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # No write permission of any kind -- this job touches candidate content
    # a second time, independently of job 1, and must never also be able to
    # mint a status, check, or PR write.
    permissions:
      contents: read

    steps:
      - name: Checkout trusted controller
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false

      # Re-checked-out here, independently of job 1, so this job recomputes
      # candidate module digests itself rather than trusting job 1's receipt.
      - name: Checkout exact candidate as untrusted input
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11.13"

      - name: Download replay receipt
        uses: actions/download-artifact@v4
        with:
          name: replay-receipt
          path: .

      - name: Verify candidate module digests
        env:
          GITHUB_TOKEN: ""
          GH_TOKEN: ""
        run: |
          set -euo pipefail
          python scripts/hunter_trusted_orchestrator_replay.py verify-digests \
            --workspace-root "$GITHUB_WORKSPACE" \
            --receipt replay-receipt.json \
            --candidate-root candidate \
            --out digest-check.json

      # Runs even when the step above found a mismatch and exited non-zero,
      # so the publish workflow still gets the specific per-scenario error
      # detail rather than falling back to a generic "evidence missing"
      # failure.
      - name: Upload digest verification result
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: digest-check
          path: digest-check.json
          retention-days: 14
