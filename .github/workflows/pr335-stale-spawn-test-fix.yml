name: PR335 stale spawn test fix

on:
  push:
    branches:
      - codex/issue-334-response-validator-phase-b
    paths:
      - .github/workflows/pr335-stale-spawn-test-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: codex/issue-334-response-validator-phase-b
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11.13"
      - name: Update stale fork-era assertions and verify
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('tests/test_response_validator_phase_b.py')
          s = p.read_text()
          old1 = '''    assert "_TransientResponseHandoffVault__worker_entry" in vault_state\n    assert vault_state["_TransientResponseHandoffVault__worker_entry"] is None\n'''
          new1 = '''    assert "_TransientResponseHandoffVault__worker_entry" not in vault_state\n'''
          old2 = '''    assert vault_state["_TransientResponseHandoffVault__worker_entry"] is None\n    sessions = vault_state["_TransientResponseHandoffVault__sessions"]\n'''
          new2 = '''    assert "_TransientResponseHandoffVault__worker_entry" not in vault_state\n    sessions = vault_state["_TransientResponseHandoffVault__sessions"]\n'''
          if s.count(old1) != 1:
              raise SystemExit(f'expected exactly one old1 block, found {s.count(old1)}')
          s = s.replace(old1, new1, 1)
          if s.count(old2) != 1:
              raise SystemExit(f'expected exactly one old2 block, found {s.count(old2)}')
          s = s.replace(old2, new2, 1)
          p.write_text(s)
          PY
          python -m pip install --disable-pip-version-check -c requirements/ci-constraints.txt -e ".[dev]"
          black --check --diff tests/test_response_validator_phase_b.py
          ruff check tests/test_response_validator_phase_b.py
          python -m pytest -q tests/test_response_validator_phase_b.py -k 'transient_response_is_consumed_inside_os_protected_worker_without_caller_body_surface or caller_control_channel_has_no_body_read_operation or protected_worker_uses_fresh_spawn_interpreter_not_fork'
          rm .github/workflows/pr335-stale-spawn-test-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Align protected-worker tests with spawn topology"
          git push origin HEAD:codex/issue-334-response-validator-phase-b
