name: PR335 stale spawn test fix

on:
  push:
    branches:
      - codex/issue-334-response-validator-phase-b
    paths:
      - .github/workflows/pr335-stale-spawn-test-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: codex/issue-334-response-validator-phase-b
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11.13"
      - name: Align tests with fresh-spawn session and packed control protocol
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('tests/test_response_validator_phase_b.py')
          s = p.read_text()

          replacements = [
              (
                  '''from hunter.evidence_intelligence import model_adapter\n''',
                  '''from hunter.evidence_intelligence import model_adapter, transient_worker\n''',
              ),
              (
                  '''    assert "_TransientResponseHandoffVault__worker_entry" in vault_state\n    assert vault_state["_TransientResponseHandoffVault__worker_entry"] is None\n''',
                  '''    assert "_TransientResponseHandoffVault__worker_entry" not in vault_state\n''',
              ),
              (
                  '''    assert session.pid != os.getpid()\n''',
                  '''    assert session.process.pid != os.getpid()\n''',
              ),
              (
                  '''    assert vault_state["_TransientResponseHandoffVault__worker_entry"] is None\n    sessions = vault_state["_TransientResponseHandoffVault__sessions"]\n''',
                  '''    assert "_TransientResponseHandoffVault__worker_entry" not in vault_state\n    sessions = vault_state["_TransientResponseHandoffVault__sessions"]\n''',
              ),
              (
                  '''    session.endpoint.sendall((len(b'{"op":"BODY"}')).to_bytes(4, "big") + b'{"op":"BODY"}')\n    size = int.from_bytes(session.endpoint.recv(4), "big")\n    reply = json.loads(session.endpoint.recv(size).decode())\n''',
                  '''    transient_worker._send_message(session.endpoint, {"op": "BODY"})  # noqa: SLF001\n    reply = transient_worker._recv_message(session.endpoint)  # noqa: SLF001\n''',
              ),
          ]
          for old, new in replacements:
              if s.count(old) != 1:
                  raise SystemExit(f'expected exactly one replacement target, found {s.count(old)}: {old!r}')
              s = s.replace(old, new, 1)
          p.write_text(s)
          PY
          python -m pip install --disable-pip-version-check -c requirements/ci-constraints.txt -e ".[dev]"
          black --check --diff tests/test_response_validator_phase_b.py
          ruff check tests/test_response_validator_phase_b.py
          python -m pytest -q tests/test_response_validator_phase_b.py -k 'transient_response_is_consumed_inside_os_protected_worker_without_caller_body_surface or caller_control_channel_has_no_body_read_operation or protected_worker_uses_fresh_spawn_interpreter_not_fork'
          rm .github/workflows/pr335-stale-spawn-test-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Align protected-worker tests with spawn topology"
          git push origin HEAD:codex/issue-334-response-validator-phase-b
