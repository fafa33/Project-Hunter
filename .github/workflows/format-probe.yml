name: Formatting Probe

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  black-diff:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.13"
      - run: python -m pip install "black==24.10.0"
      - name: Show canonical Black diff
        run: black --line-length 120 --target-version py311 --diff scripts/hunter_governance_review_v2.py scripts/hunter_merge_readiness_v2.py
