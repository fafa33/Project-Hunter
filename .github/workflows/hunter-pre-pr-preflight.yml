name: Hunter / Pre-PR Preflight

on:
  push:
    branches-ignore:
      - main

permissions:
  contents: read

concurrency:
  group: hunter-pre-pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preflight:
    name: Hunter Pre-PR Preflight
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11.13"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements/ci-constraints.txt

      - name: Install project
        env:
          PIP_CONSTRAINT: requirements/ci-constraints.txt
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -c requirements/ci-constraints.txt -e ".[dev]"

      - name: Run shared deterministic preflight
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_NAME}" == *"tests-first"* ]]; then
            python scripts/hunter_pr_preflight.py --mode tests-first-red
          else
            python scripts/hunter_pr_preflight.py --mode normal
          fi
