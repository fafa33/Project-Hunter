name: Hunter / Pre-PR Preflight

on:
  push:
    branches-ignore:
      - main

permissions:
  contents: read

concurrency:
  group: hunter-pre-pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preflight:
    name: Hunter Pre-PR Preflight
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11.13"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements/ci-constraints.txt

      - name: Install project
        env:
          PIP_CONSTRAINT: requirements/ci-constraints.txt
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -c requirements/ci-constraints.txt -e ".[dev]"

      - name: Select exact-head preflight mode
        id: preflight-mode
        run: |
          set -euo pipefail
          PREFLIGHT_MODE=normal
          if [ -f .hunter-preflight-mode ]; then
            PREFLIGHT_MODE="$(cat .hunter-preflight-mode)"
            if [ "${PREFLIGHT_MODE}" != "tests-first-red" ]; then
              echo "::error::.hunter-preflight-mode must contain exactly tests-first-red"
              exit 2
            fi
          fi
          echo "mode=${PREFLIGHT_MODE}" >> "${GITHUB_OUTPUT}"
          echo "Selected preflight mode: ${PREFLIGHT_MODE}"

      - name: Fail fast on mapped changed-file regressions
        if: ${{ steps.preflight-mode.outputs.mode == 'normal' }}
        env:
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          BASE_SHA="$(git merge-base "${HEAD_SHA}" origin/main)"
          python scripts/hunter_ci_impact.py --base "${BASE_SHA}" --head "${HEAD_SHA}" --run-focused

      - name: Run shared deterministic preflight
        env:
          PREFLIGHT_MODE: ${{ steps.preflight-mode.outputs.mode }}
          # The authoritative full repository proof, so the parallel lane matters
          # most here. See the identical declaration in ci.yml.
          PYTEST_ADDOPTS: -n auto --dist loadfile
        run: python scripts/hunter_pr_preflight.py --mode "${PREFLIGHT_MODE}"
