name: CodeRabbit Hostile Review Adapter

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to attest
        required: true
        type: string

permissions:
  contents: read
  pull-requests: write

jobs:
  attest:
    name: Attest exact-pair CodeRabbit review
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted adapter
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Attest CodeRabbit review
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/hunter_coderabbit_review_adapter.py \
            --repository "${GITHUB_REPOSITORY}" \
            --pr "${{ inputs.pr_number }}" \
            --attest
