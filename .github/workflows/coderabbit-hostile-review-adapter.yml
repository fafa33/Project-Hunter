name: CodeRabbit Hostile Review Adapter

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to attest
        required: true
        type: string

permissions:
  contents: read
  pull-requests: write
  statuses: read

jobs:
  attest:
    name: Attest exact-pair CodeRabbit review
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted adapter from main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - name: Require post-merge trusted adapter
        run: |
          set -euo pipefail
          test -f scripts/hunter_coderabbit_review_adapter.py || {
            echo "::error::Trusted CodeRabbit adapter is not present on main yet. This workflow is intentionally post-merge only."
            exit 1
          }

      - name: Attest CodeRabbit review
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          set -euo pipefail
          python scripts/hunter_coderabbit_review_adapter.py \
            --repository "${GITHUB_REPOSITORY}" \
            --pr "${PR_NUMBER}" \
            --attest
