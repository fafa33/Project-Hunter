name: PR335 deadlock regression fix

on:
  push:
    branches:
      - codex/issue-334-response-validator-phase-b
    paths:
      - .github/workflows/pr335-deadlock-test-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: codex/issue-334-response-validator-phase-b
          fetch-depth: 0
      - name: Fix deadlock regression probe
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/test_response_validator_phase_b.py')
          text = path.read_text()
          old = '''    def probe_operation() -> Any:\n        joined = harness.validator.authorize_event(harness.allocation)\n        assert joined.authorization is not None\n        from types import SimpleNamespace\n\n        return SimpleNamespace(\n            outcome=SimpleNamespace(outcome_id="protected-worker-lock-probe", recorded_at=fixture.CONCLUDED_AT),\n            response_artifact=None,\n        )\n'''
          new = '''    def probe_operation() -> Any:\n        # Prove the child-side validator lock is usable after fork without\n        # depending on transient-session availability during dispatch itself.\n        with harness.validator._state_lock:  # noqa: SLF001 - adversarial fork regression\n            pass\n        from types import SimpleNamespace\n\n        return SimpleNamespace(\n            outcome=SimpleNamespace(outcome_id="protected-worker-lock-probe", recorded_at=fixture.CONCLUDED_AT),\n            response_artifact=None,\n        )\n'''
          assert text.count(old) == 1, text.count(old)
          path.write_text(text.replace(old, new, 1))
          PY
          black tests/test_response_validator_phase_b.py
          pytest -q tests/test_response_validator_phase_b.py -k 'pr335_protected_worker_waits_for_validator_quiescence_and_resets_child_lock'
      - name: Commit and clean
        shell: bash
        run: |
          git rm .github/workflows/pr335-deadlock-test-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_response_validator_phase_b.py
          git diff --cached --check
          git commit -m "Fix protected-worker deadlock regression probe"
          git push origin HEAD:codex/issue-334-response-validator-phase-b
