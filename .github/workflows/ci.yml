name: CI

on:
  workflow_run:
    workflows:
      - Hunter / Pre-PR Preflight
    types:
      - completed
  push:
    branches:
      - main

permissions:
  # Reading the trusted exact-head branch preflight run record is what lets an
  # identical integration tree stand on proof that already exists instead of
  # re-running it. Read-only: this job publishes nothing.
  actions: read
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality Gates
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch != 'main'
    runs-on: ubuntu-latest
    # Quality Gates is the cheap merge-authority consumer. The feature-branch
    # Pre-PR workflow is the single full-suite producer for an immutable SHA.
    # This job must never run a second full repository suite or poll that producer.
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11.13"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements/ci-constraints.txt

      - name: Install project
        env:
          PIP_CONSTRAINT: requirements/ci-constraints.txt
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -c requirements/ci-constraints.txt -e ".[dev]"

      # One SHA -> one heavy validation. Pre-PR owns the full suite. Quality Gates
      # consumes only a completed exact-identity proof; it never races the producer
      # by starting another full suite. While the producer is active this check is
      # expected to be non-terminal and governance remains fail-closed.
      - name: Consume canonical exact-head validation proof
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_HEAD_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          VALIDATION_EVENT_NAME: ${{ github.event_name == 'workflow_run' && 'pull_request' || github.event_name }}
        run: python scripts/hunter_validation_reuse.py --require-proof --event-name "${VALIDATION_EVENT_NAME}"
