name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality Gates
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    # PR-attached required check. It never owns the feature-branch full suite;
    # Hunter / Pre-PR Preflight is the single heavy producer for that SHA.
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11.13"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements/ci-constraints.txt

      - name: Install project
        env:
          PIP_CONSTRAINT: requirements/ci-constraints.txt
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --only-binary :all: -c requirements/ci-constraints.txt -e ".[dev]"

      # Cheap PR-attached hygiene only. The exact-head heavy authority is
      # Hunter Pre-PR Preflight itself; this job must never race or duplicate it.
      - name: Verify CI wiring
        run: python -m compileall -q scripts src

  main-validation:
    name: Main Validation
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11.13"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements/ci-constraints.txt
      - name: Install project
        env:
          PIP_CONSTRAINT: requirements/ci-constraints.txt
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --only-binary :all: -c requirements/ci-constraints.txt -e ".[dev]"
      - name: Validate integrated main tree
        env:
          PYTEST_ADDOPTS: -n auto --dist loadfile
        run: python scripts/hunter_pr_preflight.py --mode normal
