name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  # Reading the trusted exact-head branch preflight run record is what lets an
  # identical integration tree stand on proof that already exists instead of
  # re-running it. Read-only: this job publishes nothing.
  actions: read
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality Gates
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    # PR-attached required check. It never owns the feature-branch full suite;
    # Hunter / Pre-PR Preflight is the single heavy producer for that SHA.
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11.13"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements/ci-constraints.txt

      - name: Install project
        env:
          PIP_CONSTRAINT: requirements/ci-constraints.txt
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -c requirements/ci-constraints.txt -e ".[dev]"

      # Proof-only PR consumer. This remains attached to the candidate SHA, but
      # never races the branch producer with a second full suite. If proof has
      # not completed yet, the required check fails closed; the completed branch
      # preflight is the canonical evidence consumed by merge readiness.
      - name: Consume canonical exact-head validation proof
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python scripts/hunter_validation_reuse.py --require-proof

  main-validation:
    name: Main Validation
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11.13"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements/ci-constraints.txt
      - name: Install project
        env:
          PIP_CONSTRAINT: requirements/ci-constraints.txt
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -c requirements/ci-constraints.txt -e ".[dev]"
      - name: Validate integrated main tree
        env:
          PYTEST_ADDOPTS: -n auto --dist loadfile
        run: python scripts/hunter_pr_preflight.py --mode normal
