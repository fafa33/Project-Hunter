name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  # Reading the trusted exact-head branch preflight run record is what lets an
  # identical integration tree stand on proof that already exists instead of
  # re-running it. Read-only: this job publishes nothing.
  actions: read
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality Gates
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11.13"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements/ci-constraints.txt

      - name: Install project
        env:
          PIP_CONSTRAINT: requirements/ci-constraints.txt
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -c requirements/ci-constraints.txt -e ".[dev]"

      # Issue #415: when the tree GitHub would merge is byte-for-byte the tree the
      # trusted exact-head branch preflight already validated, re-running the
      # identical suite establishes nothing. Anything else -- a divergent
      # integration tree, a missing or unsuccessful trusted run, unavailable
      # evidence -- falls back to the full lane below.
      - name: Resolve exact-identity validation reuse
        id: validation-reuse
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python scripts/hunter_validation_reuse.py

      - name: Run shared deterministic preflight
        if: steps.validation-reuse.outputs.reusable != 'true'
        env:
          # Issue #415: the full repository suite is this pipeline's long pole,
          # so the boundaries that own it run it in parallel. `loadfile` keeps
          # every test in a file on one worker, so intra-file ordering and
          # module-scoped state behave exactly as they do serially and only
          # whole files run concurrently. Measured on 4 vCPU over 3,628 tests:
          # 416s serial, 126s parallel.
          PYTEST_ADDOPTS: -n auto --dist loadfile
        run: python scripts/hunter_pr_preflight.py --mode normal
