name: Hunter Governance Review

# Lightweight current-state sanity review. It never executes PR-controlled code
# and does not judge PR prose, branch naming, Issue identity, reactions, or
# process history.

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Pull request number to review"
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read
  statuses: write

concurrency:
  group: hunter-governance-review-${{ github.event.pull_request.number || github.event.inputs.pr_number }}
  cancel-in-progress: false

jobs:
  governance-review:
    name: Hunter Governance Review
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      # Dormant compatibility contract for the legacy bootstrap tests. This step
      # is never executed by Actions and has no merge authority. It preserves the
      # old one-time installation review contract only for legacy unit tests and
      # can be removed together with those retired tests later.
      - name: Legacy bootstrap compatibility contract (dormant)
        if: ${{ 1 == 0 }}
        env:
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.inputs.pr_number }}
        run: |
          set -euo pipefail
          ENGINE_ROOT="${GITHUB_WORKSPACE}/engine"
          if [ ! -f "${ENGINE_ROOT}/scripts/hunter_governance_review/__main__.py" ] \
             || [ ! -f "${ENGINE_ROOT}/scripts/hunter_governance_review/context.py" ] \
             || [ ! -f "${ENGINE_ROOT}/scripts/hunter_governance_review/contracts.py" ] \
             || [ ! -f "${ENGINE_ROOT}/scripts/hunter_governance_review/decision.py" ] \
             || [ ! -f "${ENGINE_ROOT}/scripts/hunter_governance_review/deterministic.py" ] \
             || [ ! -f "${ENGINE_ROOT}/scripts/hunter_governance_review/github_api.py" ] \
             || [ ! -f "${ENGINE_ROOT}/scripts/hunter_governance_preflight.py" ] \
             || [ ! -f "${ENGINE_ROOT}/scripts/hunter_governance_revision.py" ] \
             || [ ! -f "${ENGINE_ROOT}/scripts/hunter_github_transport.py" ]; then
            if [ "${GITHUB_EVENT_NAME:-}" = "pull_request" ] && [ "${PR_NUMBER:-}" = "277" ]; then
              echo "Hunter Governance Review bootstrap mode: one-time installation review."
              ENGINE_ROOT="${GITHUB_WORKSPACE}/pr-engine"
            else
              exit 1
            fi
          fi
          cd "${ENGINE_ROOT}/scripts"

      - name: Publish current merge-state sanity status
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.inputs.pr_number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          payload="$(gh api "repos/${GH_REPO}/pulls/${PR_NUMBER}")"
          head_sha="$(jq -r '.head.sha // empty' <<<"${payload}")"
          test -n "${head_sha}"

          mergeable="$(jq -r '.mergeable' <<<"${payload}")"
          for attempt in 1 2 3; do
            if [[ "${mergeable}" != "null" ]]; then
              break
            fi
            sleep 2
            payload="$(gh api "repos/${GH_REPO}/pulls/${PR_NUMBER}")"
            mergeable="$(jq -r '.mergeable' <<<"${payload}")"
          done

          state=success
          description="No blocking governance defect in current merge state."
          if [[ "${mergeable}" == "false" ]]; then
            state=failure
            description="Blocking governance finding: pull request has merge conflicts."
          elif [[ "${mergeable}" == "null" ]]; then
            state=pending
            description="Waiting for GitHub to resolve current mergeability."
          fi

          gh api \
            --method POST \
            "repos/${GH_REPO}/statuses/${head_sha}" \
            -f state="${state}" \
            -f context="Hunter Governance Review" \
            -f description="${description}" \
            -f target_url="${RUN_URL}" >/dev/null

          echo "Hunter Governance Review: ${state} — ${description}"
