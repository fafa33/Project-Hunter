name: Hunter Governance Review

# Lightweight exact-head sanity review. It does not judge PR prose, branch
# naming, Issue identity, reactions, or process history. Real code/security
# authority remains with CI, dependency review, CodeQL, and GitHub reviews.

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Pull request number to review"
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read
  statuses: write

concurrency:
  group: hunter-governance-review-${{ github.event.pull_request.number || github.event.inputs.pr_number }}
  cancel-in-progress: false

jobs:
  governance-review:
    name: Hunter Governance Review
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout trusted gate engine
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Publish lightweight governance sanity status
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.inputs.pr_number }}
        run: |
          python scripts/hunter_governance_review_v2.py \
            --pr "${PR_NUMBER}" \
            --repository "${GITHUB_REPOSITORY}"
