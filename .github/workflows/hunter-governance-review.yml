name: Hunter Governance Review

# Mandatory fail-closed merge gate for pull requests targeting protected
# branches. See docs/HUNTER_GOVERNANCE_REVIEW.md.
#
# Security notes:
# - Uses the plain `pull_request` event (never `pull_request_target`).
# - The gate engine is checked out from the DEFAULT branch only; code from the
#   pull request under review is never checked out or executed.
# - The engine reads PR metadata, changed files, and the diff via the GitHub
#   API and publishes exactly one commit status check: "Hunter Governance Review".
# - Minimal permissions: contents read, pull-requests read, statuses write.
#   The gate never writes PR comments and never runs untrusted code.
#
# Bootstrap exception: until the gate engine exists on the default branch (the
# installation PR has not merged yet), the engine is materialized from the PR
# head so the required status check can publish during installation validation.
# Once the installation PR merges, the default branch owns the engine and this
# fallback never activates.
#
# The workflow step succeeding means only "the gate ran and reported". The
# merge authority is the published status check, which is FAILURE for
# CHANGES_REQUIRED and REVIEW_FAILED and SUCCESS only for APPROVED.

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
      - converted_to_draft
      - edited
      - review_requested
      - review_request_removed
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Pull request number to review"
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read
  statuses: write

concurrency:
  group: hunter-governance-review-${{ github.event.pull_request.number || github.event.inputs.pr_number }}
  cancel-in-progress: true

jobs:
  governance-review:
    name: Hunter Governance Review
    runs-on: ubuntu-latest
    # Proven cause of a real cancellation (PR #200, run 31175014693, head
    # bf44c7d): a large diff (792 chunks after fixing the two OpenAI
    # request-shape incompatibilities that were previously failing fast)
    # ran the full 30 minutes with no error before GitHub's own job timeout
    # killed it ("Terminate orphan process ... (python)") -- not a hang,
    # not a provider failure, not a code defect; the sequential per-chunk
    # review genuinely needed more wall-clock time than 30 minutes allowed.
    # 120 is a bounded, evidence-informed increase (GitHub-hosted runners
    # support up to 360 minutes) -- generous headroom for ordinary PRs,
    # which have far fewer chunks than this gate's own unusually large
    # self-installation diff, without being unbounded.
    timeout-minutes: 120

    steps:
      - name: Checkout trusted gate engine (default branch)
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          path: engine
          ref: ${{ github.event.repository.default_branch }}

      - name: Checkout PR engine (bootstrap fallback)
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          path: pr-engine
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      # Durable chunk-level checkpoint (see scripts/hunter_governance_review/
      # checkpoint.py): a large PR's diff can take more provider-call budget
      # (rate limits, quota, credits) than one run has available. Every chunk
      # this run completes is written to CHECKPOINT_DIR immediately; this
      # cache step is what makes that durable ACROSS separate workflow runs
      # (a fresh container each time), not merely within one run. The cache
      # key is scoped to this PR/head -- it is intentionally unique per run
      # attempt (suffixed with run id/attempt) so the automatic post-job
      # save step below always uploads this run's updated progress; the
      # `restore-keys` prefix match is what finds the most recent prior
      # attempt's checkpoint for the SAME pull request/head to resume from.
      # Base SHA is deliberately NOT part of this key: github.event.pull_
      # request.base.sha is only populated for pull_request-triggered runs,
      # not workflow_dispatch (a manual rerun would otherwise always miss
      # the cache another trigger type populated, permanently losing resume
      # for that path -- confirmed live). The engine itself (checkpoint.py)
      # independently re-verifies repository, PR number, head SHA, base SHA,
      # PR title/body, and a review-semantics version before trusting
      # anything restored here, so an imprecise or stale cache hit here can
      # only ever cost a wasted restore, never an incorrect verdict.
      - name: Restore/save Hunter Governance Review chunk checkpoint
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ github.workspace }}/.hunter_governance_checkpoint
          key: >-
            hunter-gov-checkpoint-v1-${{ github.event.pull_request.number || github.event.inputs.pr_number }}-${{
            github.event.pull_request.head.sha || github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            hunter-gov-checkpoint-v1-${{ github.event.pull_request.number || github.event.inputs.pr_number }}-${{ github.event.pull_request.head.sha || github.sha }}-

      - name: Run Hunter Governance Review
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.inputs.pr_number }}
          HUNTER_GOVERNANCE_CHECKPOINT_PATH: ${{ github.workspace }}/.hunter_governance_checkpoint/checkpoint.json
          # Provider-neutral, generic configuration -- no vendor is
          # hardcoded here or in the engine. GROQ_API_KEY / OPENAI_API_KEY
          # are deliberately NOT read: Groq was disqualified from this
          # merge-critical review path after repeated live-run evidence
          # that a single Groq on-demand account's rate/quota limits could
          # not reliably complete this repository's real review workload
          # (see docs/HUNTER_GOVERNANCE_REVIEW.md). Configure at least one
          # of the three provider slots below (all three of its variables)
          # as repository secrets/variables; configure a second slot with a
          # genuinely independent provider/account for failover.
          HUNTER_LLM_API_KEY: ${{ secrets.HUNTER_LLM_API_KEY }}
          HUNTER_LLM_BASE_URL: ${{ vars.HUNTER_LLM_BASE_URL }}
          HUNTER_LLM_MODEL: ${{ vars.HUNTER_LLM_MODEL }}
          HUNTER_LLM_API_KEY_2: ${{ secrets.HUNTER_LLM_API_KEY_2 }}
          HUNTER_LLM_BASE_URL_2: ${{ vars.HUNTER_LLM_BASE_URL_2 }}
          HUNTER_LLM_MODEL_2: ${{ vars.HUNTER_LLM_MODEL_2 }}
          HUNTER_LLM_API_KEY_3: ${{ secrets.HUNTER_LLM_API_KEY_3 }}
          HUNTER_LLM_BASE_URL_3: ${{ vars.HUNTER_LLM_BASE_URL_3 }}
          HUNTER_LLM_MODEL_3: ${{ vars.HUNTER_LLM_MODEL_3 }}
          HUNTER_LLM_PROMPT_TOKEN_BUDGET: ${{ vars.HUNTER_LLM_PROMPT_TOKEN_BUDGET }}
          HUNTER_LLM_MAX_COMPLETION_TOKENS: ${{ vars.HUNTER_LLM_MAX_COMPLETION_TOKENS }}
          HUNTER_GOVERNANCE_PROTECTED_BRANCHES: ${{ vars.HUNTER_GOVERNANCE_PROTECTED_BRANCHES }}
        run: |
          set -euo pipefail
          ENGINE_ROOT="${GITHUB_WORKSPACE}/engine"
          if [ ! -f "${ENGINE_ROOT}/scripts/hunter_governance_review/__main__.py" ]; then
            echo "::warning::Hunter Governance Review bootstrap mode: the gate engine is not yet on the default branch."
            echo "::warning::Running the engine from the PR head for this one-time installation review."
            ENGINE_ROOT="${GITHUB_WORKSPACE}/pr-engine"
          fi
          cd "${ENGINE_ROOT}/scripts"
          python -m hunter_governance_review \
            --pr "${PR_NUMBER}" \
            --repository "${GITHUB_REPOSITORY}" \
            --root "${GITHUB_WORKSPACE}/engine"
