name: Hunter Governance Review

# Lightweight current-state sanity review. It never judges PR prose, branch
# naming, Issue identity, reactions, or process history.

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Pull request number to review"
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read
  statuses: write

concurrency:
  group: hunter-governance-review-${{ github.event.pull_request.number || github.event.inputs.pr_number }}
  cancel-in-progress: false

jobs:
  governance-review:
    name: Hunter Governance Review
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout trusted controller
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: engine
          persist-credentials: false

      # One-time self-hosting bridge for this installation PR only. Once #283 is
      # merged, main owns the v2 controller and this fallback is unreachable.
      - name: Checkout installation controller
        if: >-
          ${{ github.event_name == 'pull_request'
              && github.event.pull_request.number == 283
              && github.event.pull_request.head.repo.full_name == github.repository
              && github.event.pull_request.user.login == github.repository_owner }}
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: installation-engine
          persist-credentials: false

      - name: Publish current merge-state sanity status
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.inputs.pr_number }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
        run: |
          set -euo pipefail

          ENGINE_ROOT="${GITHUB_WORKSPACE}/engine"
          if [ ! -f "${ENGINE_ROOT}/scripts/hunter_governance_review_v2.py" ]; then
            if [ "${GITHUB_EVENT_NAME}" = "pull_request" ] \
               && [ "${PR_NUMBER}" = "283" ] \
               && [ -f "${GITHUB_WORKSPACE}/installation-engine/scripts/hunter_governance_review_v2.py" ]; then
              echo "Using the one-time #283 installation controller."
              ENGINE_ROOT="${GITHUB_WORKSPACE}/installation-engine"
            else
              echo "Trusted Hunter Governance Review v2 controller is unavailable."
              exit 1
            fi
          fi

          python "${ENGINE_ROOT}/scripts/hunter_governance_review_v2.py" \
            --pr "${PR_NUMBER}" \
            --repository "${GH_REPO}"
