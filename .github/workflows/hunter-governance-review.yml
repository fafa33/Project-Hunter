name: Hunter Governance Review

# Lightweight current-state sanity review. It never executes PR-controlled code
# and does not judge PR prose, branch naming, Issue identity, reactions, or
# process history.

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Pull request number to review"
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read
  statuses: write

concurrency:
  group: hunter-governance-review-${{ github.event.pull_request.number || github.event.inputs.pr_number }}
  cancel-in-progress: false

jobs:
  governance-review:
    name: Hunter Governance Review
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Publish current merge-state sanity status
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.inputs.pr_number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          payload="$(gh api "repos/${GH_REPO}/pulls/${PR_NUMBER}")"
          head_sha="$(jq -r '.head.sha // empty' <<<"${payload}")"
          test -n "${head_sha}"

          mergeable="$(jq -r '.mergeable' <<<"${payload}")"
          for attempt in 1 2 3; do
            if [[ "${mergeable}" != "null" ]]; then
              break
            fi
            sleep 2
            payload="$(gh api "repos/${GH_REPO}/pulls/${PR_NUMBER}")"
            mergeable="$(jq -r '.mergeable' <<<"${payload}")"
          done

          state=success
          description="No blocking governance defect in current merge state."
          if [[ "${mergeable}" == "false" ]]; then
            state=failure
            description="Blocking governance finding: pull request has merge conflicts."
          elif [[ "${mergeable}" == "null" ]]; then
            state=pending
            description="Waiting for GitHub to resolve current mergeability."
          fi

          gh api \
            --method POST \
            "repos/${GH_REPO}/statuses/${head_sha}" \
            -f state="${state}" \
            -f context="Hunter Governance Review" \
            -f description="${description}" \
            -f target_url="${RUN_URL}" >/dev/null

          echo "Hunter Governance Review: ${state} — ${description}"
