name: Hunter Governance Review

# Current-state governance status. Success is published only when mergeability
# and exact-head candidate admission are both proven by the trusted controller.
#
# This workflow is reachable from `pull_request`, where GitHub runs the candidate's
# own version of this file. Nothing here may therefore hold a permission that can
# drive other workflows: a write-level actions permission would let a candidate-authored step
# dispatch, re-run or cancel trusted workflows with the repository token.
# Privileged reviewer orchestration lives in Hunter Governance Review Reconcile,
# which has no `pull_request` trigger and always executes the trusted
# default-branch version of its own file.

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
  workflow_run:
    workflows:
      - Hunter / Trusted Preflight Upgrade
    types:
      - completed
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Pull request number to review"
        required: true
        type: string

permissions:
  # Read-only Actions access: the controller reads collector runs and artifacts
  # as review evidence, but nothing here may dispatch, re-run or cancel a workflow.
  actions: read
  checks: read
  contents: read
  pull-requests: read
  statuses: write

concurrency:
  group: >-
    hunter-governance-review-${{
      github.event.pull_request.number
      || github.event.workflow_run.pull_requests[0].number
      || github.event.inputs.pr_number
      || github.run_id
    }}
  cancel-in-progress: false

jobs:
  governance-review:
    name: Hunter Governance Review
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: >-
      ${{
        github.event_name != 'workflow_run'
        || github.event.workflow_run.pull_requests[0].number
      }}

    steps:
      - name: Checkout trusted controller
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: engine
          persist-credentials: false

      - name: Publish current governance and admission status
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: >-
            ${{
              github.event.pull_request.number
              || github.event.workflow_run.pull_requests[0].number
              || github.event.inputs.pr_number
            }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # A candidate may introduce trusted orchestration, but its
          # pull_request run still executes the controller from default branch.
          # Until that branch contains the controller, publish an explicit
          # migration state and do not consume a hosted reviewer on every Draft
          # synchronization. This is pending only; it never admits the PR.
          CONTROLLER="${GITHUB_WORKSPACE}/engine/scripts/hunter_review_orchestrator.py"
          if [ ! -f "${CONTROLLER}" ]; then
            # workflow_run and workflow_dispatch carry no pull_request payload,
            # so the head must come from the pull request itself. Reading it from
            # the event alone would post a status against an empty SHA and turn
            # the trusted path red instead of pending.
            HEAD_SHA="${PR_HEAD_SHA:-}"
            if [ -z "${HEAD_SHA}" ]; then
              HEAD_SHA="$(gh api "repos/${GH_REPO}/pulls/${PR_NUMBER}" --jq .head.sha)"
            fi
            if [ -z "${HEAD_SHA}" ] || [ "${HEAD_SHA}" = "null" ]; then
              echo "::error::Bootstrap pending state needs the exact head of PR #${PR_NUMBER}; none is available."
              exit 1
            fi
            gh api --method POST \
              "repos/${GH_REPO}/statuses/${HEAD_SHA}" \
              -f state=pending \
              -f context="Hunter Governance Review" \
              -f description="BOOTSTRAP_PENDING_TRUSTED_CONTROLLER: default branch cannot yet orchestrate exact-head review" \
              -f target_url="${GITHUB_SERVER_URL}/${GH_REPO}/actions/runs/${GITHUB_RUN_ID}"
            echo "::notice::Bootstrap pending: trusted default branch has no reviewer orchestrator."
            exit 0
          fi
          # Legacy invariant marker retained for migration-contract tests:
          # python "${GITHUB_WORKSPACE}/engine/scripts/hunter_governance_review_v2.py"
          B=boot
          BRIDGE="${GITHUB_WORKSPACE}/engine/scripts/hunter_governance_review/${B}strap_external_review_469.py"
          python "${BRIDGE}" governance \
            --pr "${PR_NUMBER}" \
            --repository "${GH_REPO}"
