name: Hunter Governance Review

# Current-state governance status. Success is published only when mergeability
# and exact-head candidate admission are both proven by the trusted controller.

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
  workflow_run:
    workflows:
      - Hunter / Trusted Preflight Upgrade
    types:
      - completed
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Pull request number to review"
        required: true
        type: string

permissions:
  actions: read
  contents: read
  pull-requests: read
  statuses: write

concurrency:
  group: >-
    hunter-governance-review-${{
      github.event.pull_request.number
      || github.event.workflow_run.pull_requests[0].number
      || github.event.inputs.pr_number
      || github.run_id
    }}
  cancel-in-progress: false

jobs:
  governance-review:
    name: Hunter Governance Review
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: >-
      ${{
        github.event_name != 'workflow_run'
        || github.event.workflow_run.pull_requests[0].number
      }}

    steps:
      - name: Checkout trusted controller
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: engine
          persist-credentials: false

      - name: Publish current governance and admission status
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: >-
            ${{
              github.event.pull_request.number
              || github.event.workflow_run.pull_requests[0].number
              || github.event.inputs.pr_number
            }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
        run: |
          set -euo pipefail
          python "${GITHUB_WORKSPACE}/engine/scripts/hunter_governance_review_v2.py" \
            --pr "${PR_NUMBER}" \
            --repository "${GH_REPO}"
