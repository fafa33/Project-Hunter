# Dependency Review Action
#
# This Action scans dependency manifest files changed by a pull request and
# surfaces known-vulnerable dependency additions.
#
# Source repository: https://github.com/actions/dependency-review-action
# Public documentation: https://docs.github.com/en/code-security/supply-chain-security/understanding-your-software-supply-chain/about-dependency-review#dependency-review-enforcement
#
# Note: the former "Adversarial AI Review" job in this file was removed. It was
# a comment-only, fail-open reviewer that silently skipped when the API key or
# API was unavailable. The mandatory hostile architecture audit is now the
# Hunter Governance Review gate (see .github/workflows/hunter-governance-review.yml
# and docs/HUNTER_GOVERNANCE_REVIEW.md), which is fail-closed and publishes the
# required "Hunter Governance Review" status check.
name: 'Dependency review'

on:
  pull_request:
    branches: ["main"]

permissions:
  contents: read
  pull-requests: write

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - name: 'Checkout repository'
        uses: actions/checkout@v7

      - name: 'Check Dependency Review availability'
        id: dep-review-supported
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${{ github.repository }}/dependency-graph/sbom" >/dev/null 2>&1; then
            echo "supported=true" >> "$GITHUB_OUTPUT"
            echo "Dependency Review is supported on this repository; running the scan."
          else
            echo "supported=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Dependency Review is not supported on this repository (Dependency graph is not enabled). Skipping the dependency review scan."
          fi

      - name: 'Dependency Review'
        if: steps.dep-review-supported.outputs.supported == 'true'
        uses: actions/dependency-review-action@v4
        with:
          comment-summary-in-pr: always
