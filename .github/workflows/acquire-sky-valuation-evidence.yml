name: "Acquire Sky valuation-evidence disclosure (Issue #107 Requirement 9)"

# ──────────────────────────────────────────────────────────────────────────────
# ONE-SHOT DIAGNOSTIC WORKFLOW — NOT PRODUCTION ARCHITECTURE
#
# Purpose: determine, from a GitHub-hosted runner with open outbound egress,
# whether the authorized, already-registered `sky-protocol-tokenomics-disclosure`
# source (configs/value_capture_sources.yaml, host developers.sky.money) is
# reachable, and archive its raw disclosed content -- raw HTML, raw HTTP
# response headers, content hashes, and a purely mechanical (non-interpretive)
# field scan -- for a human operator to review. This exists only because the
# interactive agent environment's outbound proxy denies CONNECT to
# developers.sky.money (confirmed via repeated `curl`/WebFetch failures and the
# proxy's own `/__agentproxy/status` log, which records explicit
# `connect_rejected` / policy-denial entries for that host, and confirmed to be
# a comprehensive, host-agnostic denial rather than a Sky-specific block by
# testing a second already-registered source, ethereum.publicnode.com, which
# fails identically) -- the same class of limitation Milestone 1's
# SupplyBasisSnapshot acquisition hit for CoinGecko.
#
# Deliberate scope limit -- read before extending this workflow:
#
#   `hunter.value_capture`'s `evidence`/`rule` acquisition path
#   (src/hunter/valuation_evidence/command.py `_acquire_value_capture`) takes its
#   `payload` verbatim from an operator-authored manifest. Unlike `market_facts`
#   (which has a real, already-audited `CoinGeckoObservedMarketFactProvider`
#   automated JSON-fetching provider), there is no existing automated
#   fetch-and-parse implementation anywhere in this codebase for
#   `official_disclosure` evidence/rule content -- this is deliberate:
#   `FundamentalEvidenceRecord.amount` / `ValueCaptureRuleSnapshot.rate_or_proportion`
#   are operator-attested by design (see scripts/acquire_sky_supply_basis.py's own
#   docstring precedent for the equivalent, already-solved `supply` leg, which
#   works only because a real provider already exists to invoke).
#
#   Determining whether developers.sky.money discloses "one single, attributable,
#   exact-365-day accounting period" with "one compatible disclosed rate,"
#   as opposed to a governance-rate-changed period, a third-party calendar-year
#   aggregate, or an annualized run-rate, requires interpreting prose disclosure
#   content -- there is no existing canonical parser to invoke for this, and
#   writing one here would be exactly the kind of new parsing/evidence-semantic
#   introduction that requires stopping for architecture review first, not a
#   one-shot operational workflow.
#
#   `scripts/diagnostic_parse_sky_disclosure.py`, invoked below, is NOT that
#   canonical parser. It performs a purely mechanical pattern scan (percentage-,
#   currency-amount-, and date/period-like substrings with surrounding context)
#   and explicitly records "NONE FOUND" when nothing matches. It asserts no
#   ADR 0022 conclusion and is not registered with, or invoked by, any
#   `hunter.value_capture` production path.
#
#   This workflow therefore does NOT attempt automated compatibility
#   extraction, does NOT construct a manifest, and does NOT invoke
#   `hunter valuation-evidence acquire` for evidence/rule. It only:
#     1. verifies reachability of the registered source from open-egress infra;
#     2. archives the raw disclosed page content, raw HTTP response headers,
#        and content hashes, unmodified, as diagnostic artifacts;
#     3. runs the non-interpretive mechanical field scan described above and
#        archives its output (including explicit "NONE FOUND" results);
#     4. re-runs the existing Requirement 9 test suite as an environment-health
#        baseline (no new tests, no new evidence).
#   If a human operator, reading the artifacts, determines a genuinely
#   compatible single-rate/exact-365-day disclosure exists, they must author a
#   manifest by hand -- exactly how Milestone 1's evidence/rule legs were
#   originally acquired -- and run the existing, unmodified
#   `hunter valuation-evidence acquire` CLI directly. This workflow does not do
#   that step for them.
#
# Signing key lifecycle: HUNTER_VALUE_CAPTURE_SIGNING_KEY_ID/KEY are wired below
# for forward-compatibility with a future, explicitly-authorized acquisition
# step, but this diagnostic run does not sign or persist anything with them.
# ──────────────────────────────────────────────────────────────────────────────

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: acquire-sky-valuation-evidence
  cancel-in-progress: false

jobs:
  diagnose:
    name: "Diagnose Sky valuation-evidence disclosure reachability"
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout main
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11.13"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements/ci-constraints.txt

      - name: Install project
        env:
          PIP_CONSTRAINT: requirements/ci-constraints.txt
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -c requirements/ci-constraints.txt -e ".[dev]"

      - name: Verify required secrets are configured (values never printed)
        env:
          HUNTER_VALUE_CAPTURE_SIGNING_KEY_ID: ${{ secrets.HUNTER_VALUE_CAPTURE_SIGNING_KEY_ID }}
          HUNTER_VALUE_CAPTURE_SIGNING_KEY: ${{ secrets.HUNTER_VALUE_CAPTURE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${HUNTER_VALUE_CAPTURE_SIGNING_KEY_ID}" ]; then
            echo "::error::HUNTER_VALUE_CAPTURE_SIGNING_KEY_ID secret is empty or missing"
            exit 1
          fi
          if [ -z "${HUNTER_VALUE_CAPTURE_SIGNING_KEY}" ]; then
            echo "::error::HUNTER_VALUE_CAPTURE_SIGNING_KEY secret is empty or missing"
            exit 1
          fi
          echo "Both signing secrets are present (lengths only, no values): " \
            "key_id_len=${#HUNTER_VALUE_CAPTURE_SIGNING_KEY_ID} key_len=${#HUNTER_VALUE_CAPTURE_SIGNING_KEY}"

      - name: Verify outbound reachability of the registered Sky source
        id: reachability
        run: |
          set -euo pipefail
          url="https://developers.sky.money/core-protocol/smart-burn-engine/"
          status=$(curl -sS -o /dev/null -w "%{http_code}" "$url" || echo "000")
          echo "status=$status" >> "$GITHUB_OUTPUT"
          echo "HTTP status for $url: $status"
          if [ "$status" = "000" ]; then
            echo "::error::Could not establish a connection to developers.sky.money (network/DNS/TLS failure)"
            exit 1
          fi

      - name: Archive raw disclosure content, response headers, and hashes (no parsing/extraction)
        if: steps.reachability.outputs.status == '200'
        run: |
          set -euo pipefail
          mkdir -p diagnostic
          url="https://developers.sky.money/core-protocol/smart-burn-engine/"
          curl -sS -D diagnostic/sky-smart-burn-engine-response-headers.txt \
            "$url" -o diagnostic/sky-smart-burn-engine-raw.html
          sha256sum diagnostic/sky-smart-burn-engine-raw.html > diagnostic/sky-smart-burn-engine-raw.html.sha256
          {
            echo "Fetched at (UTC): $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "Source URL: $url"
            echo "Registered source_id: sky-protocol-tokenomics-disclosure (configs/value_capture_sources.yaml)"
            echo "Bytes fetched: $(wc -c < diagnostic/sky-smart-burn-engine-raw.html)"
            echo "SHA-256: $(cut -d' ' -f1 diagnostic/sky-smart-burn-engine-raw.html.sha256)"
          } > diagnostic/fetch-metadata.txt
          cat diagnostic/fetch-metadata.txt

      - name: Run non-interpretive mechanical field scan (pure evidence, no judgment)
        if: steps.reachability.outputs.status == '200'
        run: |
          set -euo pipefail
          python3 scripts/diagnostic_parse_sky_disclosure.py \
            diagnostic/sky-smart-burn-engine-raw.html \
            diagnostic/sky-smart-burn-engine-field-scan.json

      - name: Confirm existing real-evidence chain is still strict-known-readable (unmodified)
        env:
          HUNTER_APPLICATION_ROOT: ${{ github.workspace }}
        run: |
          set -euo pipefail
          mkdir -p diagnostic
          pytest tests/test_valuation_real_evidence_v1.py tests/test_valuation_v1.py \
            tests/test_valuation_methodology_v1.py tests/test_valuation_calibration_v1.py \
            -v 2>&1 | tee diagnostic/requirement-9-baseline-tests.log

      - name: Confirm the real database was not modified by this diagnostic run
        run: |
          set -euo pipefail
          git status --porcelain data/data_ops.sqlite > diagnostic/data-ops-sqlite-status.txt
          if [ -s diagnostic/data-ops-sqlite-status.txt ]; then
            echo "::error::data/data_ops.sqlite was modified by this diagnostic run -- this must never happen"
            cat diagnostic/data-ops-sqlite-status.txt
            exit 1
          fi
          echo "data/data_ops.sqlite: no changes (diagnostic run is read-only for canonical data)." > diagnostic/data-ops-sqlite-status.txt

      - name: Write job summary (no secrets, no fabricated conclusions)
        if: always()
        run: |
          {
            echo "## Sky valuation-evidence disclosure diagnostic"
            echo ""
            echo "- Source reachability HTTP status: \`${{ steps.reachability.outputs.status }}\`"
            echo "- Raw disclosure, response headers, and hashes: see uploaded \`sky-valuation-evidence-diagnostic\` artifact"
            echo "- Mechanical field scan (no interpretation): \`sky-smart-burn-engine-field-scan.json\` in the artifact"
            echo "- Requirement 9 baseline tests: see \`requirement-9-baseline-tests.log\` in the artifact"
            echo "- \`data/data_ops.sqlite\`: unmodified by this run"
            echo ""
            echo "### This workflow does not auto-acquire or auto-persist evidence"
            echo ""
            echo "Automated determination of whether the fetched disclosure contains one"
            echo "single, attributable, exact-365-day accounting period with one compatible"
            echo "disclosed rate (as opposed to a governance-rate-changed period, a"
            echo "third-party calendar-year aggregate, or an inferred annualization) requires"
            echo "interpreting prose content. The mechanical field scan above locates candidate"
            echo "percentage/amount/date substrings only -- it does not decide compatibility."
            echo "No existing canonical parser performs that determination for"
            echo "\`official_disclosure\` evidence/rule content, and writing one here would be a"
            echo "new architectural decision outside this workflow's authorized scope."
            echo ""
            echo "A human operator must read the captured artifacts, and if a genuinely"
            echo "compatible single-rate/exact-365-day disclosure is present, author a"
            echo "manifest by hand and run \`hunter valuation-evidence acquire\` directly --"
            echo "exactly how Milestone 1's evidence/rule legs were originally acquired."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload diagnostic artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sky-valuation-evidence-diagnostic
          path: diagnostic/
          retention-days: 14
