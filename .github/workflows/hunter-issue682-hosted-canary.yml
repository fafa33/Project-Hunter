name: Hunter / Issue 682 Hosted Kilo Trusted Canary
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/hunter-issue682-hosted-canary.yml'
      - 'src/hunter/automation/issue_agent_kilo_container.py'
      - 'src/hunter/automation/issue_agent_roles.py'
      - 'src/hunter/automation/issue_agent_governed_shell.py'
      - 'tests/test_issue_agent_broker_hosted.py'
      - 'tests/test_issue_agent_canary_proof.py'
      - 'tests/test_issue_agent_kilo_signed_e2e.py'
      - 'scripts/issue_agent/**'
  workflow_dispatch:
    inputs:
      canary:
        description: 'Explicitly authorize credential-free Kilo-to-Trusted-Validator canary'
        required: true
        type: choice
        options: [run]
permissions: {}
concurrency:
  group: hunter-682-canary-${{ github.ref }}
  cancel-in-progress: false
jobs:
  signed-kilo-canary:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
       && github.actor == github.repository_owner && inputs.canary == 'run')
      || (github.event_name == 'pull_request'
          && github.event.pull_request.head.repo.full_name == github.repository
          && github.event.pull_request.head.ref == 'issue-682-hosted-canary'
          && github.actor == github.repository_owner)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read  # read-only: lets the trusted verification step resolve the authoritative numeric job id
    steps:
      - name: Checkout exact head without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.11.13'
      - name: Install pinned project dependencies
        run: |
          set -euo pipefail
          python -m pip install --only-binary ':all:' -c requirements/ci-constraints.txt . pytest
      - name: Provision existing isolated Kilo and broker images
        run: |
          set -euo pipefail
          docker build --pull -f scripts/issue_agent/Dockerfile.kilo-canary -t hunter-682-kilo-canary:local .
          docker build --pull -f scripts/issue_agent/Dockerfile.broker-canary -t hunter-682-broker-canary:local .
          docker pull python@sha256:78387bc3881b8273120a12ebe6c1ab22b018ccc2c9adf565ae1ac9b536e184ea
      - name: Model-free broker boundary (git inspection, timeout, memory, process enforcement)
        env:
          HUNTER_RUN_REAL_BROKER_E2E: '1'
        run: |
          set -euo pipefail
          python -m pytest -q -s --tb=short tests/test_issue_agent_broker_hosted.py
      - name: Real isolated Kilo repair and independent signed Trusted Validator
        env:
          HUNTER_RUN_REAL_KILO_E2E: '1'
        run: |
          set -euo pipefail
          python -m pytest -q -s --tb=short tests/test_issue_agent_kilo_signed_e2e.py | tee "$RUNNER_TEMP/kilo-e2e.log"
      - name: Bind the proof to the authoritative GitHub job identity
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python scripts/issue_agent/verify_canary_proof.py "$RUNNER_TEMP/kilo-e2e.log"
      - name: Verify no secrets or repository writes were granted
        run: |
          test "${{ github.event_name }}" != 'workflow_dispatch' || test "${{ github.ref }}" = 'refs/heads/main'
          echo 'CANARY_ONLY: no signing secrets, publication credentials, or write permissions'
