name: PR335 self heal

on:
  push:
    branches:
      - codex/issue-334-response-validator-phase-b

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: codex/issue-334-response-validator-phase-b
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11.13'
      - name: Install project
        run: python -m pip install --disable-pip-version-check -c requirements/ci-constraints.txt -e '.[dev]'
      - name: Format current Phase B changes
        run: |
          black src/hunter/evidence_intelligence/response_validator.py \
                src/hunter/evidence_intelligence/response_validator_persistence.py \
                tests/test_response_validator_phase_b.py
      - name: Remove temporary workflow and commit
        run: |
          rm .github/workflows/pr335-self-heal.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/hunter/evidence_intelligence/response_validator.py \
                  src/hunter/evidence_intelligence/response_validator_persistence.py \
                  tests/test_response_validator_phase_b.py \
                  .github/workflows/pr335-self-heal.yml
          git commit -m 'Fix Phase B formatting gate'
          git push origin HEAD:codex/issue-334-response-validator-phase-b
