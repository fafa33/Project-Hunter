name: Temporary Black Format

on:
  push:
    branches:
      - codex/evidence-pre-model-foundation
    paths:
      - .github/workflows/temporary-black-format.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/evidence-pre-model-foundation
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Black
        run: python -m pip install 'black==24.10.0'
      - name: Format and remove temporary workflow
        run: |
          black src/hunter/evidence_intelligence/pre_model.py
          rm .github/workflows/temporary-black-format.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/hunter/evidence_intelligence/pre_model.py .github/workflows/temporary-black-format.yml
          git diff --cached --quiet && exit 0
          git commit -m 'style: format Evidence Intelligence pre-model'
          git push origin HEAD:codex/evidence-pre-model-foundation
