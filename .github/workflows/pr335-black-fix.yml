name: PR335 black fix

on:
  push:
    branches:
      - codex/issue-334-response-validator-phase-b
    paths:
      - .github/workflows/pr335-black-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: codex/issue-334-response-validator-phase-b
          fetch-depth: 0
      - name: Normalize test spacing
        run: python -c "from pathlib import Path; p=Path('tests/test_response_validator_phase_b.py'); s=p.read_text(); old='\n\n\ndef test_pr335_non_owner_refusal_preserves_reserved_transient_body'; assert s.count(old)==1; p.write_text(s.replace(old,'\n\ndef test_pr335_non_owner_refusal_preserves_reserved_transient_body',1))"
      - name: Commit and clean
        shell: bash
        run: |
          git rm .github/workflows/pr335-black-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_response_validator_phase_b.py
          git diff --cached --check
          git commit -m "Format PR 335 regression tests"
          git push origin HEAD:codex/issue-334-response-validator-phase-b
