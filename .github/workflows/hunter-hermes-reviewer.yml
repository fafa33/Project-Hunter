name: Hunter Hermes Reviewer
run-name: Hunter Reviewer ${{ inputs.correlation_id }}

on:
  workflow_dispatch:
    inputs:
      pr_number:
        required: true
        type: string
      head_sha:
        required: true
        type: string
      claims_id:
        required: true
        type: string
      correlation_id:
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read
  actions: read

concurrency:
  group: hunter-hermes-review-${{ inputs.pr_number }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: [self-hosted, macOS, hunter-reviewer]
    timeout-minutes: 10
    steps:
      - name: Checkout trusted default branch
        uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false
      - name: Run Hermes exact-head review
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ inputs.pr_number }}
          HEAD_SHA: ${{ inputs.head_sha }}
          CLAIMS_ID: ${{ inputs.claims_id }}
        run: |
          python3 scripts/hunter_hermes_reviewer.py \
            --repository "${REPOSITORY}" \
            --pr "${PR_NUMBER}" \
            --head-sha "${HEAD_SHA}" \
            --claims-id "${CLAIMS_ID}" \
            --output reviewer-result.json
      - name: Upload structured Hermes review
        uses: actions/upload-artifact@v4
        with:
          name: hunter-local-review-${{ inputs.pr_number }}-${{ inputs.head_sha }}
          path: reviewer-result.json
          if-no-files-found: error
          retention-days: 14
