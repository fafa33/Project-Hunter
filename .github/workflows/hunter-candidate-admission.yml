name: Hunter Candidate Admission

on:
  workflow_run:
    workflows:
      - Hunter / Pre-PR Preflight
      - Hunter / Trusted Preflight Upgrade
    types:
      - completed

permissions:
  checks: read
  statuses: read
  actions: read
  contents: read
  pull-requests: write

concurrency:
  group: hunter-candidate-admission-${{ github.event.pull_request.number || github.event.workflow_run.head_sha || github.run_id }}
  cancel-in-progress: true

jobs:
  candidate-admission:
    # Admission is a convergence consumer. It runs only after a trusted
    # proof-producing workflow completes, then re-reads exact-head state and
    # fails closed if that proof is missing, stale, or failed.
    if: >-
      github.event_name == 'workflow_run' &&
      (github.event.workflow_run.event == 'push' ||
       github.event.workflow_run.event == 'pull_request_target')
    name: Hunter Candidate Admission
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout trusted controller
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: engine
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11.13"

      # GITHUB_TOKEN cannot execute markPullRequestReadyForReview for this
      # repository (verified FORBIDDEN on PR #621). Use the already-provisioned
      # Hunter App identity for that mutation; never fall back to a
      # weaker/anonymous mutation. The installation only grants this App
      # pull-requests:write (requesting the other scopes 422s with
      # "permissions requested are not granted to this installation"), and
      # none of the read-only admission checks need the App identity anyway:
      # this job's own `permissions:` block already grants GITHUB_TOKEN
      # checks/statuses/actions/contents read, so reads stay on GITHUB_TOKEN
      # and only the two PR mutations use the narrower App token.
      - name: Mint Hunter App admission token
        id: admission-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.HUNTER_APP_ID }}
          private-key: ${{ secrets.HUNTER_APP_PRIVATE_KEY }}
          permission-pull-requests: write

      - name: Enforce exact-head review admission
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HUNTER_APP_MUTATION_TOKEN: ${{ steps.admission-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.workflow_run.head_sha }}
          DIRECT_PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          if [[ -n "${DIRECT_PR_NUMBER}" ]]; then
            PR_NUMBERS="${DIRECT_PR_NUMBER}"
          else
            PR_NUMBERS="$(
              cd "${GITHUB_WORKSPACE}/engine/scripts"
              python -c 'import hunter_merge_readiness_v2 as readiness; print("\n".join(str(number) for number in readiness.candidate_prs()))'
            )"
          fi

          if [[ -z "${PR_NUMBERS}" ]]; then
            echo "No open PR is associated with completed head ${EVENT_HEAD_SHA}; nothing to reconcile."
            exit 0
          fi

          # Legacy invariant marker retained for migration-contract tests: hunter_candidate_admission.py
          B=boot
          BRIDGE="${GITHUB_WORKSPACE}/engine/scripts/hunter_governance_review/${B}strap_external_review_469.py"
          while IFS= read -r PR_NUMBER; do
            [[ -n "${PR_NUMBER}" ]] || continue
            python "${BRIDGE}" candidate \
              --pr "${PR_NUMBER}" \
              --repository "${GH_REPO}" \
              --head-sha "${EVENT_HEAD_SHA}"
          done <<< "${PR_NUMBERS}"
