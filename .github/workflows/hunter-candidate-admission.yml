name: Hunter Candidate Admission

on:
  pull_request_target:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
  workflow_run:
    workflows:
      # Branch preflight completion is what makes an ordinary candidate
      # admissible. Trusted upgrade completion is what makes a candidate that
      # touches preflight-owned paths admissible: while that proof is running,
      # admission is pending, and a pending head is deliberately not returned to
      # Draft. Without this subscription nothing re-evaluates admission once the
      # proof lands, so a head marked Ready mid-proof could stay Ready while
      # still unadmitted -- contrary to unadmitted_head_state=draft.
      - Hunter / Pre-PR Preflight
      - Hunter / Trusted Preflight Upgrade
    types:
      - completed

permissions:
  actions: read
  contents: read
  pull-requests: write

concurrency:
  group: hunter-candidate-admission-${{ github.event.pull_request.number || github.event.workflow_run.head_sha || github.run_id }}
  cancel-in-progress: true

jobs:
  candidate-admission:
    if: >-
      github.event_name == 'pull_request_target' ||
      (github.event_name == 'workflow_run' &&
       (github.event.workflow_run.event == 'push' ||
        github.event.workflow_run.event == 'pull_request_target'))
    name: Hunter Candidate Admission
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout trusted controller
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: engine
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11.13"

      - name: Enforce exact-head review admission
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.workflow_run.head_sha }}
          DIRECT_PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          if [[ -n "${DIRECT_PR_NUMBER}" ]]; then
            PR_NUMBERS="${DIRECT_PR_NUMBER}"
          else
            PR_NUMBERS="$(
              cd "${GITHUB_WORKSPACE}/engine/scripts"
              python -c 'import hunter_merge_readiness_v2 as readiness; print("\n".join(str(number) for number in readiness.candidate_prs()))'
            )"
          fi

          if [[ -z "${PR_NUMBERS}" ]]; then
            echo "No open PR is associated with completed head ${EVENT_HEAD_SHA}; nothing to reconcile."
            exit 0
          fi

          while IFS= read -r PR_NUMBER; do
            [[ -n "${PR_NUMBER}" ]] || continue
            python "${GITHUB_WORKSPACE}/engine/scripts/hunter_candidate_admission.py" \
              --pr "${PR_NUMBER}" \
              --repository "${GH_REPO}" \
              --head-sha "${EVENT_HEAD_SHA}"
          done <<< "${PR_NUMBERS}"
