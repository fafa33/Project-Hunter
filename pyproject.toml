[build-system]
requires = ["hatchling"]
build-backend = "project_hunter_build"
backend-path = ["build_backend"]

[project]
name = "project-hunter"
version = "3.6.0"
description = "Project Hunter architecture and plugin infrastructure."
requires-python = ">=3.11"
dependencies = [
  # Issue #559: upstream cryptography dropped the Intel macOS (x86_64) wheel at 49.0.0 (CPython
  # macosx wheels since then are arm64-only; the last universal2 -- and so the last Intel-compatible
  # -- release was 48.0.1). The owner's Intel Mac is a required execution target, so it pins the
  # newest release that still ships a wheel for it; every other target keeps the current policy line.
  "cryptography>=50.0.0,<51; sys_platform != 'darwin' or platform_machine != 'x86_64'",
  "cryptography>=48.0.1,<49; sys_platform == 'darwin' and platform_machine == 'x86_64'",
  "pyyaml>=6.0,<7",
  "sqlalchemy>=2.0,<3",
]

[project.optional-dependencies]
dev = [
  "black>=26.3.1,<27",
  "mypy>=1.10,<2",
  "pytest>=9,<10",
  "pytest-xdist>=3.8,<4",
  "ruff>=0.6,<1",
  "types-PyYAML>=6,<7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/hunter"]

[project.entry-points."hunter.plugins"]
developer-intelligence = "hunter.intelligence.engines.developer:create_plugin"
macro-intelligence = "hunter.intelligence.engines.macro:create_plugin"
narrative-intelligence = "hunter.intelligence.engines.narrative:create_plugin"
news-intelligence = "hunter.intelligence.engines.news:create_plugin"
onchain-intelligence = "hunter.intelligence.engines.onchain:create_plugin"
protocol-intelligence = "hunter.intelligence.engines.protocol:create_plugin"
social-intelligence = "hunter.intelligence.engines.social:create_plugin"
whale-intelligence = "hunter.intelligence.engines.whale:create_plugin"

[project.scripts]
hunter = "hunter.__main__:main"

[tool.pytest.ini_options]
pythonpath = ["src", "scripts"]
testpaths = ["tests"]
# Issue #415: the parallel lane is deliberately NOT pinned here. The trusted
# default-branch controller executes this repository's `pytest` command inside a
# candidate tree using the *trusted* environment, so a candidate that pinned
# worker flags in its own pytest configuration would be demanding a plugin of an
# environment it does not provision -- and would make its own trusted validation
# unrunnable. Each boundary that runs the full suite in parallel declares the
# lane itself, as PYTEST_ADDOPTS, and installs the runner first. Issue #419 made
# the trusted default-branch controller one of those boundaries: it owns and
# provisions the runner for the candidate it validates, which is precisely why
# the declaration still may not live here. See docs/VALIDATION_STAGE_CONTRACT.md.

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.black]
line-length = 120
target-version = ["py311"]
extend-exclude = '''
(?x)(
  ^/?src/hunter/committee/repository\.py$
  | ^/?src/hunter/discovery/repository\.py$
  | ^/?src/hunter/evidence_assembly/repository\.py$
  | ^/?src/hunter/evidence_intelligence/model_adapter_persistence\.py$
  | ^/?src/hunter/evidence_intelligence/pre_model_persistence\.py$
  | ^/?src/hunter/evidence_intelligence/response_validator_corrections\.py$
  | ^/?src/hunter/evidence_intelligence/response_validator_persistence\.py$
  | ^/?src/hunter/evidence_intelligence/response_validator_terminal_persistence\.py$
  | ^/?src/hunter/automation/issue_agent_replacement_executor\.py$
  | ^/?src/hunter/evidence_intelligence/source_handling_persistence\.py$
  | ^/?tests/test_source_handling_production_runtime\.py$
  | ^/?tests/test_dashboard_api\.py$
  | ^/?tests/test_operational_status\.py$
)
'''

[tool.mypy]
python_version = "3.11"
files = ["src", "tests", "scripts"]
warn_unused_configs = true
disable_error_code = [
  "arg-type",
  "assignment",
  "attr-defined",
  "operator",
  "type-var",
  "union-attr",
  "var-annotated",
]
